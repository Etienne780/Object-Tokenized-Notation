rk__punctuation">;</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p><code>header.rowCount</code> counts the rows, <code>ranges</code> stores where they are in the temporary file. Rows that directly follow the last range of the same object extend it instead of adding a new range.</p>
<p>The temporary file only contains data rows: no <code>@version</code>, no object headers and no <code>@object</code> block. Every row is already formatted exactly as in the final file (tab, values, <code>;</code>, line break), so <code>Close()</code> can copy the bytes without changing them.</p>

<p>Step by step:</p>
<div class="table-wrapper"><table data-hover="row"><thead><tr><th>Call</th><th>Appended to <code>world.otn.tmp</code></th><th>Index in memory</th></tr></thead><tbody><tr><td><code>Open</code></td><td>- (file created empty, <code>world.otn</code> created empty)</td><td>-</td></tr><tr><td><code>BeginObject(&quot;Position&quot;)</code></td><td>-</td><td><code>Position</code>: 0 rows</td></tr><tr><td><code>WriteRow(1, Vector2{1, 2})</code></td><td>1. the <code>Vector2</code> row <code>1, 2;</code> at offset 0</td><td><code>Vector2</code>: 1 row, ranges <code>[0, 7]</code></td></tr><tr><td></td><td>2. the <code>Position</code> row <code>1, 0;</code> at offset 7 (<code>0</code> = <code>Vector2</code> row 0)</td><td><code>Position</code>: 1 row, ranges <code>[7, 7]</code></td></tr><tr><td><code>WriteRow(2, Vector2{3, 4})</code></td><td>1. <code>3, 4;</code> at offset 14</td><td><code>Vector2</code>: 2 rows, ranges <code>[0, 7] [14, 7]</code></td></tr><tr><td></td><td>2. <code>2, 1;</code> at offset 21</td><td><code>Position</code>: 2 rows, ranges <code>[7, 7] [21, 7]</code></td></tr><tr><td><code>EndObject</code></td><td>-</td><td>-</td></tr><tr><td><code>BeginObject(&quot;Vector2&quot;)</code></td><td>- (name exists, columns match)</td><td>-</td></tr><tr><td><code>WriteRow(5.0f, 6.0f)</code></td><td><code>5, 6;</code> at offset 28</td><td><code>Vector2</code>: 3 rows, ranges <code>[0, 7] [14, 7] [28, 7]</code></td></tr><tr><td><code>Close</code></td><td>see below</td><td></td></tr></tbody></table></div>
<p>A range is <code>[offset, length]</code> in bytes. Every row here is 7 bytes long: tab, <code>1, 2;</code> and the line break. A further <code>WriteRow(7.0f, 8.0f)</code> would directly follow the last <code>Vector2</code> range, so the range would grow to <code>[28, 14]</code> instead of adding a new one. A sub-object is always written before the row that references it, because the row needs its index.</p>
<p>Content of <code>world.otn.tmp</code> before <code>Close()</code> (<code>→</code> is a tab):</p>
<div class="code-block-wrapper"><pre><code>offset  bytes        object
0       →1, 2;\n     Vector2  row 0
7       →1, 0;\n     Position row 0
14      →3, 4;\n     Vector2  row 1
21      →2, 1;\n     Position row 1
28      →5, 6;\n     Vector2  row 2</code></pre><div class="code-language-tag code-language-tag--unrecognized">text</div></div>
<p>The rows of the two objects are mixed. Only the ranges in memory tell which bytes belong to which object. <code>std::ofstream</code> buffers the writes, so the file on disk can lag behind until it is closed.</p>
<p><strong>Close</strong></p>
<p><code>WriteFile</code> closes the temporary file and builds <code>world.otn</code>:</p>
<ol><li><code>WriteFileHeader</code>: <code>@version: 2;</code> and the start of <code>@object</code>.</li><li>For every block in the order of first use (<code>Position</code>, then <code>Vector2</code>): <code>WriteObjectHeader</code> with the final row count, then copy the ranges of the block from the temporary file (64 KB buffer).</li><li><code>WriteObjectBlockEnd</code>, then the temporary file is deleted.</li></ol>

<span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__other">	</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__number">5</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">,</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__other"> </span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__number">6</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">;</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__other">          ← copied from offset </span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__number">28</span>
<span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">}</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">;</span></span></pre><div class="code-language-tag code-language-tag--recognized">otn</div></div>
<p>(The arrows are only explanation, they are not in the file.)</p>
<p>Until <code>Close()</code> the target file <code>world.otn</code> stays empty.</p>
<p><strong>Sub-objects</strong></p>
<p><code>ConvertValue</code> replaces <code>OBJECT</code> values by row indices. <code>WriteSubObject</code> writes the sub-object first:</p>
<ul><li><code>m_objPtrToIndex</code> maps an <code>OTNObject*</code> to its first row index. A <code>weak_ptr</code> detects if the address was reused by a new object. A known object is not written again.</li><li><code>WriteObjectRows</code> converts all rows of the object (which writes its own sub-objects) and appends the finished rows in one piece, so the rows of one object get consecutive indices.</li><li><code>m_objectsInProgress</code> contains the objects that are being converted. Finding one of them again means the object contains itself, which is an error.</li></ul>
<p><strong>Blocks with the same name</strong></p>
<p><code>GetBlock</code> returns the block of a name or creates it. An existing block must have the same column names and types. A deduced type of an empty list (<code>UNKNOWN[]</code>) is accepted for every list type with at least that depth. New blocks are checked with <code>WriteObjectHeader</code> right away, so invalid column types are reported before any row is written.</p>
<p><strong>Memory</strong></p>
<p>Memory use is the index (one <code>RowRange</code> per range) plus the object that is currently converted. If two objects alternate row by row, every row gets its own range (16 bytes).</p></div>

  <div class="main" data-node-id="node_mu55p95x1r773m4107y4xr" data-tab-id="tab_mu55p95x1a6rhrm1czr561">

    <div class="export-section__body"><h1>Reader Internals</h1>
<p>Both readers use the <code>Tokenizer</code> and the version dependent <code>ReadSyntax</code> table (see <a class="doc-ref" href="#node_g8d1z5k3n7vxe2qb6ycu" data-ref-node="node_g8d1z5k3n7vxe2qb6ycu" title="Syntax Layer">Syntax Layer</a>). They differ in what they keep in memory.</p>
<h2>OTNReader</h2>
<p><strong>Reading</strong></p>
<p><code>ReadFile</code> loads the file into a string, <code>ReadString</code> uses the given text. <code>ReadData</code> then:</p>
<ol><li>reads <code>@version</code> with <code>ReadVersion</code> and gets the <code>ReadSyntax</code> for this version,</li><li>reads the file header (<code>@defType</code>, <code>@defName</code>, start of <code>@object</code>),</li><li>reads every object: <code>readObjectHeader</code>, then <code>rowCount</code> times <code>readRow</code>,</li><li>checks the end of the <code>@object</code> block.</li></ol>
<p>Every object becomes an <code>OTNObject</code> in <code>ReaderData::objects</code>. A second object with the same name is an error.</p>
<p><strong>Resolving references</strong></p>
<p>While reading, a <code>Ref&lt;X&gt;</code> value is an <code>OBJECT_REF</code> value (object name and row index). <code>ResolveObjectRefs</code> replaces them by <code>OBJECT</code> values after all objects are read, so references to objects later in the file work:</p>
<ol><li>Find the object and check the row index.</li><li>Copy the referenced row and resolve its references first (recursion).</li><li>Create an <code>OTNObject</code> with this one row and the columns of the target.</li></ol>
<p>The <code>RefStack</code> contains the rows that are currently being resolved. Reaching one of them again is a cycle and an error.</p>
<h2>OTNStreamReader</h2>
<p><strong>Scan</strong></p>
<p><code>Open</code> reads the file once from start to end (<code>CharSource::OpenFile</code>, read in 64 KB blocks) and creates the index:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">struct</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">ObjectInfo</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">Detail</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">ObjectHeaderInfo</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">header</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">              </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// name, row count, columns</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">vector</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">Detail</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">FilePosition</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&gt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">rowCheckpoints</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// row 0, 1024, 2048, ...</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">}</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p>Rows are only skipped (<code>skipRow</code>), not converted. Only every 1024th row position is stored, so the index stays small for large files.</p>
<p><strong>Reading rows</strong></p>
<ul><li><code>NextObject</code> / <code>ReadRow</code> keep a current object and row. <code>ReadRow</code> reads the next row at the tokenizer position.</li><li><code>ReadObjectRow(name, row)</code> seeks to checkpoint <code>row / 1024</code>, skips up to 1023 rows and reads the row. The sequential position is saved and restored around it.</li><li><code>ReadObject</code> reads all rows of one object into an <code>OTNObject</code>.</li></ul>
<p><strong>Resolving references</strong></p>
<p>With <code>SetResolveObjectRefs(true)</code> (default) every <code>OBJECT_REF</code> in a returned row is replaced by an <code>OTNObject</code>: <code>LoadObjectRow</code> reads the referenced row with the same seek logic and resolves its references recursively. A stack of <code>RowKey</code>s (object name and row) detects cycles.</p>
<p><strong>Changed files</strong></p>
<p><code>NextObject</code>, <code>ReadObject</code>, <code>ReadObjectRow</code> and <code>GetObjectNames</code> call <code>EnsureUpToDate</code>. It compares the file size and modification time with the values from the scan. If they differ, <code>Scan</code> runs again. The current object is found by name and the row position is restored. If the object is gone or has fewer rows than already read, the reader reports an error.</p>
<p><strong>Memory</strong></p>
<p>The reader keeps the index (one <code>FilePosition</code> per 1024 rows and object) and up to 4 blocks of 64 KB of the file, the last used ones. Reading references jumps between objects, the blocks of both stay loaded. For every object the position behind the last loaded row is kept, so references that are read in order need no skipping from the checkpoint. Rows are only in memory while they are returned.</p>
<p><code>ReadRow</code> and <code>SkipCurrentObject</code> do not call <code>EnsureUpToDate</code>, the file check took longer than reading a row.</p></div>

  var nodeAliases = {};
  var firstNode = {"id":"node_mu55p95x7rsejz9hraxp","tabId":"tab_mu55p95xy2tfxuvim3p9"};
  var searchIndex = [{"nodeId":"node_mu55p95x7rsejz9hraxp","tabId":"tab_mu55p95xy2tfxuvim3p9","title":"Getting Started","headings":["Getting Started","Setup","First example","Which class to use"],"content":"OTN (Object Tokenized Notation) is a text format for structured data. Data is stored in named objects . Every object works like a table: it has typed columns and any number of rows. Objects can reference rows of other objects, so nested C++ structs can be stored without repeating data. ```otn @version: 2; @object: { Items[2] { int/id, String/name, float/value }; 1, \"Sword\", 42.5; 2, \"Shield\", 17.25; }; ``` The library consists of two files: - `OTNFile.h` - the public API - `OTNFile.cpp` - the implementation Add both to your project and include the header: ```cpp #include \"OTNFile.h\" ``` Requirements: - C++17 or later - Tested with MSVC (Windows) and GCC (Linux) Build an object, write it to a file and read it back: ```cpp // write OTN::OTNObject items{ \"Items\" }; items.SetNames(\"id\", \"name\", \"value\") .AddDataRow(1, \"Sword\", 42.5f) .AddDataRow(2, \"Shield\", 17.25f); OTN::OTNWriter writer; if (!writer.AppendObject(items).Save(\"data.otn\")) std::cerr << writer.GetError() << '\\n'; // read OTN::OTNReader reader; if (reader.ReadFile(\"data.otn\")) { if (auto obj = reader.TryGetObject(\"Items\")) { std::string name = obj- GetValue<std::string (0, \"name\", \"\"); float value = obj- GetValue<float (0, \"value\", 0.0f); } } ``` The `.otn` extension is added automatically if a path has no extension. | Class | Use it for | |---|---| | `OTNObject` | Building and reading the data of one object (table) in memory | | `OTNWriter` | Writing objects that are completely in memory, see Writing Data | | `OTNReader` | Reading a whole file into memory, see Reading Data | | `OTNStreamWriter` | Writing large data row by row, see Stream Writer | | `OTNStreamReader` | Reading large files row by row or with random access, see Stream Reader | Your own structs are stored with a small template specialization, see Custom Types. All classes report errors without exceptions, see Error Handling."},{"nodeId":"node_mu55p95xweb2mx16dzzse","tabId":"tab_mu55p95xy2tfxuvim3p9","title":"Writing Data","headings":["Writing Data","Building an object","Column types","Saving","Nested objects","Writer options","Errors"],"content":"Build your data with `OTNObject`, then save it with `OTNWriter`. `OTNWriter` keeps all objects in memory until `ClearObjects()` is called. For data that does not fit into memory use the Stream Writer. ```cpp OTN::OTNObject items{ \"Items\" }; items.SetNames(\"id\", \"name\", \"value\") .AddDataRow(1, \"Sword\", 42.5f) .AddDataRow(2, \"Shield\", 17.25f) .AddDataRow(3, \"Bow\", 8.0f); ``` - `SetNames` defines the columns. Names must be unique and may contain letters, digits, ` ` and UTF-8 characters, but must not start with a digit (see Types). - Every `AddDataRow` adds one row. The number of values must match the number of columns. - `AddDataRowList(row)` adds a prepared `OTNRow`, `ReserveDataRows(n)` reserves memory for `n` rows. Without `SetTypes()` the column types are deduced from the first row . Every following row must use the same types. If the first row contains an empty list, the writer takes the element type from the next row that has one. To set the types yourself, call `SetTypes()` before the first `AddDataRow()`: ```cpp items.SetNames(\"id\", \"name\", \"value\") .SetTypes(\"int\", \"String\", \"double\") .AddDataRow(1, \"Sword\", 42.5); ``` Use `\"-\"`, `\" \"` or `\"\"` for a column whose type should still be deduced from the first row. All type strings are listed in Types. Explicit types are useful when: - all rows contain empty lists in a column (its element type cannot be deduced), - a column should accept different value types (`any`), - an object has no rows but should still be written with its columns. ```cpp OTN::OTNWriter writer; writer.AppendObject(items) .AppendObject(enemies) .Save(\"gamedata.otn\"); ``` - `AppendObject` copies the object, later changes to `items` are not written. - Every object name may only be used once per file. - Missing folders are created. A path without extension gets `.otn`, any other extension is an error. To get the text instead of a file: ```cpp std::string text; if (writer.SaveToString(text)) { // text contains the complete file } ``` `ClearObjects()` removes all appended objects, so the writer can be reused for another file. `Reset()` also removes the error state, for example after a failed `Save()`. The options stay in both cases. Values can be other `OTNObject`s or your own types (Custom Types). They are written as their own objects and referenced by row index: ```cpp OTN::OTNObject inventory{ \"Item\" }; inventory.SetNames(\"name\", \"qty\") .AddDataRow(\"Sword\", 1) .AddDataRow(\"Potion\", 5); OTN::OTNObject player{ \"Player\" }; player.SetNames(\"name\", \"pos\", \"inventory\") .AddDataRow(\"Hero\", Vector2{ 1, 2 }, inventory); ``` ```otn @version: 2; @object: { Item[2] { String/name, int/qty }; \"Sword\", 1; \"Potion\", 5; Vector2[1] { float/x, float/y }; 1, 2; Player[1] { String/name, Ref<Vector2 /pos, Ref<Item []/inventory }; \"Hero\", 0, [0, 1]; }; ``` An `OTNObject` with several rows is stored as a list of references (`Ref<Item []`), so it has to be read back as a list. See Reading Data. All options are set before `Save()` and can be chained. | Method | Default | Effect | |---|---|---| | `UseDefType(true)` | off | Often used type names are replaced by numbers to save storage (`@defType`) | | `UseDefName(true)` | off | Often used column names are replaced by numbers to save storage (`@defName`) | | `UseOptimizations(true)` | off | No spaces, line breaks and indentation to save storage if readability is not needed | | `UseDeduplicateRows(true)` | off | Identical rows of an object are written once and referenced multiple times to save storage | ```cpp writer.UseDefName(true) .UseDefType(true) .UseOptimizations(true) .AppendObject(items) .Save(\"data.otn\"); ``` A type or name is only replaced if the saved characters are more than its entry in `@defType` / `@defName` costs, so these options never make the file longer. Small files often get no numbers at all. The output of all options is shown in File Format. With deduplication, identical rows are stored once per object. Two `Vector2{ 1, 2 }` values in different rows become one `Vector2` row that both rows reference. This also applies to the rows of the objects you append yourself: identical rows there are only written once. `Save()` and `SaveToString()` return `false` on errors, the reason is returned by `GetError()`: ```cpp if (!writer.Save(\"data.otn\")) std::cerr << writer.GetError() << '\\n'; ``` An `OTNObject` with an error (for example a row with the wrong number of values) is not written, `Save()` fails and `GetError()` names the object. Use `Reset()` to write another file with the same writer. See Error Handling. Before the file is opened, every value is checked against its column, so a written file can always be read again. `Save()` fails (and an existing file is not changed) if: - a value does not match its column type, for example a string in an `int` column or a number that does not fit, - a float or double value is NaN or infinite (the format has no literal for them), - two different objects use the same name, for example an appended object and a custom type with other columns."},{"nodeId":"node_mu55p95x1j1aoqjvokje3","tabId":"tab_mu55p95xy2tfxuvim3p9","title":"Reading Data","headings":["Reading Data","Reading a file","Getting objects","Reading values","The type has to match","Lists","Nested objects"],"content":"`OTNReader` reads a complete file into memory. After reading, all objects are available by name and all references between objects are resolved. For large files use the Stream Reader. ```cpp OTN::OTNReader reader; if (!reader.ReadFile(\"data.otn\")) { std::cerr << reader.GetError() << '\\n'; return; } ``` `ReadString(text)` reads from a string instead of a file. `GetVersion()` returns the format version of the file. If anything in the file is invalid, reading fails. Do not use the objects of a failed read, they can be incomplete. The error message contains the line and column of the problem, see Error Handling. Every `ReadFile` / `ReadString` starts with a new state, so the same reader can read the next file after an error. ```cpp std::optional<OTN::OTNObject items = reader.TryGetObject(\"Items\"); if (!items) { // no object with this name } ``` `TryGetObject` returns a copy. `FindObject` returns a pointer to the stored object instead, `nullptr` if the name does not exist: ```cpp if (const OTN::OTNObject items = reader.FindObject(\"Items\")) { float value = items- GetValue<float (0, \"value\", 0.0f); } ``` The pointer is valid until the next `ReadFile` / `ReadString` or until the reader is destroyed. `GetObjects()` returns all objects: ```cpp for (const auto& [name, object] : reader.GetObjects()) { // ... } ``` Values are read by row index and column name or column index. There are three variants: | Call | On error | |---|---| | `GetValue<T (row, column)` | Throws `std::out of range` (row or column missing) or `std::bad cast` (wrong type) | | `GetValue<T (row, column, default)` | Returns `default` | | `TryGetValue<T (row, column)` | Returns `std::nullopt` | ```cpp int id = items- GetValue<int (0, \"id\"); float value = items- GetValue<float (0, \"value\", 0.0f); std::optional<std::string name = items- TryGetValue<std::string (0, 1); ``` Iterating all rows: ```cpp for (size t row = 0; row < items- GetRowCount(); ++row) { int id = items- GetValue<int (row, \"id\", -1); } ``` `GetColumnNames()`, `GetColumnTypesDesc()` and `GetColumnCount()` describe the columns of an object. `T` must be the type of the column. A `float` column can only be read as `float`, not as `double` or `int`. The exception are `any` columns. They store numbers without a fixed type, so a number from an `any` column can be read as every number type, as long as the value fits (`3.5` cannot be read as `int`, `5000000000` not as `int` but as `int64 t`). See Types. A list column is read as `std::vector`: ```cpp auto tags = items- TryGetValue<std::vector<int (0, \"tags\"); auto grid = items- TryGetValue<std::vector<std::vector<float (0, \"grid\"); ``` Columns that reference other objects are read as the referenced type: ```cpp auto pos = player- TryGetValue<Vector2 (0, \"pos\"); // custom type auto path = player- TryGetValue<std::vector<Vector2 (0, \"path\"); // list of custom types auto inv = player- TryGetValue<std::vector<OTN::OTNObject (0, \"inventory\"); ``` An `OTNObject` with more than one row was written as a list of references (`Ref<Item []`, see Writing Data). Such a column must be read as `std::vector<OTN::OTNObject ` or `std::vector<YourType `. Every element contains one row. A reference to a row that does not exist, or a cycle of references (`A` references `B`, `B` references `A`), is a read error."},{"nodeId":"node_mu55p95xk2i6alcuiyw","tabId":"tab_mu55p95xy2tfxuvim3p9","title":"Custom Types","headings":["Custom Types","Defining a type","Using a type","Nested types","Column types","Different code for saving and loading","Rules"],"content":"Your own structs can be used like any other value. You only have to specialize `OTN::ToOTNDataType<T ` once. The same function is used for saving and for loading. ```cpp struct Vector2 { float x = 0; float y = 0; }; template< inline void OTN::ToOTNDataType<Vector2 (OTN::OTNObjectBuilder& obj, Vector2& v) { obj.SetObjectName(\"Vector2\"); obj.AddNames(\"x\", \"y\"); obj.AddData(v.x, v.y); } ``` Put the specialization into a header that is included everywhere the type is written or read. - `SetObjectName` sets the name of the object that stores all values of this type. - `AddNames` sets the column names. - `AddData` reads the members when saving and writes them when loading. `AddNameData(\"x\", v.x)` combines `AddNames` and `AddData` for one column. ```cpp OTN::OTNObject entities{ \"Entities\" }; entities.SetNames(\"id\", \"position\", \"path\") .AddDataRow(1, Vector2{ 10, 20 }, std::vector<Vector2 { { 0, 0 }, { 1, 2 } }); ``` Every value becomes one row of the object `Vector2`. The column stores the row index: ```otn @version: 2; @object: { Vector2[3] { float/x, float/y }; 10, 20; 0, 0; 1, 2; Entities[1] { int/id, Ref<Vector2 /position, Ref<Vector2 []/path }; 1, 0, [1, 2]; }; ``` Reading back: ```cpp auto position = entities- TryGetValue<Vector2 (0, \"position\"); auto path = entities- TryGetValue<std::vector<Vector2 (0, \"path\"); ``` Custom types work with `OTNWriter`, `OTNStreamWriter` (also in `WriteRow`), `OTNReader` and `OTNStreamReader`. They can also be stored in `any` columns, together with other values (see Types). A type can contain other custom types, lists and strings: ```cpp struct Transform { Vector2 position; float rotation = 0; std::vector<std::string tags; }; template< inline void OTN::ToOTNDataType<Transform (OTN::OTNObjectBuilder& obj, Transform& t) { obj.SetObjectName(\"Transform\"); obj.AddNames(\"position\", \"rotation\", \"tags\"); obj.AddData(t.position, t.rotation, t.tags); } ``` The column types are deduced from the values. Set them yourself when this is not possible: - a list member that is empty in all values (no element type), - a member that should be stored in an `any` column. ```cpp struct Setting { std::vector<std::string tags; double value = 0; int id = 0; }; template< inline void OTN::ToOTNDataType<Setting (OTN::OTNObjectBuilder& obj, Setting& s) { obj.SetObjectName(\"Setting\"); obj.AddNames(\"tags\", \"value\"); obj.AddTypes(\"String[]\", \"any\"); obj.AddData(s.tags, s.value); obj.AddNameTypeData(\"id\", \"-\", s.id); } ``` - `AddTypes` sets the types of the next columns, in the same order as `AddNames`. The type strings are the same as in `SetTypes` (Types). - `AddNameTypeData(name, type, value)` adds name, type and value of one column. - `\"-\"` deduces the type of a column from the value. Columns without a type are deduced as well. - The types must match the values, otherwise the value is invalid. - When loading, the types are ignored. Numbers in `any` columns are converted to the member type, so `value` can be a `double` even if `3` was stored. `IsBuildingOTNObject()` returns `true` while saving. Use it when the stored form differs from the struct: ```cpp template< inline void OTN::ToOTNDataType<Vector2 (OTN::OTNObjectBuilder& obj, Vector2& v) { obj.SetObjectName(\"Vector2\"); obj.AddNames(\"coords\"); if (obj.IsBuildingOTNObject()) { // saving: store x and y as one list obj.AddData(std::vector<float { v.x, v.y }); } else { // loading: unpack the list std::vector<float coords; obj.AddData(coords); if (coords.size() = 2) { v.x = coords[0]; v.y = coords[1]; } } } ``` - The type needs a default constructor , it is created before loading. - When loading, values are assigned by position in the order of the `AddData` calls, not by name. Changing the order or the types of `AddData` makes existing files unreadable. - All values of a type end up in one object. Use the same `SetObjectName` and the same columns for every value of the type. - The object name and column names may contain letters, digits, ` ` and UTF-8 characters and must not start with a digit."},{"nodeId":"node_q7k2m9x4w1btr8vz3hpd","tabId":"tab_mu55p95xy2tfxuvim3p9","title":"Stream Writer","headings":["Stream Writer","Writing rows","Writing complete objects","The file is written on Close","Same object name multiple times","References by index","Duplicates","Limits"],"content":"`OTNStreamWriter` writes data row by row. Rows are not kept in memory, so the amount of data is only limited by the disk. Use it when the data does not fit into memory or is produced step by step. Otherwise `OTNWriter` is simpler, see Writing Data. ```cpp OTN::OTNStreamWriter writer; writer.Open(\"enemies.otn\"); writer.BeginObject(\"Enemy\", OTN::col(\"name\", \"String\"), OTN::col(\"hp\", \"int\"), OTN::col(\"pos\", \"Vector2\"), OTN::col(\"path\", \"Vector2[]\")); for (const Enemy& e : enemies) writer.WriteRow(e.name, e.hp, e.pos, e.path); writer.EndObject(); if (!writer.Close()) std::cerr << writer.GetError() << '\\n'; ``` - `BeginObject` defines the columns. The types use the same strings as `SetTypes`, see Types. Instead of `OTN::col(...)` two vectors with names and types can be passed. - `WriteRow` takes one value per column. `WriteRowList(row)` takes a prepared `OTNRow`. - Custom types (Custom Types) and `OTNObject`s can be written directly. They are stored as rows of their own object, the column stores the row index. - `EndObject` finishes the object. `Close` writes the file. `AppendObject` writes an `OTNObject` including all nested objects: ```cpp writer.AppendObject(players); ``` `BeginObject` / `WriteRow` and `AppendObject` can be mixed freely, but `AppendObject` cannot be called while an object is open. All rows are first collected in a temporary file next to the target (`enemies.otn.tmp`). `Close()` builds the real file from it and deletes the temporary file. The destructor calls `Close()` as well. An example of the temporary file and how the final file is built from it is in Writer Internals. Until `Close()`: - the target file is empty, - disk space for the data is needed twice (temporary file and target file) while `Close()` copies the rows, - if the program crashes, only the temporary file contains the data. Rows can be added to an object at any time. `BeginObject` with a name that already has rows, `AppendObject` with an object of the same name or a custom type used in several places all add rows to the same object: ```cpp writer.BeginObject(\"Vector2\", OTN::col(\"x\", \"float\"), OTN::col(\"y\", \"float\")); writer.WriteRow(9.0f, 10.0f); // added to the Vector2 rows written by WriteRow above writer.EndObject(); ``` The column names and types must be the same every time, otherwise it is an error. Instead of a value, a reference column can also get the row index of an existing row. `GetWrittenRowCount(name)` returns the number of rows of an object written so far, which is the index of the next row: ```cpp size t statsIndex = writer.GetWrittenRowCount(\"WeaponStats\"); writer.BeginObject(\"WeaponStats\", OTN::col(\"damage\", \"float\"), OTN::col(\"speed\", \"float\")); writer.WriteRow(15.5f, 1.2f); writer.EndObject(); writer.BeginObject(\"Weapon\", OTN::col(\"name\", \"String\"), OTN::col(\"stats\", \"WeaponStats\")); writer.WriteRow(std::string(\"Sword\"), statsIndex); writer.EndObject(); ``` The same object instance is written only once: an `OTNObject` that is referenced from several rows gets one set of rows, all references point to it. Values (like two equal `Vector2`) are written as separate rows. There is no `UseDeduplicateRows` option. - `UseDefType`, `UseDefName` and `UseOptimizations` are not available. - An object that contains itself (directly or through other objects) is an error. - Object, column and type names are checked in `BeginObject`, the values of every row against the column types (see Types). A value that does not match its column (for example a string in an `int` column, NaN or infinity) is an error. - After an error the writer stays invalid. `Close()` still writes all rows that were written successfully. - `Open()` on an open writer closes the current file first. Files of `OTNStreamWriter` can be read with `OTNReader` and `OTNStreamReader`."},{"nodeId":"node_c5n8r2v6y0dkf3wq7jtm","tabId":"tab_mu55p95xy2tfxuvim3p9","title":"Stream Reader","headings":["Stream Reader","Opening a file","Reading row by row","Random access","Object references","Changed files","Errors"],"content":"`OTNStreamReader` reads large files without loading them into memory. Rows can be read one after another or directly by object name and row index. For small files `OTNReader` is simpler, see Reading Data. ```cpp OTN::OTNStreamReader reader; if (!reader.Open(\"world.otn\")) { std::cerr << reader.GetError() << '\\n'; return; } for (const std::string& name : reader.GetObjectNames()) std::cout << name << '\\n'; ``` `Open` scans the file once and builds a small index: the objects with their columns and row counts, and the file position of every 1024th row. The rows themselves are not kept in memory. ```cpp while (reader.NextObject()) { std::cout << reader.GetCurrentObjectName() << \": \" << reader.GetRemainingRowCount() << \" rows\\n\"; OTN::OTNRow row; while (reader.ReadRow(row)) { int id = std::get<int (row[0].value); // ... } } ``` - `NextObject` moves to the next object. Rows that were not read are skipped. `SkipCurrentObject` skips them explicitly. - `ReadRow` returns the values of the next row as `OTNValue`s. The type of a value is in `row[i].type`, the value is read with `std::get`. - `GetColumnNames()`, `GetColumnTypes()`, `GetRemainingRowCount()`, `HasMoreRows()` and `HasMoreObjects()` describe the current position. Any row or object can be read directly, independent of the current position: ```cpp std::optional<OTN::OTNObject row = reader.ReadObjectRow(\"Enemy\", 5000); if (row) { std::string name = row- GetValue<std::string (0, \"name\", \"\"); auto pos = row- TryGetValue<Vector2 (0, \"pos\"); } std::optional<OTN::OTNObject config = reader.ReadObject(\"Config\"); ``` - `ReadObjectRow` returns an `OTNObject` with exactly this one row. Values are read with `GetValue` / `TryGetValue` like after `OTNReader`. - `ReadObject` loads a complete object into memory, so only use it for small objects. - Both return `std::nullopt` if the object or row does not exist. To find a row, the reader jumps to the closest stored position and reads at most 1023 rows from there. References are resolved by default: a `Ref<Vector2 ` value is loaded as an `OTNObject` with the referenced row (references inside it are resolved as well). Therefore custom types can be read from `ReadObjectRow` results with `TryGetValue<Vector2 `. Every resolved reference reads its row from the file. If you only need the indices, turn it off: ```cpp reader.SetResolveObjectRefs(false); ``` Reference values then have the type `OTNBaseType::OBJECT REF` and contain the name of the referenced object and the row index. A reference to a row that does not exist and cyclic references are errors. `NextObject`, `ReadObject`, `ReadObjectRow` and `GetObjectNames` check the size and modification time of the file. If the file was changed (for example written again by an `OTNStreamWriter`), it is scanned again and the reader continues at the same object and row. If the current object no longer exists, the reader reports an error. `ReadRow` and `SkipCurrentObject` do not check the file, the check would take longer than reading the row. The file must not be changed while the rows of an object are read. On an error (invalid file, missing object in a reference, ...) the reader becomes invalid and all further reads return `false` / `std::nullopt`. `GetError()` returns the reason with the line and column in the file. See Error Handling."},{"nodeId":"node_h4t9b1s6e3xan7pk2rwc","tabId":"tab_mu55p95xy2tfxuvim3p9","title":"Error Handling","headings":["Error Handling","After an error","OTNObject","OTN_DEBUG","Exceptions"],"content":"The library does not use exceptions to report errors. Every class has an error state instead: | Method | Returns | |---|---| | `IsValid()` | `false` after an error | | `GetError()` | All error messages, separated by line breaks | | `TryGetError(out)` | `true` and the messages in `out` if there was an error | Functions that can fail (`Save`, `ReadFile`, `Open`, `WriteRow`, …) also return `false` or `std::nullopt`. ```cpp OTN::OTNReader reader; if (!reader.ReadFile(\"data.otn\")) std::cerr << reader.GetError() << '\\n'; ``` Read errors contain the position in the file: ```text Error at line 7, column 12: unexpected token IDENTIFIER(\"abc\"), expected ';' ``` After an error all following calls fail until the state is reset: | Class | Reset | |---|---| | `OTNObject` | Create a new object | | `OTNWriter` | `Reset()` removes the error and all objects, the options stay | | `OTNReader` | Every `ReadFile` / `ReadString` starts with a new state | | `OTNStreamWriter` | `Open()` starts with a new state | | `OTNStreamReader` | `Open()` starts with a new state | ```cpp OTN::OTNWriter writer; if (!writer.AppendObject(obj).Save(\"data.otn\")) { std::cerr << writer.GetError() << '\\n'; writer.Reset(); // ready for the next file } ``` `OTNWriter` is not reset by `Save()` itself, so an error of `AppendObject` (for example a name that is used twice) is still reported by the next `Save()`. Adding a row with the wrong number of values, an invalid custom type or invalid names makes the object invalid. Check it before writing: ```cpp if (!obj.IsValid()) std::cerr << obj.GetError() << '\\n'; ``` These checks always run: - object and column names are valid (see Types) and column names are unique, - `SetNames` / `SetTypes` are called before the first row, - every row has one value per column, - `OTNWriter` gets no invalid objects and no two objects with the same name, - explicit types of custom types (`AddTypes`) match the values. Some checks cost time for every row or value, so they only run if `OTN DEBUG` is `1`: - every row has the types of its columns, - the column names of a custom type are unique. By default `OTN DEBUG` is `1` in debug builds (without `NDEBUG`) and `0` otherwise. To change it, define it in the build system, for example in premake: ```lua defines { \"OTN DEBUG=1\" } ``` The value must be the same for all files of the program, because `OTNFile.h` and `OTNFile.cpp` both use it. Only reading values can throw: - `GetValue<T (row, column)` throws `std::out of range` if the row or column does not exist and `std::bad cast` if the value does not have the type `T`. - `GetRow(index)` throws `std::out of range`. `GetValue<T (row, column, default)` and `TryGetValue<T (row, column)` never throw. File system errors are reported as normal errors: missing folders and files, missing rights, failed reads and writes, also when the file is closed (for example a full disk). Only running out of memory (`std::bad alloc`) is not caught."},{"nodeId":"node_mu55p95x1mur4st1tuzfby","tabId":"tab_ujzde8gxd6ncf10epf91","title":"File Format","headings":["File Format","Structure","Objects","Types","References","References in any columns","DefType and DefName","Compact form","File names","Versions"],"content":"An `.otn` file is UTF-8 text. It starts with a header of directives, followed by one `@object` block that contains all objects. ```otn @version: 2; @object: { Items[2] { int/id, String/name, float/value }; 1, \"Sword\", 42.5; 2, \"Shield\", 17.25; Enemies[1] { int/id, String/name, float/value }; 1, \"Goblin\", 3.5; }; ``` Spaces, tabs and line breaks between tokens have no meaning. Comments are not supported. A UTF-8 byte order mark at the start is allowed, UTF-16 and UTF-32 files are not (see Types). | Part | Required | Content | |---|---|---| | `@version: N;` | yes | Format version, always the first statement. Files are written with version `2`, versions `1` and `2` can be read (see File versions). | | `@defType: …;` | no | Numbers for type names, see DefType and DefName | | `@defName: …;` | no | Numbers for column names | | `@object: { … };` | yes | All objects. Nothing may follow after the closing `};`. | `@defType` and `@defName` stand between `@version` and `@object`, in any order. Unknown directives are an error. ```otn Name[rowCount] { type/column, type/column, ... }; value, value, ...; value, value, ...; ``` - `Name` is the object name. Every name may only appear once per file. Names consist of letters, digits, ` ` and UTF-8 characters and do not start with a digit. - `rowCount` is the exact number of rows that follow. - The header lists every column as `type/name`, separated by commas. - Every row has one value per column, separated by commas and ended by `;`. Objects can appear in any order. A reference may point to an object that comes later in the file. | Type in the file | Values | |---|---| | `int`, `int64`, `uint64` | Integers: `42`, `-7` | | `float`, `double` | Numbers: `1.5`, `-0.25`, `3` | | `bool` | `true`, `false` | | `String` | `\"text\"` with the escapes `\\\"`, `\\\\`, `\\n`, `\\t` | | `any` | Number, string, `true`/`false`, reference `Name#index` or a list of these | | `Ref<Name ` | Row index in the object `Name`: `0`, `5` | | `T[]`, `T[][]`, … | Lists: `[1, 2, 3]`, `[[1, 2], [3]]`, `[]` | Integers are checked strictly: `3.5` in an `int` column or a value outside the range of the type is an error. Numbers in `any` columns get the smallest type that fits: `int`, then `int64`, then `uint64`. Numbers with a decimal point or exponent become `double`. See Types. A `Ref<Name ` column stores row indices of the object `Name`: ```otn Vector2[3] { float/x, float/y }; 10, 20; 0, 0; 1, 2; Entities[1] { int/id, Ref<Vector2 /position, Ref<Vector2 []/path }; 1, 0, [1, 2]; ``` `position` is row 0 of `Vector2`, `path` the rows 1 and 2. When reading, an index that does not exist in the target object is an error. An `any` column has no object type, so a reference contains the object name: `Name#index`. ```otn Values[5] { any/value }; 42; Vector2#0; [Vector2#1, Vector2#2]; [Item#0, Item#1]; \"text\"; ``` - `Vector2#0` is row 0 of `Vector2`, a single custom type value. - A list of custom type values is a list of references. - An `OTNObject` with several rows is a list of references to all its rows (`[Item#0, Item#1]`). Like in `Ref` columns, a missing object or row is an error when reading. With `UseDefType(true)` / `UseDefName(true)` the writer replaces type and column names by numbers where this makes the file shorter: ```otn @version: 2; @defType: String = 0, float = 1; @object: { Quests[1] { int/id, 0/name, 1/value }; 1, \"A\", 1.5; Npcs[1] { int/id, 0/name, 1/value }; 1, \"A\", 1.5; Enemies[1] { int/id, 0/name, 1/value }; 1, \"A\", 1.5; Items[1] { int/id, 0/name, 1/value }; 1, \"A\", 1.5; }; ``` Every entry is `name = number`. In the object headers the number can stand in place of the type or the column name: `1/value` means `float/value`, with `@defName` the name can be a number as well (`1/0`). A number that is not defined is an error. A name only gets a number if the characters saved by all its uses are more than the entry costs (`String = 0, `), and the table as a whole has to pay for the directive (`@defType: ;`) too. Names that save the most get the smallest numbers. In the example `int` (3 characters) and the column names are not replaced, because they would not save enough. So the file is never longer than without these options. `@defType` can also contain object names. Then the number replaces `Ref<Name ` in the header and the name in references of `any` columns: ```otn @version: 2; @defType: Vector2 = 0; @object: { Vector2[12] { float/x, float/y }; 0, 0; 0, 0; 1, 0; 0, 1; ... Points[6] { 0/pos, any/extra }; 0, 0#1; 2, 0#3; 4, 0#5; ... }; ``` `0/pos` means `Ref<Vector2 /pos`, `0#1` means `Vector2#1`. For object names every reference in an `any` column counts as a use, so they get a number quickly. A number in front of `#` that stands for a type like `float` is an error. With `UseOptimizations(true)` all optional spaces and line breaks are removed: ```otn @version:2;@object:{Items[2]{int/id,String/name,float/value};1,\"Sword\",42.5;2,\"Shield\",17.25;}; ``` The extension is `.otn`. A path without an extension gets `.otn`, a different extension is an error. `OTNStreamWriter` uses a temporary file with the extension `.otn.tmp` next to the target file while writing. The writers always write the newest version. The readers read every version, the version is taken from `@version`. | Version | Changes | |---|---| | `1` | First version | | `2` | References in `any` columns (`Name#index`), object names in `@defType` | A version 1 file is still valid in version 2. A file that uses version 2 syntax with `@version: 1` is an error."},{"nodeId":"node_w3f6j0p8u2lcy5mx9tbe","tabId":"tab_ujzde8gxd6ncf10epf91","title":"Types","headings":["Types","Type strings","Deduced types","Reading values","any","Names","Text encoding"],"content":"Every column has a type. It is deduced from the first row or set with `SetTypes()` (`OTNObject`) and `BeginObject()` (`OTNStreamWriter`). | Type string | C++ type | Note | |---|---|---| | `int` | `int` | | | `int64` | `int64 t` | `uint32 t` / `unsigned int` values are stored as `int64` | | `uint64` | `uint64 t` | | | `float` | `float` | | | `double` | `double` | | | `bool` | `bool` | | | `String` | `std::string` | `const char ` and string literals are stored as `String` | | `any` | number, `std::string`, `bool`, custom type, `OTNObject` | The type is not fixed, see below | | `Name` | custom type or `OTNObject` | Reference to the object `Name`, see Custom Types | | `T[]` | `std::vector<T `, `std::array<T, N ` | One `[]` per nesting level: `int[][]` | `Name` is any other name, for example `\"Vector2\"` or `\"Vector2[]\"`. In the file it is written as `Ref<Vector2 `. Without `SetTypes()` the type of every column is taken from the value in the first row: ```cpp obj.SetNames(\"a\", \"b\", \"c\", \"d\") .AddDataRow(1, \"text\", std::vector<float { 1.0f }, Vector2{}); // int, String, float[], Vector2 ``` An empty list has no element type. The writers then take the type from the next row with a non empty list. If the list is empty in all rows, set the type with `SetTypes()` (or `AddTypes()` in a custom type). `GetValue<T ` and `TryGetValue<T ` only succeed if `T` is the stored type. `int` cannot be read as `int64 t` or `float`, `float` not as `double`. `uint32 t` and `unsigned int` are read back from the stored `int64` if the value fits. An `any` column can hold numbers, strings, `bool`, custom types, `OTNObject`s and lists of these, also mixed: ```cpp obj.SetNames(\"value\").SetTypes(\"any\") .AddDataRow(3) .AddDataRow(0.25) .AddDataRow(std::string(\"text\")) .AddDataRow(Vector2{ 1, 2 }) .AddDataRow(std::vector<Vector2 { { 3, 4 }, { 5, 6 } }); ``` Values are read with the type they should have: ```cpp int i = obj.GetValue<int (0, \"value\", 0); auto pos = obj.TryGetValue<Vector2 (3, \"value\"); auto path = obj.TryGetValue<std::vector<Vector2 (4, \"value\"); ``` Custom types and `OTNObject`s are written as rows of their own object, the `any` value references them with `Name#index` (see File Format). An `OTNObject` with several rows becomes a list of references and is read as `std::vector<OTNObject `. In the file a number has no type. When reading, it gets the smallest type that fits: `int`, then `int64 t`, then `uint64 t`, and `double` for numbers with a decimal point or exponent. So that the type used for writing does not matter, numbers in `any` columns can be read as every number type if the value fits: | Stored | Read as | Result | |---|---|---| | `3` | `int`, `int64 t`, `float`, `double`, … | `3` | | `0.1f` | `float` | `0.1f` | | `3.5` | `int` | fails, decimals would be lost | | `5000000000` | `int` | fails, too large | | `-1` | `uint64 t` | fails, negative | Floating point numbers are written with the shortest text that is read back exactly (`0.8`, not `0.80000000000000004`), so a `float` or `double` is read back exactly with its own type. Object names, column names and custom type names may contain: - letters `a-z`, `A-Z`, digits `0-9` and ` `, - UTF-8 characters (all bytes from `0x80`), for example `Größe`. A name must not be empty and must not start with a digit. Spaces and syntax characters (`@ : = , / { } [ ] < ; \"`) are not allowed. An invalid name makes the object invalid. Files are UTF-8. A UTF-8 byte order mark at the start of a file is skipped when reading, the writers never write one. UTF-16 and UTF-32 files are rejected with an error. `std::string` values are written byte by byte. The library does not check or convert their encoding, so they are read back exactly as they were written. `std::wstring`, `std::u16string` and similar types are not supported directly. Store them as UTF-8 `std::string` or with your own `ToOTNDataType` specialization."},{"nodeId":"node_a2e7u4c9h6mpw0sj3kfr","tabId":"tab_mu55p95x1a6rhrm1czr561","title":"Architecture","headings":["Architecture","Layers","Files","Namespaces","Building and testing"],"content":"An overview of how the library is built. The following pages describe the parts in detail. ```text OTNWriter OTNStreamWriter OTNReader OTNStreamReader classes: flow, objects, references \\ | | / \\ | | / Detail::FileHeaderInfo / ObjectHeaderInfo / OTNRow data passed between the layers | | Detail::V1 write functions Detail::V1 read functions syntax: text <- info structs | Tokenizer / CharSource tokens from memory or file ``` - The classes decide what is written or read and in which order. They resolve and create references and manage files. - The syntax layer is the only code that knows the file syntax, see Syntax Layer. - OTNObject and OTNValue are the data model that all classes share, see OTNObject and Type System. | File | Content | |---|---| | `OTNFile/include/OTNFile/OTNFile.h` | Public API, data model, templates (`OTNDataType`, `TryDeserializeValue`), info structs | | `OTNFile/src/OTNFile/OTNFile.cpp` | Everything else | | `OTNFileTest/` | Test program, the tests are in `include/Tests/ .h` | `OTNFile.cpp` is split into regions: | Region | Content | |---|---| | (top) | Helpers: path validation, number parsing, type deduction | | `Syntax` | `DefTable`, `ParseTypeString`, `CharSource`, `Tokenizer`, `ReadVersion`, `Detail::V1`, `Current`, `GetReadSyntax` | | `OTNObject` | `OTNObject` and `OTNObjectBuilder` | | `OTNWriter` | see Writer Internals | | `OTNReader` | see Reader Internals | | `OTNStreamWriter` | see Writer Internals | | `OTNStreamReader` | see Reader Internals | - `OTN`: everything a user needs. - `OTN::Syntax` and `OTN::Keyword`: the characters and keywords of the format. - `OTN::Detail`: implementation details. Users should not need anything from it. The project uses premake (`premake5.lua`, `build.bat`). The test program `OTNFileTest` gets an output folder as argument, runs all tests and prints the number of passed and failed tests: ```text OTNFileTest <output directory ``` The tests are header files per topic in `OTNFileTest/include/Tests/` (`TestObject.h`, `TestWriterReader.h`, `TestStream.h`, `TestBugfixes.h`). The files they write are put into the output folder."},{"nodeId":"node_mu55p95x16kjtnh1dqih2o","tabId":"tab_mu55p95x1a6rhrm1czr561","title":"Type System","headings":["Type System","OTNBaseType","OTNTypeDesc","OTNValue","Public and internal types"],"content":"How values and column types are represented in memory. The type strings used in the API are listed in Types. ```cpp enum class OTNBaseType { UNKNOWN = 0, INT, UINT64, INT64, FLOAT, DOUBLE, BOOL, STRING, OBJECT, // nested OTNObject OBJECT REF, // reference not resolved yet (name + row index) LIST, // list of values ANY // only used as column type }; ``` `OBJECT REF` values are created while reading. `OTNReader` replaces all of them by `OBJECT` values. `OTNStreamReader` does the same unless `SetResolveObjectRefs(false)` is set. Describes the type of a column: ```cpp struct OTNTypeDesc { OTNBaseType baseType = OTNBaseType::UNKNOWN; uint32 t listDepth = 0; // 0 = T, 1 = T[], 2 = T[][] std::string refObjectName; // object name if baseType == OBJECT }; ``` | Type string | baseType | listDepth | refObjectName | |---|---|---|---| | `int` | `INT` | 0 | | | `float[][]` | `FLOAT` | 2 | | | `Vector2` | `OBJECT` | 0 | `Vector2` | | `Vector2[]` | `OBJECT` | 1 | `Vector2` | `UNKNOWN` with `listDepth 0` is the deduced type of an empty list. Such a type cannot be written. A value is a variant plus its type: ```cpp using OTNValueVariant = std::variant< int, int64 t, uint64 t, float, double, bool, std::string, Detail::OTNObjectPtr, // std::shared ptr<OTNObject Detail::OTNArrayPtr, // std::shared ptr<Detail::OTNArray Detail::OTNObjectRef // { std::string refObjectName; size t index; } ; struct OTNValue { OTNValueVariant value; OTNBaseType type; // set from the variant }; using OTNRow = std::vector<OTNValue ; ``` `Detail::OTNArray` holds a `std::vector<OTNValue `. Nested lists are arrays in arrays. Everything a user needs is in the namespace `OTN`: the classes, `OTNValue`, `OTNValueVariant`, `OTNRow`, `OTNTypeDesc`, `OTNBaseType`, `OTNColumnDef` / `col()`, the constants (`VERSION`, `FILE EXTENSION`, `TEMP FILE EXTENSION`) and `Syntax`. Implementation details are in `OTN::Detail` and should not be used directly: | In OTNFile.h | Purpose | |---|---| | `OTNArray`, `OTNObjectPtr`, `OTNArrayPtr`, `OTNObjectRef` | Parts of `OTNValueVariant` | | `OTNDataType<T ` | Converts C++ values into `OTNValue`, see Type Conversion | | `OTNTypeOf<T `, `GetType`, `GetTypeFromVariant` | Base type of a C++ type / variant | | `is otn base type v`, `is otn list v`, `otn is std vector`, `is otn number v` | Traits for `if constexpr` dispatch | | `OTNNumericCast`, `OTNConvertNumber` | Range checked number conversion for `any` columns | | `FileHeaderInfo`, `ObjectHeaderInfo`, `DefTable`, `WriteOptions`, `FilePosition` | Data exchanged with the syntax layer, see Syntax Layer | The parser and the syntax functions are only declared in the header (`CharSource`, `Tokenizer`, `ReadSyntax`) and defined in `OTNFile.cpp`."},{"nodeId":"node_mu55p95xcc3t1kyr59wt","tabId":"tab_mu55p95x1a6rhrm1czr561","title":"Type Conversion","headings":["Type Conversion","C++ to OTNValue","OTNValue to C++","Number conversion","Lists of objects"],"content":"C++ values are converted into `OTNValue`s when they are added to a row, and back when they are read. `Detail::OTNDataType<T ` converts one value. It is used by `OTNObject::AddDataRow`, `OTNObjectBuilder::AddData` and `OTNStreamWriter::WriteRow`. ```text AddDataRow(1, Vector2{ 1, 2 }) OTNDataType<int (1) - int OTNDataType<Vector2 (v) - OTNObjectBuilder + ToOTNDataType<Vector2 - shared ptr<OTNObject (one row) ``` | C++ type | Stored as | |---|---| | `int`, `int64 t`, `uint64 t`, `float`, `double`, `bool`, `std::string` | The same type | | `const char `, string literal | `std::string` | | `uint32 t`, `unsigned int` | `int64 t` | | `std::vector<T `, `std::array<T, N ` | `Detail::OTNArray`, every element converted with `OTNDataType` | | `OTNObject` | Copy in a `shared ptr<OTNObject ` | | Any other `T` | `ToOTNDataType<T ` through an `OTNObjectBuilder`, see OTNObjectBuilder | Errors (for example an invalid custom type) set `m valid = false` in the `OTNDataType`, the row is then rejected. `OTNObject::TryDeserializeValueImpl<T (value, allowNumericConversion)` converts back: | Target `T` | Conversion | |---|---| | Base type | `std::get if<T `. In `any` columns numbers are converted with `Detail::OTNConvertNumber<T ` (range checked). | | `uint32 t`, `unsigned int` | From the stored `int64 t`, range checked | | `std::vector<E ` | Every element of the `OTNArray` converted to `E` | | `OTNObject` | Copy of the referenced object | | Custom type | `OTNObjectBuilder` in load mode, the object must have exactly one row | `allowNumericConversion` is `true` only for `any` columns, so a `float` column cannot be read as `double` by mistake. `Detail::OTNNumericCast<To (from)` returns `std::nullopt` if the value does not fit: - integer to integer: outside the range of `To`, - floating point to integer: not finite, has decimals or outside the range, - to floating point: always possible (may round). An `OTNObject` with several rows can only be read as `std::vector<T `. In memory the value is a list with one `OTNObject` per row after reading, because the file stores a list of row indices (see Writing Data)."},{"nodeId":"node_mu55p95x60r14y7tsvw1","tabId":"tab_mu55p95x1a6rhrm1czr561","title":"OTNObject","headings":["OTNObject Internals","Members","Adding rows","Checks","Column lookup","Reading values","Objects as values"],"content":"`OTNObject` holds the columns and all rows of one object. Readers and writers only work with `OTNObject`s, so this is the central data structure. | Member | Type | Description | |---|---|---| | `m name` | `std::string` | Object name | | `m columnNames` | `vector<string ` | One name per column | | `m columnTypes` | `vector<OTNTypeDesc ` | One type per column, empty until set or deduced | | `m dataRows` | `vector<OTNRow ` | All rows, a row is a `vector<OTNValue ` | | `m columnIndexCache` | `unique ptr<unordered map<string, size t ` | Column name to index, created and filled on the first lookup | | `m deducedColumnTypes` | `bool` | Column types are known (set or deduced) | | `m wasBuildFromT` | `bool` | Created by `OTNObjectBuilder` from a custom type | | `m valid`, `m error` | `bool`, `string` | Error state | `AddDataRow(args...)` converts every argument with `Detail::OTNDataType<T ` (see Type Conversion) into an `OTNValue`. If one value fails, the row is not added and the object becomes invalid. After the first row, `DeduceTypesFromRow` sets the column types that were not given with `SetTypes()`. `SetTypes` parses the type strings with `Detail::ParseTypeString`, the same function the readers use, see Types. Always active: - `IsNameValid`: object, column and type names. Uses `Detail::IsNameStartChar` / `IsNameChar`, the same functions as the `Tokenizer`, so every valid name can be read again. - `ValidateNamesDistinct`: no column name is used twice. - `SetNames` / `SetTypes` before the first row, one value per column in `AddDataRow`. Only with `OTN DEBUG` (costs time for every row): - `ValidateRowTypes`: every row has the types of its columns. `OTNObjectBuilder::ToOTNObject` calls `ValidateRowTypes(0)` always if the custom type set types with `AddTypes`. `GetColumnID(name)` searches the column names and stores the result in `m columnIndexCache`. The cache is cleared by `SetNames` and by copying, because it belongs to one object. It is only created on the first lookup, so objects that are never searched by name (for example resolved references) need no allocation for it. `GetValue<T ` and `TryGetValue<T ` call `TryDeserializeValueImpl<T (value, allowNumericConversion)`. The second argument is `IsAnyColumn(column)`: only in `any` columns numbers are converted to other number types (`Detail::OTNConvertNumber`, range checked). In all other columns the stored type must be `T`. `GetValue<T ` without default throws `std::out of range` or `std::bad cast`, the other variants return the default or `std::nullopt`. A value of type `OBJECT` holds a `std::shared ptr<OTNObject `. `m wasBuildFromT` decides how a writer references it: - Built from a custom type: always one row, referenced by one index (`Ref<X `). - Normal `OTNObject`: all its rows are referenced (`Ref<X []`)."},{"nodeId":"node_mu55p95x1mr9l481ystmfe","tabId":"tab_mu55p95x1a6rhrm1czr561","title":"OTNObjectBuilder","headings":["OTNObjectBuilder","Saving (T to OTNObject)","Loading (OTNObject to T)","AddNameData","Errors"],"content":"`OTNObjectBuilder` lets the same `ToOTNDataType<T ` specialization save and load a custom type. The constructor decides the direction. ```cpp OTNObjectBuilder builder; // saving: T - OTNObject OTNObjectBuilder builder{ obj }; // loading: OTNObject - T ``` `IsBuildingOTNObject()` returns `true` when saving. Used by `Detail::OTNDataType<T ` for every value of a custom type: 1. A builder is created and `ToOTNDataType<T (builder, value)` is called. 2. `SetObjectName` stores the object name, `AddNames` the column names (unique, checked with `OTN DEBUG`), `AddTypes` the type strings in `m dataTypes`. 3. `AddData` converts every member with `Detail::OTNDataType` into an `OTNValue`. Custom members create their own builder (recursion). 4. `std::move(builder).ToOTNObject()` creates an `OTNObject` with one row and `m wasBuildFromT = true`. If types were given, `SetTypesFromBuilder` parses them (missing types and `\"-\"` stay `UNKNOWN` and are deduced by the writers) and `ValidateRowTypes(0)` checks the values against them. Used by `OTNObject::TryDeserializeValue<T ` when `T` is a custom type: 1. The constructor copies the only row of the object into `m data` and stores in `m anyColumns` which columns have the type `any`. An object with zero or more than one row is an error. 2. `ToOTNDataType<T (builder, result)` is called on a default constructed `T`. 3. `SetObjectName` checks that the name matches the stored object. 4. `AddNames` and `AddTypes` do nothing. 5. Every `AddData(member)` takes the value at `m dataPos`, converts it into the member type and moves `m dataPos` forward. In `any` columns numbers are converted to the member type (`allowNumericConversion`), like `GetValue` does. Because values are taken by position, the order of `AddData` calls must be the same for saving and loading. `AddNameData(name, value)` calls `AddNames` and `AddData` for one column. It checks that the number of names and values is still the same (`IsDataOutOfSync`), which finds missing names or values in a specialization. `AddNameTypeData(name, type, value)` does the same with a type. Columns added before without a type get an empty type (deduced), so `AddNameTypeData` can be mixed with `AddNames` / `AddData`. All errors are collected in the builder (`IsValid`, `GetError`). When saving, they make the value and therefore the row invalid. When loading, `TryGetValue` returns `std::nullopt`."},{"nodeId":"node_g8d1z5k3n7vxe2qb6ycu","tabId":"tab_mu55p95x1a6rhrm1czr561","title":"Syntax Layer","headings":["Syntax Layer","Info structs","Reading: CharSource and Tokenizer","Versions","How V2 reuses V1","Adding a version","File grammar of V2"],"content":"All knowledge about the file syntax is in one place: the region `Syntax` at the top of `OTNFile.cpp`. The four reader and writer classes never write or parse text themselves, they only exchange info structs with the syntax functions. A new format version therefore only needs new syntax functions. Declared in `OTNFile.h` in `OTN::Detail`, because the classes store them as members: | Struct | Content | |---|---| | `FileHeaderInfo` | Version, `defType` and `defName` tables | | `ObjectHeaderInfo` | Object name, row count, column names and column types | | `DefTable` | Numbers to names and back (`@defType` / `@defName`), `GetEntries()` sorted by number | | `WriteOptions` | `compact`: no spaces, line breaks and indentation | | `FilePosition` | Offset, line and column in the file | Write functions take an info struct and append text to a `std::string`. Read functions return an info struct (`std::optional`, empty on error). | Class | Task | |---|---| | `CharSource` | Characters from memory (`OpenMemory`) or from a file in 64 KB blocks, the last 4 used blocks are kept (`OpenFile`). `Available` / `Current` / `Skip` give direct access to the loaded chars. Can jump to a `FilePosition` (`Seek`). | | `Tokenizer` | Creates tokens on demand from a `CharSource`: `Next`, `Peek`, `NextIf`, `Expect`. `Tell` / `Seek` save and restore the position. The text of a token is a `string view` into the loaded chars, it is only copied for strings with escape sequences and tokens over a block border. | All readers use the same tokenizer. `OTNReader` reads from memory, `OTNStreamReader` from the file. Errors contain the line and column of the token. `ReadVersion` first calls `SkipByteOrderMark`: a UTF-8 BOM is skipped (not counted as column), a file starting with `FF`, `FE` or `00` is rejected as UTF-16 / UTF-32. An `IDENTIFIER` starts with a letter, ` ` or a byte from `0x80` and continues with these and digits (`IsNameStartChar` / `IsNameChar`). `OTNObject::IsNameValid` uses the same functions, so the writers can only produce names the tokenizer can read. Token types: `KEYWORD PREFIX` (`@`), `IDENTIFIER`, `NUMBER`, `STRING`, `MINUS`, `COLON`, `EQUALS`, `COMMA`, `SLASH`, `SEMICOLON`, `BLOCK BEGIN` / `BLOCK END`, `LIST BEGIN` / `LIST END`, `REF BEGIN` / `REF END`, `REF INDEX` (`#`, since version 2), `END OF FILE`. Every format version has its own namespace with read and write functions. A newer version is defined after the older one and reuses everything that did not change: ```cpp namespace Detail { // independent of the version std::optional<uint8 t ReadVersion(Tokenizer& tok); namespace V1 { // read std::optional<FileHeaderInfo ReadFileHeader(Tokenizer&, uint8 t version); bool HasMoreObjects(Tokenizer&); std::optional<ObjectHeaderInfo ReadObjectHeader(Tokenizer&, const FileHeaderInfo&); std::optional<OTNRow ReadRow(Tokenizer&, const std::vector<OTNTypeDesc &, const FileHeaderInfo&); bool SkipRow(Tokenizer&); bool ReadObjectBlockEnd(Tokenizer&); // write void WriteFileHeader(std::string&, const WriteOptions&, const FileHeaderInfo&); void WriteObjectBlockBegin(std::string&, const WriteOptions&); void WriteObjectBlockEnd(std::string&, const WriteOptions&); bool WriteObjectHeader(std::string&, const WriteOptions&, const ObjectHeaderInfo&, const FileHeaderInfo&, std::string& error); bool WriteRow(std::string&, const WriteOptions&, const OTNRow&, std::string& error); const ReadSyntax READ SYNTAX = { ReadFileHeader, HasMoreObjects, ... }; } namespace V2 { // new: references in 'any' values, object names in @defType std::optional<OTNValue ReadAnyValue(Tokenizer&, const V1::ValueContext&); std::optional<OTNRow ReadRow(Tokenizer&, const std::vector<OTNTypeDesc &, const FileHeaderInfo&); std::optional<FileHeaderInfo ReadFileHeader(Tokenizer&, uint8 t version); bool WriteRow(std::string&, const WriteOptions&, const OTNRow&, const FileHeaderInfo&, std::string& error); // unchanged, taken from V1 using V1::WriteFileHeader; using V1::WriteObjectBlockBegin; using V1::WriteObjectBlockEnd; using V1::WriteObjectHeader; const ReadSyntax READ SYNTAX = { ReadFileHeader, &V1::HasMoreObjects, &V1::ReadObjectHeader, ReadRow, &V1::SkipRow, &V1::ReadObjectBlockEnd }; } namespace Current = V2; // version that is written const ReadSyntax GetReadSyntax(uint8 t version); // 1 - V1::READ SYNTAX, 2 - V2::READ SYNTAX } ``` - Writing always uses `Current`. A `static assert` checks that `Current` matches `OTN::VERSION`. - Reading first calls `ReadVersion`, then `GetReadSyntax(version)` returns the table of function pointers (`ReadSyntax`) for that version. Old files can therefore still be read after the format changed. Reading a value goes through `V1::ReadValue` → `V1::ReadList` → `ReadAnyValue`. Only the reading of `any` values changed in V2, so the value functions of V1 take a `V1::ValueContext`: ```cpp struct ValueContext { const FileHeaderInfo& file; // for @defType ids ReadAnyFunc readAny; // V1::ReadAnyValue or V2::ReadAnyValue }; ``` `V1::ReadRow` passes `V1::ReadAnyValue`, `V2::ReadRow` passes `V2::ReadAnyValue`. Everything else (lists, primitives, `Ref` columns) is the same code. `V2::ReadAnyValue` handles `Name#index` and `id#index` and passes all other values to `V1::ReadAnyValue`. `V2::ReadFileHeader` calls `V1::ReadFileHeaderImpl` with `allowObjectTypes = true`, so `@defType` can contain object names. When writing, `V2::WriteValue` writes `OBJECT REF` values (`Name#index`, the name replaced by its `@defType` id if there is one) and passes all other values to `V1::WriteValue`. The writers create `OBJECT REF` values only for objects in `any` columns, in `Ref` columns they stay plain row indices. `V1::WriteColumnType` writes the `@defType` id of an object name if the table contains it. In version 1 files the table never contains object names, so V1 output does not change. 1. Add `namespace V3` after `V2`. Functions that did not change are reused (`using V2::WriteObjectHeader;` or by calling them). 2. If a function deep in a call chain changes, pass it in like `ValueContext::readAny` instead of copying the whole chain. 3. Create `V3::READ SYNTAX` with the new functions where something changed and the old ones otherwise. 4. Add `case 3` to `GetReadSyntax`. 5. Set `OTN::VERSION = 3` and `namespace Current = V3`, and update the `static assert`. 6. If V3 needs new information, add fields to the info structs. Older versions leave them at their default. The classes do not have to be changed as long as the info structs contain everything they need. ```text file = \"@version\" \":\" NUMBER \";\" header \"@object\" \":\" \"{\" object \"}\" \";\" EOF header = (\"@defType\" | \"@defName\") \":\" definition (\",\" definition) \";\" definition = IDENTIFIER \"=\" NUMBER object = IDENTIFIER \"[\" NUMBER \"]\" \"{\" (column (\",\" column) )? \"}\" \";\" row column = type \"/\" name type = (IDENTIFIER | \"Ref\" \"<\" IDENTIFIER \" \" | NUMBER) (\"[\" \"]\") name = IDENTIFIER | NUMBER row = value (\",\" value) \";\" value = NUMBER | \"-\" NUMBER | STRING | \"true\" | \"false\" | reference | list reference = (IDENTIFIER | NUMBER) \"#\" NUMBER (only in 'any' columns) list = \"[\" (value (\",\" value) )? \"]\" ``` The number of rows is given in the object header. A `NUMBER` as type or name is looked up in the `@defType` / `@defName` table. In `Ref<Name ` columns a value is only the row index (`NUMBER`). Version 1 is the same without `reference`, and `@defType` may only contain the base types."},{"nodeId":"node_mu55p95x18c549nhu7cu9","tabId":"tab_mu55p95x1a6rhrm1czr561","title":"Writer Internals","headings":["Writer Internals","OTNWriter","OTNStreamWriter"],"content":"Both writers turn `OTNObject`s into rows with row indices instead of nested objects and pass them to the syntax functions of `Detail::Current` (see Syntax Layer). `Save()` / `SaveToString()` run three steps. 1. CreateWriteData Every appended object is converted into a `SerializedObject` (column names, column types, rows). `AddObject` goes through all values: - An `OBJECT` value is added to the `SerializedObject` of its name (recursively) and replaced by the row index it got. A normal `OTNObject` gives one index per row, so the column becomes a list (`Ref<X []`). - Lists are converted element by element. - With `UseDeduplicateRows`, `AddOrGetRow` looks up a hash of the row first. An identical row returns its existing index. Objects with the same name end up in the same `SerializedObject`. Afterwards `CountObjectType` counts how often every name is written: - base types (`typeUsage`): columns with this type, - object names: `Ref<X ` columns (`objectColumnUsage`) and references `X#index` in `any` columns (`objectRefUsage`), - column names (`CreateDefName`): columns with this name. `ChooseDefinitions` then decides which names get a number. All lengths are measured with the syntax functions (`Current::WriteObjectHeader`, `WriteRow`, `WriteFileHeader`), so the writer knows no syntax itself: 1. `DefSaving` writes one column / one reference with and without the number. The difference times the number of uses is the saving. 2. Candidates are sorted by saving, so the names that save the most get the smallest (shortest) numbers. 3. A name is added if its saving is more than the length of its entry in the table (`name = id, `). 4. At the end the table as a whole must also pay for the directive (`@defType: ;`), otherwise it is removed. So `UseDefType` / `UseDefName` never make a file longer. 2. WriteHeader `Current::WriteFileHeader` writes `@version` and the `@defType` / `@defName` tables. 3. WriteBody `WriteObjectBlockBegin`, then for every `SerializedObject` `WriteObjectHeader` and one `WriteRow` per row, then `WriteObjectBlockEnd`. The text is collected in `WriterData::buffer`. `FlushBuffer` writes it to the file whenever it is larger than 64 KB, so memory use does not grow with the file size. `SaveToString` returns the buffer instead. The stream writer does not know the final row counts while writing, and rows of different objects arrive mixed (a `WriteRow` with a `Vector2` value creates a `Vector2` row in between). The file needs every object as one block with its row count. Therefore: Temporary file `Open()` creates `<name .otn.tmp`. Every row is appended to it immediately. For every object the writer keeps an `ObjectBlock` in memory: ```cpp struct RowRange { uint64 t offset; uint64 t length; }; struct ObjectBlock { Detail::ObjectHeaderInfo header; std::vector<RowRange ranges; }; ``` `header.rowCount` counts the rows, `ranges` stores where they are in the temporary file. Rows that directly follow the last range of the same object extend it instead of adding a new range. The temporary file only contains data rows: no `@version`, no object headers and no `@object` block. Every row is already formatted exactly as in the final file (tab, values, `;`, line break), so `Close()` can copy the bytes without changing them. Example ```cpp OTN::OTNStreamWriter w; w.Open(\"world.otn\"); w.BeginObject(\"Position\", OTN::col(\"id\", \"int\"), OTN::col(\"pos\", \"Vector2\")); w.WriteRow(1, Vector2{ 1, 2 }); w.WriteRow(2, Vector2{ 3, 4 }); w.EndObject(); w.BeginObject(\"Vector2\", OTN::col(\"x\", \"float\"), OTN::col(\"y\", \"float\")); w.WriteRow(5.0f, 6.0f); w.EndObject(); w.Close(); ``` Step by step: | Call | Appended to `world.otn.tmp` | Index in memory | |---|---|---| | `Open` | - (file created empty, `world.otn` created empty) | - | | `BeginObject(\"Position\")` | - | `Position`: 0 rows | | `WriteRow(1, Vector2{1, 2})` | 1. the `Vector2` row `1, 2;` at offset 0 | `Vector2`: 1 row, ranges `[0, 7]` | | | 2. the `Position` row `1, 0;` at offset 7 (`0` = `Vector2` row 0) | `Position`: 1 row, ranges `[7, 7]` | | `WriteRow(2, Vector2{3, 4})` | 1. `3, 4;` at offset 14 | `Vector2`: 2 rows, ranges `[0, 7] [14, 7]` | | | 2. `2, 1;` at offset 21 | `Position`: 2 rows, ranges `[7, 7] [21, 7]` | | `EndObject` | - | - | | `BeginObject(\"Vector2\")` | - (name exists, columns match) | - | | `WriteRow(5.0f, 6.0f)` | `5, 6;` at offset 28 | `Vector2`: 3 rows, ranges `[0, 7] [14, 7] [28, 7]` | | `Close` | see below | | A range is `[offset, length]` in bytes. Every row here is 7 bytes long: tab, `1, 2;` and the line break. A further `WriteRow(7.0f, 8.0f)` would directly follow the last `Vector2` range, so the range would grow to `[28, 14]` instead of adding a new one. A sub-object is always written before the row that references it, because the row needs its index. Content of `world.otn.tmp` before `Close()` (`→` is a tab): ```text offset bytes object 0 →1, 2;\\n Vector2 row 0 7 →1, 0;\\n Position row 0 14 →3, 4;\\n Vector2 row 1 21 →2, 1;\\n Position row 1 28 →5, 6;\\n Vector2 row 2 ``` The rows of the two objects are mixed. Only the ranges in memory tell which bytes belong to which object. `std::ofstream` buffers the writes, so the file on disk can lag behind until it is closed. Close `WriteFile` closes the temporary file and builds `world.otn`: 1. `WriteFileHeader`: `@version: 2;` and the start of `@object`. 2. For every block in the order of first use (`Position`, then `Vector2`): `WriteObjectHeader` with the final row count, then copy the ranges of the block from the temporary file (64 KB buffer). 3. `WriteObjectBlockEnd`, then the temporary file is deleted. ```otn @version: 2; @object: { Position[2] { int/id, Ref<Vector2 /pos }; 1, 0; ← copied from offset 7 2, 1; ← copied from offset 21 Vector2[3] { float/x, float/y }; 1, 2; ← copied from offset 0 3, 4; ← copied from offset 14 5, 6; ← copied from offset 28 }; ``` (The arrows are only explanation, they are not in the file.) Until `Close()` the target file `world.otn` stays empty. Sub-objects `ConvertValue` replaces `OBJECT` values by row indices. `WriteSubObject` writes the sub-object first: - `m objPtrToIndex` maps an `OTNObject ` to its first row index. A `weak ptr` detects if the address was reused by a new object. A known object is not written again. - `WriteObjectRows` converts all rows of the object (which writes its own sub-objects) and appends the finished rows in one piece, so the rows of one object get consecutive indices. - `m objectsInProgress` contains the objects that are being converted. Finding one of them again means the object contains itself, which is an error. Blocks with the same name `GetBlock` returns the block of a name or creates it. An existing block must have the same column names and types. A deduced type of an empty list (`UNKNOWN[]`) is accepted for every list type with at least that depth. New blocks are checked with `WriteObjectHeader` right away, so invalid column types are reported before any row is written. Memory Memory use is the index (one `RowRange` per range) plus the object that is currently converted. If two objects alternate row by row, every row gets its own range (16 bytes)."},{"nodeId":"node_mu55p95x1r773m4107y4xr","tabId":"tab_mu55p95x1a6rhrm1czr561","title":"Reader Internals","headings":["Reader Internals","OTNReader","OTNStreamReader"],"content":"Both readers use the `Tokenizer` and the version dependent `ReadSyntax` table (see Syntax Layer). They differ in what they keep in memory. Reading `ReadFile` loads the file into a string, `ReadString` uses the given text. `ReadData` then: 1. reads `@version` with `ReadVersion` and gets the `ReadSyntax` for this version, 2. reads the file header (`@defType`, `@defName`, start of `@object`), 3. reads every object: `readObjectHeader`, then `rowCount` times `readRow`, 4. checks the end of the `@object` block. Every object becomes an `OTNObject` in `ReaderData::objects`. A second object with the same name is an error. Resolving references While reading, a `Ref<X ` value is an `OBJECT REF` value (object name and row index). `ResolveObjectRefs` replaces them by `OBJECT` values after all objects are read, so references to objects later in the file work: 1. Find the object and check the row index. 2. Copy the referenced row and resolve its references first (recursion). 3. Create an `OTNObject` with this one row and the columns of the target. The `RefStack` contains the rows that are currently being resolved. Reaching one of them again is a cycle and an error. Scan `Open` reads the file once from start to end (`CharSource::OpenFile`, read in 64 KB blocks) and creates the index: ```cpp struct ObjectInfo { Detail::ObjectHeaderInfo header; // name, row count, columns std::vector<De
