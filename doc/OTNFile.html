/* -- Search --------------------------------------------------------------- */
.doc-search {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--sp-xs);
  margin-left: auto;
  align-self: center;
  padding: 0 var(--sp-s);
  flex: 0 1 auto;
  min-width: 80px;
}
.doc-search-input {
  background: var(--bg);
  border: 1px solid var(--brd);
  border-radius: 4px;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 5px 10px;
  width: 180px;
  max-width: 100%;
  min-width: 0;
  outline: none;
  transition: border-color .15s, width .2s ease;
}
.doc-search-input::placeholder {
  color: var(--muted);
}
.doc-search-input:focus {
  border-color: var(--accent);
  width: 240px;
}
.doc-search-toggle {
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
  user-select: none;
  flex-shrink: 0;
}

.doc-search-toggle input[type="checkbox"] {
  appearance: none;
  -webkit-appearance: none;
  width: 13px;
  height: 13px;
  flex-shrink: 0;
  background: var(--bg);
  border: 1px solid var(--brd);
  border-radius: 3px;
  cursor: pointer;
  margin: 0;
  position: relative;
  transition: background .15s, border-color .15s;
}

.doc-search-toggle input[type="checkbox"]:checked {
  background: var(--accent);
  border-color: var(--accent);
}

.doc-search-toggle input[type="checkbox"]:checked::after {
  content: '';
  position: absolute;
  left: 3px;
  top: 0px;
  width: 5px;
  height: 8px;
  border: 2px solid var(--bg);
  border-top: none;
  border-left: none;
  transform: rotate(45deg);
}
.search-results-list {
  overflow-y: auto;
  max-height: 360px;
}

.search-results-footer {
  padding: 8px 12px;
  border-top: 1px solid var(--brd);
  background: var(--bg2);
  border-radius: 0 0 6px 6px;
  flex-shrink: 0;
}
.search-results {
  display: none;
  position: absolute;
  top: calc(100% + 8px);
  right: var(--sp-s);
  width: 360px;
  max-height: 420px;
  overflow-y: auto;
  background: var(--bg1);
  border: 1px solid var(--brd);
  border-radius: 6px;
  z-index: 200;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}
.search-results.visible {
  display: block;
}
.search-result {
  padding: 10px 14px;
  border-bottom: 1px solid var(--brd);
  cursor: pointer;
  transition: background .1s;
}
.search-result:last-child {
  border-bottom: none;
}
.search-result:hover {
  background: color-mix(in srgb, var(--accent) 8%, transparent);
}
.search-result-title {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.search-result-heading {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--accent);
  margin-bottom: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.search-result-preview {
  font-family: var(--font-body);
  font-size: 11px;
  color: var(--muted);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  line-height: 1.5;
}
.search-result-title mark,
.search-result-heading mark,
.search-result-preview mark {
  background: color-mix(in srgb, var(--accent) 28%, transparent);
  color: var(--text);
  border-radius: 2px;
  padding: 0 2px;
}
.search-no-results {
  padding: 20px 16px;
  text-align: center;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--muted);
}

@media (max-width: 650px) {
  .doc-search-input {
    width: 120px;
  }
  /* Results span the whole bar (header / tab-nav) instead of the input */
  .doc-search {
    position: static;
  }
  .search-results {
    left: var(--sp-s);
    right: var(--sp-s);
    width: auto;
    top: calc(100% + 4px);
  }
}

    <div class="export-section__body"><h1>Getting Started</h1>
<p>OTN (Object Tokenized Notation) is a text format for structured data. Data is stored in <strong>named objects</strong>. Every object works like a table: it has typed columns and any number of rows. Objects can reference rows of other objects, so nested C++ structs can be stored without repeating data.</p>

    <div class="export-section__body"><h1>Writing Data</h1>
<p>Build your data with <code>OTNObject</code>, then save it with <code>OTNWriter</code>. <code>OTNWriter</code> keeps all objects in memory until <code>ClearObjects()</code> is called. For data that does not fit into memory use the <a class="doc-ref" href="#node_q7k2m9x4w1btr8vz3hpd" data-ref-node="node_q7k2m9x4w1btr8vz3hpd" title="Stream Writer">Stream Writer</a>.</p>

<ul><li><code>SetNames</code> defines the columns. Names must be unique and may contain letters, digits, <code>_</code> and UTF-8 characters, but must not start with a digit (see <a class="doc-ref" href="#node_w3f6j0p8u2lcy5mx9tbe" data-ref-node="node_w3f6j0p8u2lcy5mx9tbe" title="Types">Types</a>).</li><li>Every <code>AddDataRow</code> adds one row. The number of values must match the number of columns.</li><li><code>AddDataRowList(row)</code> adds a prepared <code>OTNRow</code>, <code>ReserveDataRows(n)</code> reserves memory for <code>n</code> rows.</li></ul>
<h2>Column types</h2>
<p>Without <code>SetTypes()</code> the column types are deduced from the <strong>first row</strong>. Every following row must use the same types. If the first row contains an empty list, the writer takes the element type from the next row that has one.</p>
<p>To set the types yourself, call <code>SetTypes()</code> before the first <code>AddDataRow()</code>:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">items</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">SetNames</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">id"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">name"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">value"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">)</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">     </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">SetTypes</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">int"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">String"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">double"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">)</span>

<p>Use <code>&quot;-&quot;</code>, <code>&quot;_&quot;</code> or <code>&quot;&quot;</code> for a column whose type should still be deduced from the first row. All type strings are listed in <a class="doc-ref" href="#node_w3f6j0p8u2lcy5mx9tbe" data-ref-node="node_w3f6j0p8u2lcy5mx9tbe" title="Types">Types</a>.</p>
<p>Explicit types are useful when:</p>
<ul><li>all rows contain empty lists in a column (its element type cannot be deduced),</li><li>a column should accept different value types (<code>any</code>),</li><li>an object has no rows but should still be written with its columns.</li></ul>
<h2>Saving</h2>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">OTN</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">OTNWriter</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">writer</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span>

<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">      </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">AppendObject</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">enemies</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">)</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">      </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">Save</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">gamedata.otn"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<ul><li><code>AppendObject</code> copies the object, later changes to <code>items</code> are not written.</li><li>Every object name may only be used once per file.</li><li>Missing folders are created. A path without extension gets <code>.otn</code>, any other extension is an error.</li></ul>
<p>To get the text instead of a file:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">string</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">text</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">if</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">writer</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">SaveToString</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">text</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">))</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// text contains the complete file</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">}</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p><code>ClearObjects()</code> removes all appended objects, so the writer can be reused for another file. <code>Reset()</code> also removes the error state, for example after a failed <code>Save()</code>. The options stay in both cases.</p>

<span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__other">	</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__string">"</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__string">Sword"</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">,</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__other"> </span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__number">1</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">;</span>

<span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__other">	</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">}</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">;</span>
<span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__other">	</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__number">1</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">,</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__other"> </span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__number">2</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">;</span>

<span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__other">		</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__type">String</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__operator">/</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__variable">name</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">,</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__other"> </span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__type">Ref&lt;Vector2&gt;</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__operator">/</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__variable">pos</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">,</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__other"> </span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__type">Ref&lt;Item&gt;</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">[]</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__operator">/</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__variable">inventory</span>
<span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__other">	</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">}</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">;</span>
<span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__other">	</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__string">"</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__string">Hero"</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">,</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__other"> </span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__number">0</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">,</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__other"> </span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">[</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__number">0</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">,</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__other"> </span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__number">1</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">];</span>
<span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">}</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">;</span></span></pre><div class="code-language-tag code-language-tag--recognized">otn</div></div>
<p>An <code>OTNObject</code> with several rows is stored as a <strong>list</strong> of references (<code>Ref&lt;Item&gt;[]</code>), so it has to be read back as a list. See <a class="doc-ref" href="#node_mu55p95x1j1aoqjvokje3" data-ref-node="node_mu55p95x1j1aoqjvokje3" title="Reading Data">Reading Data</a>.</p>
<h2>Writer options</h2>
<p>All options are set before <code>Save()</code> and can be chained.</p>
<div class="table-wrapper"><table data-hover="row"><thead><tr><th width="160">Method</th><th>Default</th><th>Effect</th></tr></thead><tbody><tr><td><code>UseDefType(true)</code></td><td>off</td><td>Often used type names are replaced by numbers to save storage (<code>@defType</code>)</td></tr><tr><td><code>UseDefName(true)</code></td><td>off</td><td>Often used column names are replaced by numbers to save storage (<code>@defName</code>)</td></tr><tr><td><code>UseOptimizations(true)</code></td><td>off</td><td>No spaces, line breaks and indentation to save storage if readability is not needed</td></tr><tr><td><code>UseDeduplicateRows(true)</code></td><td>off</td><td>Identical rows of an object are written once and referenced multiple times to save storage</td></tr></tbody></table></div>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">writer</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">UseDefName</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__literal">true</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">)</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">      </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">UseDefType</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__literal">true</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">)</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">      </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">UseOptimizations</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__literal">true</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">)</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">      </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">AppendObject</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">items</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">)</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">      </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">Save</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">data.otn"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p>A type or name is only replaced if the saved characters are more than its entry in <code>@defType</code> / <code>@defName</code> costs, so these options never make the file longer. Small files often get no numbers at all. The output of all options is shown in <a class="doc-ref" href="#node_mu55p95x1mur4st1tuzfby" data-ref-node="node_mu55p95x1mur4st1tuzfby" title="File Format">File Format</a>.</p>
<p>With deduplication, identical rows are stored once per object. Two <code>Vector2{ 1, 2 }</code> values in different rows become one <code>Vector2</code> row that both rows reference. This also applies to the rows of the objects you append yourself: identical rows there are only written once.</p>
<h2>Errors</h2>
<p><code>Save()</code> and <code>SaveToString()</code> return <code>false</code> on errors, the reason is returned by <code>GetError()</code>:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">if</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">!</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">writer</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">Save</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">data.otn"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">))</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__variable">cerr</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">writer</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">GetError</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">()</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">'</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__escape">\n</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">'</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p>An <code>OTNObject</code> with an error (for example a row with the wrong number of values) is not written, <code>Save()</code> fails and <code>GetError()</code> names the object. Use <code>Reset()</code> to write another file with the same writer. See <a class="doc-ref" href="#node_h4t9b1s6e3xan7pk2rwc" data-ref-node="node_h4t9b1s6e3xan7pk2rwc" title="Error Handling">Error Handling</a>.</p>
<p>Before the file is opened, every value is checked against its column, so a written file can always be read again. <code>Save()</code> fails (and an existing file is not changed) if:</p>
<ul><li>a value does not match its column type, for example a string in an <code>int</code> column or a number that does not fit,</li><li>a float or double value is NaN or infinite (the format has no literal for them),</li><li>two different objects use the same name, for example an appended object and a custom type with other columns.</li></ul></div>
  </section>
  </div>
</template>
<template id="tmpl-node_mu55p95x1j1aoqjvokje3">
  <div class="main" data-node-id="node_mu55p95x1j1aoqjvokje3" data-tab-id="tab_mu55p95xy2tfxuvim3p9">
    <section id="node_mu55p95x1j1aoqjvokje3" class="export-section">
    
    <div class="export-section__body"><h1>Reading Data</h1>
<p><code>OTNReader</code> reads a complete file into memory. After reading, all objects are available by name and all references between objects are resolved. For large files use the <a class="doc-ref" href="#node_c5n8r2v6y0dkf3wq7jtm" data-ref-node="node_c5n8r2v6y0dkf3wq7jtm" title="Stream Reader">Stream Reader</a>.</p>
<h2>Reading a file</h2>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">OTN</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">OTNReader</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">reader</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">if</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">!</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">reader</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">ReadFile</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">data.otn"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">))</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__variable">cerr</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">reader</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">GetError</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">()</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">'</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__escape">\n</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">'</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">return</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">}</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p><code>ReadString(text)</code> reads from a string instead of a file. <code>GetVersion()</code> returns the format version of the file.</p>
<p>If anything in the file is invalid, reading fails. Do not use the objects of a failed read, they can be incomplete. The error message contains the line and column of the problem, see <a class="doc-ref" href="#node_h4t9b1s6e3xan7pk2rwc" data-ref-node="node_h4t9b1s6e3xan7pk2rwc" title="Error Handling">Error Handling</a>. Every <code>ReadFile</code> / <code>ReadString</code> starts with a new state, so the same reader can read the next file after an error.</p>
<h2>Getting objects</h2>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">optional</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">OTN</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">OTNObject</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&gt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">items</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">=</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">reader</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">TryGetObject</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">Items"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">if</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">!</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">items</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">)</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// no object with this name</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">}</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p><code>TryGetObject</code> returns a copy. <code>FindObject</code> returns a pointer to the stored object instead, <code>nullptr</code> if the name does not exist:</p>

<p><code>GetColumnNames()</code>, <code>GetColumnTypesDesc()</code> and <code>GetColumnCount()</code> describe the columns of an object.</p>
<h2>The type has to match</h2>
<p><code>T</code> must be the type of the column. A <code>float</code> column can only be read as <code>float</code>, not as <code>double</code> or <code>int</code>.</p>
<p>The exception are <code>any</code> columns. They store numbers without a fixed type, so a number from an <code>any</code> column can be read as every number type, as long as the value fits (<code>3.5</code> cannot be read as <code>int</code>, <code>5000000000</code> not as <code>int</code> but as <code>int64_t</code>). See <a class="doc-ref" href="#node_w3f6j0p8u2lcy5mx9tbe" data-ref-node="node_w3f6j0p8u2lcy5mx9tbe" title="Types">Types</a>.</p>

<ul><li><code>BeginObject</code> defines the columns. The types use the same strings as <code>SetTypes</code>, see <a class="doc-ref" href="#node_w3f6j0p8u2lcy5mx9tbe" data-ref-node="node_w3f6j0p8u2lcy5mx9tbe" title="Types">Types</a>. Instead of <code>OTN::col(...)</code> two vectors with names and types can be passed.</li><li><code>WriteRow</code> takes one value per column. <code>WriteRowList(row)</code> takes a prepared <code>OTNRow</code>.</li><li>Custom types (<a class="doc-ref" href="#node_mu55p95xk2i6alcuiyw" data-ref-node="node_mu55p95xk2i6alcuiyw" title="Custom Types">Custom Types</a>) and <code>OTNObject</code>s can be written directly. They are stored as rows of their own object, the column stores the row index.</li><li><code>EndObject</code> finishes the object. <code>Close</code> writes the file.</li></ul>
<h2>Writing complete objects</h2>
<p><code>AppendObject</code> writes an <code>OTNObject</code> including all nested objects:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">writer</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">AppendObject</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">players</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p><code>BeginObject</code> / <code>WriteRow</code> and <code>AppendObject</code> can be mixed freely, but <code>AppendObject</code> cannot be called while an object is open.</p>
<h2>The file is written on Close</h2>
<p>All rows are first collected in a temporary file next to the target (<code>enemies.otn.tmp</code>). <code>Close()</code> builds the real file from it and deletes the temporary file. The destructor calls <code>Close()</code> as well. An example of the temporary file and how the final file is built from it is in <a class="doc-ref" href="#node_mu55p95x18c549nhu7cu9" data-ref-node="node_mu55p95x18c549nhu7cu9" title="Writer Internals">Writer Internals</a>.</p>
<p>Until <code>Close()</code>:</p>
<ul><li>the target file is empty,</li><li>disk space for the data is needed twice (temporary file and target file) while <code>Close()</code> copies the rows,</li><li>if the program crashes, only the temporary file contains the data.</li></ul>
<h2>Same object name multiple times</h2>
<p>Rows can be added to an object at any time. <code>BeginObject</code> with a name that already has rows, <code>AppendObject</code> with an object of the same name or a custom type used in several places all add rows to the same object:</p>

<h2>Duplicates</h2>
<p>The same object instance is written only once: an <code>OTNObject</code> that is referenced from several rows gets one set of rows, all references point to it. Values (like two equal <code>Vector2</code>) are written as separate rows. There is no <code>UseDeduplicateRows</code> option.</p>
<h2>Limits</h2>
<ul><li><code>UseDefType</code>, <code>UseDefName</code> and <code>UseOptimizations</code> are not available.</li><li>An object that contains itself (directly or through other objects) is an error.</li><li>Object, column and type names are checked in <code>BeginObject</code>, the values of every row against the column types (see <a class="doc-ref" href="#node_w3f6j0p8u2lcy5mx9tbe" data-ref-node="node_w3f6j0p8u2lcy5mx9tbe" title="Types">Types</a>). A value that does not match its column (for example a string in an <code>int</code> column, NaN or infinity) is an error.</li><li>After an error the writer stays invalid. <code>Close()</code> still writes all rows that were written successfully.</li><li><code>Open()</code> on an open writer closes the current file first.</li></ul>
<p>Files of <code>OTNStreamWriter</code> can be read with <code>OTNReader</code> and <code>OTNStreamReader</code>.</p></div>
  </section>

    <div class="export-section__body"><h1>Stream Reader</h1>
<p><code>OTNStreamReader</code> reads large files without loading them into memory. Rows can be read one after another or directly by object name and row index. For small files <code>OTNReader</code> is simpler, see <a class="doc-ref" href="#node_mu55p95x1j1aoqjvokje3" data-ref-node="node_mu55p95x1j1aoqjvokje3" title="Reading Data">Reading Data</a>.</p>

<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">&nbsp;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">optional</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">OTN</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">OTNObject</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&gt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">config</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">=</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">reader</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">ReadObject</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">Config"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<ul><li><code>ReadObjectRow</code> returns an <code>OTNObject</code> with exactly this one row. Values are read with <code>GetValue</code> / <code>TryGetValue</code> like after <code>OTNReader</code>.</li><li><code>ReadObject</code> loads a complete object into memory, so only use it for small objects.</li><li>Both return <code>std::nullopt</code> if the object or row does not exist.</li></ul>
<p>To find a row, the reader jumps to the closest stored position and reads at most 1023 rows from there.</p>
<h2>Object references</h2>
<p>References are resolved by default: a <code>Ref&lt;Vector2&gt;</code> value is loaded as an <code>OTNObject</code> with the referenced row (references inside it are resolved as well). Therefore custom types can be read from <code>ReadObjectRow</code> results with <code>TryGetValue&lt;Vector2&gt;</code>.</p>
<p>Every resolved reference reads its row from the file. If you only need the indices, turn it off:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">reader</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">SetResolveObjectRefs</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__literal">false</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p>Reference values then have the type <code>OTNBaseType::OBJECT_REF</code> and contain the name of the referenced object and the row index.</p>
<p>A reference to a row that does not exist and cyclic references are errors.</p>
<h2>Changed files</h2>
<p><code>NextObject</code>, <code>ReadObject</code>, <code>ReadObjectRow</code> and <code>GetObjectNames</code> check the size and modification time of the file. If the file was changed (for example written again by an <code>OTNStreamWriter</code>), it is scanned again and the reader continues at the same object and row. If the current object no longer exists, the reader reports an error.</p>
<p><code>ReadRow</code> and <code>SkipCurrentObject</code> do not check the file, the check would take longer than reading the row. The file must not be changed while the rows of an object are read.</p>
<h2>Errors</h2>
<p>On an error (invalid file, missing object in a reference, ...) the reader becomes invalid and all further reads return <code>false</code> / <code>std::nullopt</code>. <code>GetError()</code> returns the reason with the line and column in the file. See <a class="doc-ref" href="#node_h4t9b1s6e3xan7pk2rwc" data-ref-node="node_h4t9b1s6e3xan7pk2rwc" title="Error Handling">Error Handling</a>.</p></div>
  </section>
  </div>
</template>
<template id="tmpl-node_h4t9b1s6e3xan7pk2rwc">
  <div class="main" data-node-id="node_h4t9b1s6e3xan7pk2rwc" data-tab-id="tab_mu55p95xy2tfxuvim3p9">
    <section id="node_h4t9b1s6e3xan7pk2rwc" class="export-section">
    
    <div class="export-section__body"><h1>Error Handling</h1>
<p>The library does not use exceptions to report errors. Every class has an error state instead:</p>
<div class="table-wrapper"><table><thead><tr><th>Method</th><th>Returns</th></tr></thead><tbody><tr><td><code>IsValid()</code></td><td><code>false</code> after an error</td></tr><tr><td><code>GetError()</code></td><td>All error messages, separated by line breaks</td></tr><tr><td><code>TryGetError(out)</code></td><td><code>true</code> and the messages in <code>out</code> if there was an error</td></tr></tbody></table></div>
<p>Functions that can fail (<code>Save</code>, <code>ReadFile</code>, <code>Open</code>, <code>WriteRow</code>, …) also return <code>false</code> or <code>std::nullopt</code>.</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">OTN</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">OTNReader</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">reader</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">if</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">!</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">reader</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">ReadFile</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">data.otn"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">))</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__variable">cerr</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">reader</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">GetError</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">()</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">'</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__escape">\n</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">'</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p>Read errors contain the position in the file:</p>
<div class="code-block-wrapper"><pre><code>Error at line 7, column 12: unexpected token IDENTIFIER(&quot;abc&quot;), expected &#39;;&#39;</code></pre><div class="code-language-tag code-language-tag--unrecognized">text</div></div>
<h2>After an error</h2>
<p>After an error all following calls fail until the state is reset:</p>
<div class="table-wrapper"><table><thead><tr><th>Class</th><th>Reset</th></tr></thead><tbody><tr><td><code>OTNObject</code></td><td>Create a new object</td></tr><tr><td><code>OTNWriter</code></td><td><code>Reset()</code> removes the error and all objects, the options stay</td></tr><tr><td><code>OTNReader</code></td><td>Every <code>ReadFile</code> / <code>ReadString</code> starts with a new state</td></tr><tr><td><code>OTNStreamWriter</code></td><td><code>Open()</code> starts with a new state</td></tr><tr><td><code>OTNStreamReader</code></td><td><code>Open()</code> starts with a new state</td></tr></tbody></table></div>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">OTN</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">OTNWriter</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">writer</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">if</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">!</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">writer</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">AppendObject</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">obj</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">).</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">Save</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">data.otn"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">))</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__variable">cerr</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">writer</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">GetError</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">()</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">'</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__escape">\n</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">'</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">writer</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">Reset</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">();</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// ready for the next file</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">}</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p><code>OTNWriter</code> is not reset by <code>Save()</code> itself, so an error of <code>AppendObject</code> (for example a name that is used twice) is still reported by the next <code>Save()</code>.</p>
<h2>OTNObject</h2>
<p>Adding a row with the wrong number of values, an invalid custom type or invalid names makes the object invalid. Check it before writing:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">if</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">!</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">obj</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">IsValid</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">())</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__variable">cerr</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">obj</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">GetError</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">()</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">'</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__escape">\n</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">'</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p>These checks always run:</p>
<ul><li>object and column names are valid (see <a class="doc-ref" href="#node_w3f6j0p8u2lcy5mx9tbe" data-ref-node="node_w3f6j0p8u2lcy5mx9tbe" title="Types">Types</a>) and column names are unique,</li><li><code>SetNames</code> / <code>SetTypes</code> are called before the first row,</li><li>every row has one value per column,</li><li><code>OTNWriter</code> gets no invalid objects and no two objects with the same name,</li><li>explicit types of custom types (<code>AddTypes</code>) match the values.</li></ul>
<h2>OTN_DEBUG</h2>
<p>Some checks cost time for every row or value, so they only run if <code>OTN_DEBUG</code> is <code>1</code>:</p>
<ul><li>every row has the types of its columns,</li><li>the column names of a custom type are unique.</li></ul>
<p>By default <code>OTN_DEBUG</code> is <code>1</code> in debug builds (without <code>NDEBUG</code>) and <code>0</code> otherwise. To change it, define it in the build system, for example in premake:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_LuaLang_highlightStyle_LuaLang_Dark__identifier">defines</span><span class="token-type_LuaLang_highlightStyle_LuaLang_Dark__other"> </span><span class="token-type_LuaLang_highlightStyle_LuaLang_Dark__punctuation">{</span><span class="token-type_LuaLang_highlightStyle_LuaLang_Dark__other"> </span><span class="token-type_LuaLang_highlightStyle_LuaLang_Dark__string">"</span><span class="token-type_LuaLang_highlightStyle_LuaLang_Dark__string">OTN_DEBUG=1"</span><span class="token-type_LuaLang_highlightStyle_LuaLang_Dark__other"> </span><span class="token-type_LuaLang_highlightStyle_LuaLang_Dark__punctuation">}</span></span></pre><div class="code-language-tag code-language-tag--recognized">lua</div></div>
<p>The value must be the same for all files of the program, because <code>OTNFile.h</code> and <code>OTNFile.cpp</code> both use it.</p>
<h2>Exceptions</h2>
<p>Only reading values can throw:</p>
<ul><li><code>GetValue&lt;T&gt;(row, column)</code> throws <code>std::out_of_range</code> if the row or column does not exist and <code>std::bad_cast</code> if the value does not have the type <code>T</code>.</li><li><code>GetRow(index)</code> throws <code>std::out_of_range</code>.</li></ul>
<p><code>GetValue&lt;T&gt;(row, column, default)</code> and <code>TryGetValue&lt;T&gt;(row, column)</code> never throw.</p>
<p>File system errors are reported as normal errors: missing folders and files, missing rights, failed reads and writes, also when the file is closed (for example a full disk). Only running out of memory (<code>std::bad_alloc</code>) is not caught.</p></div>
  </section>
  </div>
</template>
<template id="tmpl-node_mu55p95x1mur4st1tuzfby">
  <div class="main" data-node-id="node_mu55p95x1mur4st1tuzfby" data-tab-id="tab_ujzde8gxd6ncf10epf91">
    <section id="node_mu55p95x1mur4st1tuzfby" class="export-section">
    
    <div class="export-section__body"><h1>File Format</h1>
<p>An <code>.otn</code> file is UTF-8 text. It starts with a header of directives, followed by one <code>@object</code> block that contains all objects.</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__keyword">@version</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__other">: </span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__number">2</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">;</span>
<span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__other">&nbsp;</span>
<span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__keyword">@object: {</span>
<span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__other">	</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__function">Items</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__number">[2]</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__other"> </span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">{</span>
<span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__other">		</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__type">int</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__operator">/</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__variable">id</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">,</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__other"> </span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__type">String</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__operator">/</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__variable">name</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">,</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__other"> </span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__type">float</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__operator">/</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__variable">value</span>
<span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__other">	</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">}</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">;</span>
<span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__other">	</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__number">1</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">,</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__other"> </span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__string">"</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__string">Sword"</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">,</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__other"> </span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__number">42.5</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">;</span>
<span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__other">	</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__number">2</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">,</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__other"> </span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__string">"</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__string">Shield"</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">,</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__other"> </span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__number">17.25</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">;</span>
<span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__other">	</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__function">Enemies</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__number">[1]</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__other"> </span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">{</span>

<p>Spaces, tabs and line breaks between tokens have no meaning. Comments are not supported. A UTF-8 byte order mark at the start is allowed, UTF-16 and UTF-32 files are not (see <a class="doc-ref" href="#node_w3f6j0p8u2lcy5mx9tbe" data-ref-node="node_w3f6j0p8u2lcy5mx9tbe" title="Types">Types</a>).</p>
<h2>Structure</h2>
<div class="table-wrapper"><table><thead><tr><th>Part</th><th>Required</th><th>Content</th></tr></thead><tbody><tr><td><code>@version: N;</code></td><td>yes</td><td>Format version, always the first statement. Files are written with version <code>2</code>, versions <code>1</code> and <code>2</code> can be read (see <a class="doc-ref" href="#node_mu55p95x1mur4st1tuzfby" data-ref-node="node_mu55p95x1mur4st1tuzfby" data-ref-anchor="a-node_mu55p95x1mur4st1tuzfby-file-versions" title="File Format #file-versions">File versions</a>).</td></tr><tr><td><code>@defType: …;</code></td><td>no</td><td>Numbers for type names, see <a class="doc-ref" href="#node_mu55p95x1mur4st1tuzfby" data-ref-node="node_mu55p95x1mur4st1tuzfby" data-ref-anchor="a-node_mu55p95x1mur4st1tuzfby-deftype-and-defname" title="File Format #deftype-and-defname">DefType and DefName</a></td></tr><tr><td><code>@defName: …;</code></td><td>no</td><td>Numbers for column names</td></tr><tr><td><code>@object: { … };</code></td><td>yes</td><td>All objects. Nothing may follow after the closing <code>};</code>.</td></tr></tbody></table></div>
<p><code>@defType</code> and <code>@defName</code> stand between <code>@version</code> and <code>@object</code>, in any order.</p>
<p>Unknown directives are an error.</p>
<h2>Objects</h2>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__identifier">Name</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">[</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__identifier">rowCount</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">]</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__other"> </span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">{</span>

<span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__identifier">value</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">,</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__other"> </span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__identifier">value</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">,</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__other"> ...</span><span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__punctuation">;</span>

<ul><li><code>Name</code> is the object name. Every name may only appear once per file. Names consist of letters, digits, <code>_</code> and UTF-8 characters and do not start with a digit.</li><li><code>rowCount</code> is the exact number of rows that follow.</li><li>The header lists every column as <code>type/name</code>, separated by commas.</li><li>Every row has one value per column, separated by commas and ended by <code>;</code>.</li></ul>
<p>Objects can appear in any order. A reference may point to an object that comes later in the file.</p>
<h2>Types</h2>
<div class="table-wrapper"><table><thead><tr><th>Type in the file</th><th>Values</th></tr></thead><tbody><tr><td><code>int</code>, <code>int64</code>, <code>uint64</code></td><td>Integers: <code>42</code>, <code>-7</code></td></tr><tr><td><code>float</code>, <code>double</code></td><td>Numbers: <code>1.5</code>, <code>-0.25</code>, <code>3</code></td></tr><tr><td><code>bool</code></td><td><code>true</code>, <code>false</code></td></tr><tr><td><code>String</code></td><td><code>&quot;text&quot;</code> with the escapes <code>\&quot;</code>, <code>\\</code>, <code>\n</code>, <code>\t</code></td></tr><tr><td><code>any</code></td><td>Number, string, <code>true</code>/<code>false</code>, reference <code>Name#index</code> or a list of these</td></tr><tr><td><code>Ref&lt;Name&gt;</code></td><td>Row index in the object <code>Name</code>: <code>0</code>, <code>5</code></td></tr><tr><td><code>T[]</code>, <code>T[][]</code>, …</td><td>Lists: <code>[1, 2, 3]</code>, <code>[[1, 2], [3]]</code>, <code>[]</code></td></tr></tbody></table></div>
<p>Integers are checked strictly: <code>3.5</code> in an <code>int</code> column or a value outside the range of the type is an error.</p>
<p>Numbers in <code>any</code> columns get the smallest type that fits: <code>int</code>, then <code>int64</code>, then <code>uint64</code>. Numbers with a decimal point or exponent become <code>double</code>. See <a class="doc-ref" href="#node_w3f6j0p8u2lcy5mx9tbe" data-ref-node="node_w3f6j0p8u2lcy5mx9tbe" title="Types">Types</a>.</p>

<span class="token-type_OtnLang_highlightStyle_OtnLang_Dark__other">&nbsp;</span>

<p>Every entry is <code>name = number</code>. In the object headers the number can stand in place of the type or the column name: <code>1/value</code> means <code>float/value</code>, with <code>@defName</code> the name can be a number as well (<code>1/0</code>). A number that is not defined is an error.</p>
<p>A name only gets a number if the characters saved by all its uses are more than the entry costs (<code>String = 0, </code>), and the table as a whole has to pay for the directive (<code>@defType: ;</code>) too. Names that save the most get the smallest numbers. In the example <code>int</code> (3 characters) and the column names are not replaced, because they would not save enough. So the file is never longer than without these options.</p>

<h2>Compact form</h2>
<p>With <code>UseOptimizations(true)</code> all optional spaces and line breaks are removed:</p>

<h2>File names</h2>
<p>The extension is <code>.otn</code>. A path without an extension gets <code>.otn</code>, a different extension is an error. <code>OTNStreamWriter</code> uses a temporary file with the extension <code>.otn.tmp</code> next to the target file while writing.</p>
<h2>Versions <span class="doc-anchor" id="a-node_mu55p95x1mur4st1tuzfby-file-versions"></span></h2>
<p>The writers always write the newest version. The readers read every version, the version is taken from <code>@version</code>.</p>
<div class="table-wrapper"><table><thead><tr><th>Version</th><th>Changes</th></tr></thead><tbody><tr><td><code>1</code></td><td>First version</td></tr><tr><td><code>2</code></td><td>References in <code>any</code> columns (<code>Name#index</code>), object names in <code>@defType</code></td></tr></tbody></table></div>
<p>A version 1 file is still valid in version 2. A file that uses version 2 syntax with <code>@version: 1</code> is an error.</p></div>
