  var allNodes = [{"id":"node_mu55p95x7rsejz9hraxp","tabId":"tab_mu55p95xy2tfxuvim3p9"},{"id":"node_mu55p95xweb2mx16dzzse","tabId":"tab_mu55p95xy2tfxuvim3p9"},{"id":"node_mu55p95x1j1aoqjvokje3","tabId":"tab_mu55p95xy2tfxuvim3p9"},{"id":"node_mu55p95xk2i6alcuiyw","tabId":"tab_mu55p95xy2tfxuvim3p9"},{"id":"node_mu55p95x1u9dp3uu56hz2","tabId":"tab_mu55p95xy2tfxuvim3p9"},{"id":"node_mu55p95x16kjtnh1dqih2o","tabId":"tab_mu55p95x1a6rhrm1czr561"},{"id":"node_mu55p95xcc3t1kyr59wt","tabId":"tab_mu55p95x1a6rhrm1czr561"},{"id":"node_mu55p95x60r14y7tsvw1","tabId":"tab_mu55p95x1a6rhrm1czr561"},{"id":"node_mu55p95x1mr9l481ystmfe","tabId":"tab_mu55p95x1a6rhrm1czr561"},{"id":"node_mu55p95x18c549nhu7cu9","tabId":"tab_mu55p95x1a6rhrm1czr561"},{"id":"node_mu55p95x1r773m4107y4xr","tabId":"tab_mu55p95x1a6rhrm1czr561"},{"id":"node_mu55p95x1mur4st1tuzfby","tabId":"tab_mu55p95x1a6rhrm1czr561"}];
  var firstNode = {"id":"node_mu55p95x7rsejz9hraxp","tabId":"tab_mu55p95xy2tfxuvim3p9"};
  var searchIndex = [{"nodeId":"node_mu55p95x7rsejz9hraxp","tabId":"tab_mu55p95xy2tfxuvim3p9","title":"Getting Started","headings":["Getting Started","What you need","How it works","Requirements"],"content":"OTN (Object Tokenized Notation) is a text-based serialization format that stores structured data in a tabular style — similar to a spreadsheet or database table. Data is organized in named objects , each with typed columns and any number of data rows. Only two files are required: - `OTNFile.h` — the full API header - `OTNFile.cpp` — the implementation Add both to your project and include the header: ```cpp #include \"OTNFile.h\" ``` Everything is built around `OTNObject`, which is like a table: it has a name, column names, column types, and rows of data. You build one or more objects in memory, write them to a `.otn` file with `OTNWriter`, and read them back with `OTNReader`. - C++17 or later - Tested on Windows --- Tip: The `.otn` extension is added automatically if you omit it from any file path."},{"nodeId":"node_mu55p95xweb2mx16dzzse","tabId":"tab_mu55p95xy2tfxuvim3p9","title":"Writing Data","headings":["Writing Data","Basic example","Setting column types explicitly","Multiple objects in one file","Serializing to a string","Writer options","Error handling"],"content":"Use `OTNObject` to build your data in memory, then `OTNWriter` to save it to a file. ```cpp OTN::OTNObject obj{ \"Items\" }; obj.SetNames(\"id\", \"name\", \"value\") .AddDataRow(1, \"Sword\", 42.5f) .AddDataRow(2, \"Shield\", 17.3f) .AddDataRow(3, \"Bow\", 8.1f); OTN::OTNWriter writer; writer.AppendObject(obj) .Save(\"data.otn\"); ``` Types are deduced automatically from the first row you add. If you want to be explicit, call `SetTypes()` before `AddDataRow()`: ```cpp obj.SetNames(\"id\", \"name\", \"value\") .SetTypes(\"int\", \"String\", \"float\") .AddDataRow(1, \"Sword\", 42.5f); ``` Supported type strings: `int`, `int64`, `uint64`, `float`, `double`, `bool`, `String`, `any`, and any custom object name (e.g. `\"WeaponStats\"`). Append `[]` for arrays (e.g. `\"int[]\"`). Use `\"-\"`, `\"\"`, or `\" \"` as a placeholder to skip defining a type for that column — it will be deduced from the first inserted row. ```cpp OTN::OTNWriter writer; writer.AppendObject(itemsObj) .AppendObject(enemiesObj) .AppendObject(configObj) .Save(\"gamedata.otn\"); ``` ```cpp std::string text; if (writer.SaveToString(text)) { // text now contains the full OTN content } ``` All options are set before calling `Save()` and support method chaining. | Option | Method | Default | Description | |---|---|---|---| | DefName | `UseDefName(true)` | off | Replaces frequently used column names with numeric IDs to reduce file size | | DefType | `UseDefType(true)` | off | Replaces frequently used type names with numeric IDs | | Optimizations | `UseOptimizations(true)` | off | Removes all spaces and line breaks from the output | | Deduplication | `UseDeduplicateRows(true)` | off | Skips writing identical rows that already exist in the object | ```cpp OTN::OTNWriter writer; writer.UseDefName(true) .UseDefType(true) .UseOptimizations(true) .AppendObject(obj) .Save(\"data.otn\"); ``` ```cpp OTN::OTNWriter writer; writer.AppendObject(obj); if (!writer.Save(\"data.otn\")) { std::cerr << writer.GetError() << std::endl; } ``` `OTNObject` itself can also reach an error state. Always check before passing it to the writer: ```cpp if (!obj.IsValid()) { std::cerr << obj.GetError() << std::endl; } ```"},{"nodeId":"node_mu55p95x1j1aoqjvokje3","tabId":"tab_mu55p95xy2tfxuvim3p9","title":"Reading Data","headings":["Reading Data","Opening a file","Retrieving an object","Reading values","Iterating all rows","Reading all objects at once","Reading lists / arrays","Objects with multiple rows become lists"],"content":"Use `OTNReader` to load a `.otn` file into memory. All objects are fully parsed and accessible via name lookup. ```cpp OTN::OTNReader reader; if (!reader.ReadFile(\"data.otn\")) { std::cerr << reader.GetError() << std::endl; return; } ``` You can also parse from a string: ```cpp std::string otnText = / ... /; if (!reader.ReadString(otnText)) { / ... / } ``` ```cpp auto obj = reader.TryGetObject(\"Items\"); if (!obj) { // object not found } ``` `TryGetObject` returns `std::optional<OTNObject `, so it is safe even if the name doesn't exist in the file. There are three ways to read a value from a row, depending on how much safety you need. Throwing access (use when the data must exist): ```cpp int id = obj- GetValue<int (0, \"id\"); std::string name = obj- GetValue<std::string (0, \"name\"); float val = obj- GetValue<float (0, \"value\"); ``` With a fallback default (safe, no exception): ```cpp int id = obj- GetValue<int (0, \"id\", -1); float val = obj- GetValue<float (0, \"value\", 0.0f); ``` As `std::optional` (fully safe): ```cpp std::optional<int id = obj- TryGetValue<int (0, \"id\"); std::optional<std::string name = obj- TryGetValue<std::string (0, \"name\"); ``` All three variants accept either a column name (`\"id\"`) or a column index (`0`). ```cpp for (size t row = 0; row < obj- GetRowCount(); ++row) { int id = obj- GetValue<int (row, \"id\", -1); auto name = obj- TryGetValue<std::string (row, \"name\"); } ``` ```cpp const auto& allObjects = reader.GetObjects(); for (const auto& [name, object] : allObjects) { // process each object } ``` If a column was saved with a vector value (e.g. `std::vector<int `), read it back the same way: ```cpp auto tags = obj- TryGetValue<std::vector<int (0, \"tags\"); if (tags) { for (int t : tags) { / ... / } } ``` When an `OTNObject` is stored as a nested value inside another object and that inner object has more than one row , it is stored in the file as a list of integer row indices. When reading back, such a column must be read as `std::vector<OTNObject ` or `std::vector<YourCustomType `, not as a single value. ```cpp // Writing — \"inventory\" column contains multiple Item rows OTN::OTNObject items{ \"Item\" }; items.SetNames(\"name\", \"qty\") .AddDataRow(\"Sword\", 1) .AddDataRow(\"Potion\", 5); OTN::OTNObject player{ \"Player\" }; player.SetNames(\"name\", \"inventory\") .AddDataRow(\"Hero\", items); // items has 2 rows → becomes a list // Reading auto items = obj- TryGetValue<std::vector<OTNObject (0, \"inventory\"); ``` A nested object with exactly one row is read back as a single value. The moment it has two or more rows it becomes a list in the file, and you must read it as a list."},{"nodeId":"node_mu55p95xk2i6alcuiyw","tabId":"tab_mu55p95xy2tfxuvim3p9","title":"Custom Types","headings":["Custom Types","Defining a specialization","Using a custom type","Separating save and load logic","Rules for custom types","Nested custom types","Using custom types in vectors"],"content":"OTN supports serialization of arbitrary C++ structs through template specialization of `OTN::ToOTNDataType<T `. Provide a `template< ` specialization in a header visible to both your write and read code. The function receives an `OTNObjectBuilder&` and a reference to your type `T`. ```cpp struct Vector2 { float x, y; }; template< inline void OTN::ToOTNDataType<Vector2 (OTN::OTNObjectBuilder& obj, Vector2& v) { obj.SetObjectName(\"Vector2\"); obj.AddNames(\"x\", \"y\"); obj.AddData(v.x, v.y); } ``` The builder operates in two modes transparently: - Serialization (`T → OTNObject`): `AddData` captures the values from your struct. - Deserialization (`OTNObject → T`): `AddData` writes values back into your struct. You use the same function body for both directions in the simple case. Once specialized, your type can be used anywhere a value is expected — as a column value, inside a vector, or nested within another object. ```cpp Vector2 pos{ 10.0f, 20.0f }; OTN::OTNObject obj{ \"Entities\" }; obj.SetNames(\"id\", \"position\") .AddDataRow(1, pos); ``` Reading back: ```cpp auto maybePos = obj- TryGetValue<Vector2 (0, \"position\"); if (maybePos) { float x = maybePos- x; } ``` Use `IsBuildingOTNObject()` when the save and load paths need to differ — for example, when packing data into a compact representation on save and unpacking it on load. ```cpp template< inline void OTN::ToOTNDataType<Vector2 (OTN::OTNObjectBuilder& obj, Vector2& e) { obj.SetObjectName(\"Vector2\"); obj.AddNames(\"coords\"); if (obj.IsBuildingOTNObject()) { // Serialization: pack x and y into a float list obj.AddData(std::vector<float { e.x, e.y }); } else { // Deserialization: unpack from the list std::vector<float tmp; obj.AddData(tmp); if (tmp.size() = 2) { e.x = tmp[0]; e.y = tmp[1]; } } } ``` - Your type must have a default constructor (used during deserialization). - The order in which you call `AddData` determines the column order in the file. Changing this order is a breaking change — existing files will no longer deserialize correctly. - `SetObjectName` is required. The name is used as the type identifier in the OTN file. - `AddNames` only matters during serialization. During deserialization, data is consumed positionally by `AddData` calls. Custom types can contain other custom types. Each nested type will be serialized as a sub-object and written to the file before its parent. ```cpp struct Transform { Vector2 position; float rotation; }; template< inline void OTN::ToOTNDataType<Transform (OTN::OTNObjectBuilder& obj, Transform& t) { obj.SetObjectName(\"Transform\"); obj.AddNames(\"position\", \"rotation\"); obj.AddData(t.position, t.rotation); } ``` ```cpp std::vector<Vector2 path = { {0,0}, {1,2}, {3,4} }; OTN::OTNObject route{ \"Route\" }; route.SetNames(\"waypoints\") .AddDataRow(path); ``` Reading back: ```cpp auto waypoints = obj- TryGetValue<std::vector<Vector2 (0, \"waypoints\"); ```"},{"nodeId":"node_mu55p95x1u9dp3uu56hz2","tabId":"tab_mu55p95xy2tfxuvim3p9","title":"Streaming","headings":["Streaming","OTNStreamReader","OTNStreamWriter","Streaming workflow (BeginObject / WriteRow / EndObject)","High-level AppendObject","Object references in streaming"],"content":"For large datasets where loading the full file into memory is not acceptable, OTN provides streaming variants of both the reader and writer. These keep only one object's worth of data in memory at a time. Note: The streaming classes have fewer features than their non-streaming counterparts. Object references are unresolved in `OTNStreamReader`, and `OTNStreamWriter` does not apply DefType/DefName optimizations. If your data fits comfortably in memory, prefer `OTNReader` and `OTNWriter` for the full feature set. Reads objects and rows one at a time without loading the whole file. ```cpp OTN::OTNStreamReader reader; if (!reader.Open(\"data.otn\")) { std::cerr << reader.GetError() << std::endl; return; } while (reader.NextObject()) { std::cout << reader.GetCurrentObjectName() << \"\\n\"; OTN::OTNRow row; while (reader.ReadRow(row)) { // process individual row values // row[0].value, row[1].value, etc. } } ``` Objects must be read sequentially — there is no random access. If you call `NextObject()` before consuming all rows of the current object, the remaining rows are skipped automatically. You can also skip explicitly: ```cpp while (reader.NextObject()) { if (reader.GetCurrentObjectName() != \"Items\") { reader.SkipCurrentObject(); continue; } // process Items... } ``` Available metadata for the current object: ```cpp reader.GetCurrentObjectName(); // object name reader.GetColumnNames(); // column names reader.GetColumnTypes(); // type descriptors reader.GetRemainingRowCount(); // rows not yet read reader.HasMoreRows(); // true while rows remain reader.HasMoreObjects(); // true while objects remain ``` Limitations of OTNStreamReader: - Object references (`object ref` columns) are returned as unresolved `OTNObjectRef` values. They are not resolved to actual `OTNObject` instances. - No random access to rows or objects. - Objects must be read in file order. Writes objects and rows one at a time to a file without buffering all data in memory. Use this when you are generating rows on the fly and the total count is not known upfront. ```cpp OTN::OTNStreamWriter writer; writer.Open(\"output.otn\"); writer.BeginObject(\"Items\", OTN::col(\"id\", \"int\"), OTN::col(\"name\", \"String\"), OTN::col(\"value\", \"float\")); for (auto& item : myItems) { writer.WriteRow(item.id, item.name, item.value); } writer.EndObject(); writer.Close(); ``` The row count is not written into the file header until `EndObject()` is called. The writer patches the count back in via `seekp` at that point. For complete `OTNObject` instances (including nested custom types), use `AppendObject`. It handles sub-object serialization depth-first and deduplicates repeated sub-object instances automatically. ```cpp writer.AppendObject(myComplexObject); ``` When you need one object to reference rows of another, use integer indices directly. `GetWrittenRowCount()` gives you the next available index for a named object. ```cpp size t statsIdx = writer.GetWrittenRowCount(\"WeaponStats\"); writer.BeginObject(\"WeaponStats\", OTN::col(\"damage\", \"float\"), OTN::col(\"speed\", \"float\")); writer.WriteRow(15.5f, 1.2f); writer.EndObject(); writer.BeginObject(\"Weapon\", OTN::col(\"name\", \"String\"), OTN::col(\"stats\", \"WeaponStats\")); writer.WriteRow(\"Sword\", statsIdx); // reference by row index writer.EndObject(); writer.Close(); ``` Files written by `OTNStreamWriter` are fully compatible with both `OTNReader` and `OTNStreamReader`."},{"nodeId":"node_mu55p95x16kjtnh1dqih2o","tabId":"tab_mu55p95x1a6rhrm1czr561","title":"Type System","headings":["Type System","OTNBaseType","OTNTypeDesc","Type string parsing","OTNValueVariant","OTNValue","Type traits"],"content":"OTN's type system maps C++ types to a small set of base types stored in the file. Everything in the system ultimately resolves to an `OTNBaseType` enum value. ```cpp enum class OTNBaseType { UNKNOWN = 0, INT, // int (32-bit signed) UINT64, // uint64 t INT64, // int64 t FLOAT, // float DOUBLE, // double BOOL, // bool STRING, // std::string OBJECT, // nested OTNObject (resolved pointer) OBJECT REF, // unresolved integer reference (internal, during parsing) LIST, // OTNArray — a sequence of OTNValues ANY // untyped — type is stored inline per value }; ``` `OBJECT REF` only exists transiently during file parsing. After `OTNReader` finishes reading, all `OBJECT REF` values are resolved to `OBJECT` values (actual `OTNObjectPtr` pointers). User code never sees `OBJECT REF` unless it uses `OTNStreamReader`, where references remain unresolved by design. `OTNTypeDesc` describes a column type, including array nesting depth and optional object name. ```cpp struct OTNTypeDesc { OTNBaseType baseType = OTNBaseType::UNKNOWN; uint32 t listDepth = 0; // 0 = scalar, 1 = T[], 2 = T[][], ... std::string refObjectName; // only used when baseType == OBJECT }; ``` Examples: | C++ type | baseType | listDepth | refObjectName | |---|---|---|---| | `int` | `INT` | 0 | — | | `std::vector<int ` | `INT` | 1 | — | | `std::vector<std::vector<float ` | `FLOAT` | 2 | — | | `MyStruct` | `OBJECT` | 0 | `\"MyStruct\"` | | `std::vector<MyStruct ` | `OBJECT` | 1 | `\"MyStruct\"` | Type strings like `\"int\"`, `\"float[]\"`, or `\"WeaponStats\"` are parsed by `StringToOTNBaseType`. If the string does not match any known primitive, it is treated as an object type name and `baseType` is set to `OBJECT` with `refObjectName` set to the string value. Array brackets `[]` increase `listDepth` by one per pair. All runtime values are stored as a `std::variant`: ```cpp using OTNValueVariant = std::variant< int, int64 t, uint64 t, float, double, bool, std::string, OTNObjectPtr, // shared ptr<OTNObject OTNArrayPtr, // shared ptr<OTNArray OTNObjectRef // integer ref — internal only ; ``` `OTNArray` is a simple container: ```cpp class OTNArray { public: std::vector<OTNValue values; }; ``` Nested lists are represented by nesting `OTNArray` inside `OTNArray` — an `OTNValue` of type `LIST` whose inner values are also `LIST`-typed. `OTNValue` wraps a `OTNValueVariant` together with a cached `OTNBaseType` tag for fast type checks without calling `std::visit`: ```cpp struct OTNValue { OTNValueVariant value; OTNBaseType type = OTNBaseType::UNKNOWN; }; ``` The `type` field is set automatically from the variant on construction via `GetTypeFromVariant`. Several `constexpr` traits drive compile-time dispatch: | Trait | Purpose | |---|---| | `is otn base type v<T ` | True for all primitive types OTN can store directly (`int`, `float`, `std::string`, `const char `, etc.) | | `is otn list v<T ` | True for `std::vector<T ` and `std::array<T,N ` | | `otn is std vector<T ` | True only for `std::vector<T ` (used in deserialization) | | `is otn variant v<T ` | True when T is exactly `OTNValueVariant` | | `OTNTypeOf<T ::value` | Maps a C++ type to its `OTNBaseType` at compile time | These traits are used throughout `OTNDataType`, `AddSingleValueToRow`, and `TryDeserializeValue` to pick the correct code path without runtime branching."},{"nodeId":"node_mu55p95xcc3t1kyr59wt","tabId":"tab_mu55p95x1a6rhrm1czr561","title":"Type Conversion","headings":["Type Conversion","Serialization: C++ → OTNValue","Deserialization: OTNValue → C++","The one-row requirement for custom types","OTNObjectBuilder deserialization mode","Type deduction"],"content":"The conversion pipeline is the bridge between raw C++ values and `OTNValue` instances stored in `OTNObject` rows. It runs in both directions: serialization (C++ → `OTNValue`) and deserialization (`OTNValue` → C++). `OTNDataType<T ` is the entry point for converting a C++ value into an `OTNValue`. It is instantiated every time a value is added to a row. ``` AddDataRow(v.x, v.y) → AddSingleValueToRow(row, v.x, ...) → OTNDataType<float (v.x) → m value = v.x (is otn base type v<float = true) ``` The `OTNDataType::Construct` method dispatches on type traits: | Input type | Dispatch path | |---|---| | Primitive (`int`, `float`, `bool`, `std::string`, …) | Stored directly in the variant | | `const char ` | Converted to `std::string`, then stored | | `uint32 t` / `unsigned int` | Widened to `int64 t` (no `uint32 t` slot in the variant) | | `std::vector<T ` / `std::array<T,N ` | Creates an `OTNArray`; each element recursively constructed via `OTNDataType<elem type ` | | `OTNObject` | Wrapped in a `shared ptr<OTNObject ` and stored as `OBJECT` | | Any other type `T` | Calls `ToOTNDataType<T ` via `OTNObjectBuilder` (custom type path) | For custom types, an `OTNObjectBuilder` is constructed in serialization mode, `ToOTNDataType` is called, and the resulting `OTNObject` is boxed into a `shared ptr` and stored as `OBJECT`. `OTNObject::TryDeserializeValue<T ` converts an `OTNValue` back to a C++ type `T`. It is called by all `GetValue` / `TryGetValue` overloads. ``` TryGetValue<Vector2 (row, \"position\") → TryDeserializeValue<Vector2 (val) → val.type == OBJECT → ptr- GetRowCount() == 1 → OTNObjectBuilder{ ptr } (deserialization mode) → ToOTNDataType<Vector2 (builder, result) → result is filled ``` Dispatch in `TryDeserializeValue`: | Target type `T` | Condition | Action | |---|---|---| | Base primitive (`int`, `float`, `bool`, `std::string`, …) | `is otn base type v<T ` | `std::get<T (val.value)` — throws on mismatch, returns nullopt via catch | | `std::vector<ElemType ` | `otn is std vector<T ` | Iterates `OTNArray::values`, recursively deserializes each element | | `OTNObject` | `std::is same v<T, OTNObject ` | Dereferences the `OTNObjectPtr` | | Custom type `T` | fallback | Requires `val.type == OBJECT` and `GetRowCount() == 1`; creates `OTNObjectBuilder` in deserialization mode and calls `ToOTNDataType` | A nested `OTNObject` can only be deserialized into a single custom struct if it has exactly one row . If the object has more than one row, `TryDeserializeValue` returns `std::nullopt` for a scalar `T`. In that case, read the column as `std::vector<T ` instead. See the Reading Data section for a detailed explanation. When `OTNObjectBuilder` is constructed with an `OTNObject` (deserialization mode), `AddData(T& ref)` reads from the object's first row sequentially by position. Each call to `AddData` advances an internal cursor `m dataPos`. This means the order of `AddData` calls in `ToOTNDataType` must exactly match the column order used during serialization. ``` Deserialization call sequence for Vector2: obj.AddNames(\"x\", \"y\") → no-op in deserialization mode obj.AddData(e.x) → reads m data[0] into e.x, m dataPos = 1 obj.AddData(e.y) → reads m data[1] into e.y, m dataPos = 2 ``` When `SetTypes()` is not called, column types are deduced automatically from the first row inserted via `AddDataRow`. `DeduceTypesFromRow` calls `OTNWriter::DeduceColumnType` on each `OTNValue` in that row, which inspects the variant index and the object name for `OBJECT` types. Subsequent rows are validated in debug builds to ensure type consistency."},{"nodeId":"node_mu55p95x60r14y7tsvw1","tabId":"tab_mu55p95x1a6rhrm1czr561","title":"OTNObject","headings":["OTNObject Internals","Internal state","Column name validation","Type deduction","Column lookup","Row access","Error state"],"content":"`OTNObject` is the central data structure. It holds the schema (names + types) and all data rows for one logical table. | Member | Type | Description | |---|---|---| | `m name` | `std::string` | Object identifier; written as the object name in the file | | `m columnNames` | `vector<string ` | Column names, one per column | | `m columnTypes` | `vector<OTNTypeDesc ` | Type descriptor per column; may be empty until deduced | | `m dataRows` | `vector<OTNRow ` | All data rows; each row is a `vector<OTNValue ` | | `m columnIndexCache` | `unordered map<string, size t ` | Lazy-built name→index cache for fast column lookup | | `m deducedColumnTypes` | `bool` | True after types have been deduced from the first row | | `m valid` | `bool` | False if any error occurred during building | | `m wasBuildFromT` | `bool` | True if the object was created via `OTNObjectBuilder` (custom type path) | Names are checked in debug builds by `DebugIsNameValid`. A name must not start with a digit and must not contain any OTN syntax characters (`@`, `:`, `=`, `,`, `/`, `{`, `}`, `[`, `]`, `<`, ` `, `;`). Duplicate names are also caught by `DebugValidateNamesDistinct`. `DeduceTypesFromRow` is called automatically after the first `AddDataRow` if `SetTypes()` was never called. It derives `OTNTypeDesc` from each `OTNValue` by inspecting the variant. For `OBJECT`-typed values it also captures the `refObjectName` from the embedded `OTNObject`. Once deduced, `m deducedColumnTypes` is set to `true` and subsequent rows are type-checked in debug builds by `DebugValidateDataTypes`. `GetColumnID(name)` looks up a column index by name. Results are cached in `m columnIndexCache` after the first lookup. The cache is invalidated (cleared) when `SetNames()` is called. `GetRow(index)` is bounds-checked and throws `std::out of range` on invalid indices. `GetValue<T ` and `TryGetValue<T ` both delegate to `TryDeserializeValue<T ` internally; the difference is that `GetValue<T ` without a default re-throws from `std::get` on type mismatch, while `TryGetValue<T ` catches all exceptions and returns `std::nullopt`. Any error sets `m valid = false` and appends a message to `m error`. Errors do not throw — the object silently enters an invalid state that can be queried via `IsValid()`, `GetError()`, or `TryGetError()`. Invalid objects should not be passed to `OTNWriter`."},{"nodeId":"node_mu55p95x1mr9l481ystmfe","tabId":"tab_mu55p95x1a6rhrm1czr561","title":"OTNObjectBuilder","headings":["OTNObjectBuilder","Two modes","Serialization mode (T → OTNObject)","Deserialization mode (OTNObject → T)","AddNameData","Data sync validation"],"content":"`OTNObjectBuilder` is the runtime bridge that makes the same `ToOTNDataType<T ` specialization work for both serialization and deserialization. The mode is determined by which constructor is used: ```cpp OTNObjectBuilder builder; // serialization mode (T → OTNObject) OTNObjectBuilder builder{ obj }; // deserialization mode (OTNObject → T) ``` `IsBuildingOTNObject()` returns `true` in serialization mode. - `SetObjectName(name)` — stores the object name. - `AddNames(\"x\", \"y\", ...)` — records column names for the output object. - `AddData(v.x, v.y, ...)` — each value is wrapped in `OTNDataType<U ` and appended to `m data`. For custom types this recurses, calling `ToOTNDataType` again. - `ToOTNObject()` — consumes the builder (rvalue-only) and returns an `OTNObject` built from the collected names and data. Called internally after `ToOTNDataType` returns. The constructor `OTNObjectBuilder(const OTNObject& obj)` copies the first row of `obj` into `m data` and sets `m otnObjectFromT = false`. - `SetObjectName(name)` — checks that the provided name matches the source object name. Reports an error on mismatch (but does not abort). - `AddNames(...)` — no-op; column positions are used, not names. - `AddData(ref)` — reads `m data[m dataPos]` and writes the value into `ref` via `DeserializeFromOTNValue`. Advances `m dataPos`. `DeserializeFromOTNValue<T ` handles base types (`std::get<T `), lists (iterates `OTNArray`), `OTNObject` values (dereferences pointer), and custom types (creates a nested builder and recurses). `AddNameData(name, data)` is a convenience that combines one `AddNames` and one `AddData` call atomically, with a sync check. It is useful when the name and value for a column are available together. In serialization mode, `AddName` ensures each name is unique. `IsDataOutOfSync()` is checked before `AddNameData` to verify that the number of names and data values match — an out-of-sync state indicates a programming error in the `ToOTNDataType` specialization."},{"nodeId":"node_mu55p95x18c549nhu7cu9","tabId":"tab_mu55p95x1a6rhrm1czr561","title":"Writer Internals","headings":["Writer Internals","Phase 1 — CreateWriteData","Phase 2 — WriteBody / WriteObjects","OTNStreamWriter"],"content":"`OTNWriter` collects `OTNObject` instances and serializes them to a `.otn` text file in a two-phase process: first all objects are converted to an internal `SerializedObject` representation, then the file is written in a single forward pass. `CreateWriteData` iterates all `OTNObject` instances and calls `AddObject` for each one. `AddObject` resolves nested `OBJECT` references: any column value of type `OBJECT` is recursively added as its own object, and the reference is replaced with an `OBJECT REF` (integer index) pointing into that child object's row list. This depth-first traversal ensures child objects are always written before the parent. `ConvertToSerValue` performs the actual OBJECT→OBJECT REF replacement and also strips list wrappers from OBJECT lists down to a list of integer refs. If `UseDeduplicateRows(true)` is set, `SerializedObject::AddOrGetRow` checks a row hash map before inserting. Identical rows (same column types and equal values) share a single stored row, and the returned index is reused. `WriteObjects` emits one OTN object block per `SerializedObject`. Each block has the form: ```otn ObjectName[rowcount] { type/name, type/name, type/name }; value, value, value; // row 1 value, value, value; // row 2 ... // row n ``` Column types are written as slash-separated type tokens in the column header line, followed by comma-separated column names. Each row is written as a semicolon-terminated value list. If `UseDefType` or `UseDefName` is active, frequently used type or name strings are replaced with their pre-assigned numeric ID (`@defType`/`@defName` header tables), reducing file size. `BufferedIndentedStream` accumulates output in a 64 KB in-memory buffer and flushes to the `std::ofstream` in chunks, avoiding one system call per value. If `UseOptimizations` is active, all spaces, tabs, and newlines are suppressed. `OTNStreamWriter` writes one row at a time without buffering the full data set. BeginObject / WriteRow / EndObject flow: 1. `BeginObject` writes the object header line with a placeholder row count field (9-character wide). The stream position of this placeholder is saved in `m countPos`. 2. `WriteRow` converts each value via `OTNDataType<T ` and calls `WriteRowInternal`, which serializes one row to the file immediately. 3. `EndObject` seeks back to `m countPos` via `seekp`, overwrites the placeholder with the actual row count, then seeks back to the end to resume writing. AppendObject flow: `AppendObject` calls `EnsureSubObjectsWritten` recursively for any nested `OBJECT` values in the source `OTNObject`. Sub-objects are written before the parent (depth-first). Pointer-based deduplication (`m objPtrToIndex`) ensures that the same `OTNObject` instance is written only once even if referenced from multiple rows. `WriteObjectHeaderKnown` is used by `AppendObject` since the row count is already known before writing starts, so no `seekp` is needed."},{"nodeId":"node_mu55p95x1r773m4107y4xr","tabId":"tab_mu55p95x1a6rhrm1czr561","title":"Reader & Parser","headings":["Reader & Parser","Stage 1 — File loading","Stage 2 — Tokenization (OTNTokenizer)","Stage 3 — Parsing (OTNReaderV1)","Reference resolution","OTNStreamReader parsing"],"content":"`OTNReader` parses a `.otn` file in three stages: file loading, tokenization, and parsing. `ReadFile` opens the file with `std::ifstream`, reads the entire content into a `std::string`, and passes it to `ReadData`. `ReadString` skips the file step and feeds the string directly. `OTNTokenizer` operates on a `string view` over the in-memory content. It walks the buffer character by character and emits `Token` instances into a flat `std::vector<Token `. Each token carries its type, text content, and the line/column position for error messages. The token types map directly to OTN syntax characters and identifiers: | Token type | Source character(s) | |---|---| | `IDENTIFIER` | Letters, digits, ` ` sequences | | `NUMBER` | Digit sequences (integers and decimals) | | `STRING` | Quoted string literals `\"...\"` | | `KEYWORD PREFIX` | `@` | | `COLON` | `:` | | `EQUALS` | `=` | | `COMMA` | `,` | | `SLASH` | `/` | | `SEMICOLON` | `;` | | `BLOCK BEGIN` / `BLOCK END` | `{` / `}` | | `LIST BEGIN` / `LIST END` | `[` / `]` | | `REF BEGIN` / `REF END` | `<` / ` ` | | `MINUS` | `-` (kept separate to handle negative numbers) | | `END OF FILE` | end of input | Whitespace and comments (if any) are skipped silently. The tokenizer does not allocate sub-strings; `Token::text` is either a copy of the matched characters or left empty for single-character tokens. `OTNReaderV1` consumes the token stream produced by the tokenizer. Top-level structure: ```otn @version: 1; @defType: int = 0, float = 1, ...; // ← optional @defName: value = 0, count = 1, ...; // ← optional @object: { Players[2] { 0/id, 0/level, 1/0 }; 0, 30, 0; 1, 30, 1; Enemies[2] { 0/id, 0/1, 1/0 }; 0, 20, 0; 1, 20, 1; Maps[3] { 0/id, 0/1, 1/0 }; 0, 20, 0; 1, 20, 1; 1, 20, 2; Levels[2] { 0/id, 0/1, 1/0 }; 0, 20, 0; 1, 20, 1; }; ``` ParseTopLevel processes directives in order: 1. `@version` — reads the format version and stores it in `ReaderData`. 2. `@defType` (optional) — builds a numeric-ID-to-type-string map. 3. `@defName` (optional) — builds a numeric-ID-to-name-string map. 4. `@object` block — calls `ParseObject` for each named object inside. ParseObject reads the object name, row count from `[N]`, then calls `ParseHeaderBlock` (column types and names) and `ParseDataRows`. ParseDataRows reads exactly `rowCount` rows. Each row is a semicolon-terminated list of values. Values are converted to `OTNValue` by `TokenToOTNValue`, which dispatches based on the column's `OTNTypeDesc`. After all objects are parsed, `ResolveOTNObjectRefs` walks every object and replaces `OBJECT REF` values (integer indices) with `OTNObjectPtr` values pointing to the actual `OTNObject` at that index. This is what makes reading back nested object references transparent to the user — by the time `ReadFile` returns, all references are fully resolved and you get real `OTNObject` instances from `GetValue<OTNObject ` or `TryGetValue<OTNObject `. If a referenced object name or index does not exist, an error is added and the reader enters an invalid state. `OTNStreamReader` uses a separate incremental tokenizer (`StreamTokenizer`) that operates on a single-character lookahead from a `string view` over the entire file content (which is read in full on `Open`). Rather than building a token vector upfront, it produces tokens on demand during `NextObject` and `ReadRow` calls. `NextObject` advances past any remaining rows of the previous object, then calls `ParseObjectHeader` to read the name, row count, and column schema. `ReadRow` calls `ReadValue` for each column in turn. Object references remain as `OTNObjectRef` values — they are never resolved, so `OBJECT REF` columns must be interpreted by the caller using their integer indices."},{"nodeId":"node_mu55p95x1mur4st1tuzfby","tabId":"tab_mu55p95x1a6rhrm1czr561","title":"File Format","headings":["File Format","Overall structure","Header directives","Object block syntax","Type tokens","Value syntax","DefType / DefName substitution","Optimized (minified) output","File extension"],"content":"A `.otn` file is plain UTF-8 text. It consists of a small header section followed by one or more object blocks. ``` @version: 1; @defType: { 0 = int, 1 = float, 2 = String }; @defName: { 0 = id, 1 = name, 2 = value }; @object: { Items[3] { int/String/float, id,name,value = 1, \"Sword\", 42.5; int/String/float, id,name,value = 2, \"Shield\", 17.3; int/String/float, id,name,value = 3, \"Bow\", 8.1; } Player[1] { int/String/int[], id,name,tags = 1, \"Hero\", [10, 20, 30]; } } ``` All directives begin with `@` and are terminated with `;`. | Directive | Required | Description | |---|---|---| | `@version: N;` | yes | Format version number. Currently always `1`. | | `@defType: { id = typeName, ... };` | no | Maps numeric IDs to type name strings. Emitted by `OTNWriter` when `UseDefType(true)` is set. | | `@defName: { id = colName, ... };` | no | Maps numeric IDs to column name strings. Emitted when `UseDefName(true)` is set. | | `@object: { ... };` | yes | Contains all object blocks. | Each object inside `@object: { }` follows this structure: ``` ObjectName[rowCount] { type/type/type, name, name, name = value, value, value; ... } ``` - `ObjectName` — the identifier used to retrieve the object via `TryGetObject`. - `[rowCount]` — the number of data rows that follow. - The column header line lists types (slash-separated) and names (comma-separated), separated by an `=`. - Each data row is a comma-separated list of values terminated by `;`. | Type string | Maps to | |---|---| | `int` | `INT` (32-bit signed) | | `int64` | `INT64` | | `uint64` | `UINT64` | | `float` | `FLOAT` | | `double` | `DOUBLE` | | `bool` | `BOOL` (`true` / `false`) | | `String` | `STRING` (quoted with `\"`) | | `ObjectName` | `OBJECT` (reference to another object, written as integer index) | | `any` | `ANY` (type stored inline per value) | | `T[]` | `LIST` of `T` (one bracket pair per nesting level) | | Type | Example in file | |---|---| | Integer | `42` | | Negative integer | `-7` | | Float/double | `3.14` or `-0.5` | | Bool | `true` or `false` | | String | `\"hello world\"` | | List | `[1, 2, 3]` | | Nested list | `[[1, 2], [3, 4]]` | | Object reference | `<ObjectName, 0 ` (name + row index, internal form) or just an integer when written via `OTNStreamWriter` | When `@defType` or `@defName` is present, any numeric ID found in a type position or name position is looked up in the corresponding map and replaced with the actual string before parsing continues. This means the on-disk representation may look like: ``` @defType: { 0 = int, 1 = String, 2 = float }; Items[2] { 0/1/2, id, name, value = 1, \"Sword\", 42.5; 0/1/2, id, name, value = 2, \"Shield\", 17.3; } ``` With `UseOptimizations(true)`, all whitespace and newlines are removed: ``` @version:1;@object:{Items[2]{int/String/float,id,name,value=1,\"Sword\",42.5;2,\"Shield\",17.3;}} ``` Readers handle both forms identically since the tokenizer is whitespace-insensitive. The standard extension is `.otn`. It is appended automatically by `OTNWriter`, `OTNReader`, `OTNStreamWriter`, and `OTNStreamReader` if the path does not already end in `.otn`."}];
  var currentTabId = null;
  var currentNodeId = null;
  var isTransitioning = false;
  var dynamicContent = document.getElementById('dynamicContent');

  // -- Search state --------------------------------------------------------
  var searchInput   = document.getElementById('searchInput');
  var searchResults = document.getElementById('searchResults');
  var searchResultsList = document.getElementById('searchResultsList');
  var searchToggle  = document.getElementById('searchIncludeTabs');
  var searchDebounceTimer = null;

  // -- Helper: find node's tab --------------------------------------------
  function getNodeTabId(nodeId) {
    var node = allNodes.find(n => { return n.id === nodeId; });
    return node ? node.tabId : null;
  }

  // -- Header scroll-hide behaviour --------------------------------------
  var docHeader = document.getElementById('docHeader');
  if (docHeader && docHeader.classList.contains('header-scroll-hide')) {
    var lastScrollY = 0;
    var scrollTarget = document.querySelector('.dynamic-content') || window;
    var onScroll = () => {
      var y = (scrollTarget === window) ? window.scrollY : scrollTarget.scrollTop;
      if (y > lastScrollY && y > 60) {
        docHeader.classList.add('hidden-scrolled');
      } else {
        docHeader.classList.remove('hidden-scrolled');
      }
      lastScrollY = y;
    };
    scrollTarget.addEventListener('scroll', onScroll, { passive: true });
  }

  // -- TOC builder --------------------------------------------------------
  var tocLinks = document.getElementById('tocLinks');
  function buildToc() {
    if (!tocLinks) 
      return;
    var headings = dynamicContent.querySelectorAll('h1,h2,h3,h4');
    tocLinks.innerHTML = '';
    headings.forEach(h => {
      if (!h.id) h.id = 'h-' + Math.random().toString(36).slice(2, 7);
      var a = document.createElement('a');
      a.className = 'toc-link';
      a.href = '#' + h.id;
      a.textContent = h.textContent;
      a.dataset.level = h.tagName[1];
      a.addEventListener('click', e => {
        e.preventDefault();
        h.scrollIntoView({ behavior: 'smooth' });
      });
      tocLinks.appendChild(a);
    });
  }

  // -- Sidebar toggle ------------------------------------------------------
  var docRoot = document.getElementById('docRoot');
  var navBackdrop = document.getElementById('navBackdrop');
  var toggleButtons = [
    document.getElementById('navToggleBtn')
  ].filter(Boolean);
  var closeBtn = document.getElementById('navCloseBtn');

  function setSidebarCollapsed(collapsed, persist) {
    docRoot.classList.toggle('sidebar-collapsed', collapsed);
    toggleButtons.forEach(btn => {
      btn.setAttribute('aria-expanded', String(!collapsed));
    });
    if (persist) {
      try { sessionStorage.setItem('_docSidebarCollapsed', collapsed ? '1' : '0'); } catch (e) {}
    }
  }

  function toggleSidebar() {
    setSidebarCollapsed(!docRoot.classList.contains('sidebar-collapsed'), true);
  }

  toggleButtons.forEach(btn => {
    btn.addEventListener('click', toggleSidebar);
  });

  if (closeBtn) {
    closeBtn.addEventListener('click', () => {
      setSidebarCollapsed(true, true);
    });
  }

  navBackdrop.addEventListener('click', () => {
    setSidebarCollapsed(true, true);
  });

  // Default: open on desktop, closed on mobile — unless the user already
  // picked a state this session. Never auto-collapse if there is no way
  // to reopen the sidebar again (no toggle button rendered, e.g.
  // header-show:'sidebar'/'never').
  (function initSidebarState() {
    var stored = null;
    try { stored = sessionStorage.getItem('_docSidebarCollapsed'); } catch (e) {}

    var canReopen = toggleButtons.length > 0;
    var collapsed = stored !== null
      ? stored === '1'
      : (canReopen && window.innerWidth <= 768);

    setSidebarCollapsed(collapsed, false);
  })();

  // -- Load node content from template with crossfade ---------------------
  function loadNode(nodeId, updateUrl, onDone) {
    if (isTransitioning) {
      onDone?.();
      return;
    }

    if (nodeId === currentNodeId) { 
      onDone?.(); 
      return; 
    }

    var template = document.getElementById('tmpl-' + nodeId);
    if (!template) {
      console.warn('Template not found for node', nodeId);
      onDone?.(); 
      return;
    }

    var newTabId = getNodeTabId(nodeId);
    if (!newTabId) { 
      onDone?.(); 
      return;
    }

    var activeTabSection = document.querySelector('.sidebar-section.active');
    if (activeTabSection && activeTabSection.dataset.tab !== newTabId) {
      switchTab(newTabId, () => {
        loadNode(nodeId, updateUrl, onDone);
      });
      return;
    }

    isTransitioning = true;
    dynamicContent.classList.add('fade-out');

    setTimeout(() => {
      var clone = document.importNode(template.content, true);
      dynamicContent.innerHTML = '';
      dynamicContent.appendChild(clone);
      buildToc();

      document.querySelectorAll('.nav-row').forEach(row => {
        row.classList.remove('active');
      });
      document.querySelectorAll('.nav-row[data-node-id="' + nodeId + '"]').forEach(row => {
        row.classList.add('active');
      });

      currentNodeId = nodeId;
      currentTabId = newTabId;

      if (updateUrl !== false && window.location.hash !== '#' + nodeId) {
        history.pushState(null, '', '#' + nodeId);
      }

      dynamicContent.classList.remove('fade-out');
      setTimeout(() => {
        isTransitioning = false;
        onDone?.(); 
      }, 50);
    }, 150);
  }

  // -- Tab switching -----------
  function switchTab(tabId, callback) {
    document.querySelectorAll('.sidebar-section').forEach(s => {
      s.classList.toggle('active', s.dataset.tab === tabId);
    });
    document.querySelectorAll('.tab-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === tabId);
    });

    try { 
      sessionStorage.setItem('_docActiveTab', tabId); 
    } catch (e) {}

    var firstNodeInTab = allNodes.find(n => n.tabId === tabId);
    if (firstNodeInTab) {
      loadNode(firstNodeInTab.id, true, callback);
    } else {
      dynamicContent.innerHTML = '<div class="main"><p>No content in this tab.</p></div>';
      currentNodeId = null;
      currentTabId = tabId;
      callback?.();
    }
  }

  // -- Nav group toggle --------------------------------------
  function toggleNavGroup(groupId) {
    var group = document.getElementById(groupId);
    if (!group)
      return;
    group.classList.toggle('collapsed');
  }

  // -- Search helpers ------------------------------------------------------

  /** Escapes a string for safe insertion as HTML text content. */
  function _escHtml(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /**
   * Returns the HTML-escaped string with all occurrences of query
   * wrapped in <mark> tags for highlighting.
   */
  function _highlight(text, query) {
    if (!query || !text)
      return _escHtml(text);
    var escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    var re = new RegExp('(' + escaped + ')', 'gi');
    return _escHtml(text).replace(re, '<mark>$1</mark>');
  }

  /**
   * Returns a short excerpt of text centred around the first occurrence
   * of query, padded by radius characters on each side.
   */
  function _getSnippet(text, query, radius) {
    radius = radius || 80;
    if (!text)
      return '';
    if (!query)
      return text.slice(0, radius * 2);
    var idx = text.toLowerCase().indexOf(query.toLowerCase());
    if (idx < 0) 
      return text.slice(0, radius * 2);
    var start = Math.max(0, idx - radius);
    var end   = Math.min(text.length, idx + query.length + radius);
    return (start > 0 ? '\u2026' : '') + text.slice(start, end) + (end < text.length ? '\u2026' : '');
  }

  /**
   * Scores a single index entry against the query string.
   * Returns { score, matchedHeading }.
   *
   * Score weights:
   *   title match   +100
   *   heading match  +50  (first matched heading captured)
   *   content match  +10
   */
  function _scoreEntry(entry, query) {
    var ql = query.toLowerCase();
    var score = 0;
    var matchedHeading = null;

    if (entry.title.toLowerCase().indexOf(ql) >= 0)
      score += 100;

    for (var i = 0; i < entry.headings.length; i++) {
      if (entry.headings[i].toLowerCase().indexOf(ql) >= 0) {
        score += 50;
        if (!matchedHeading) matchedHeading = entry.headings[i];
      }
    }

    if (entry.content.toLowerCase().indexOf(ql) >= 0)
      score += 10;

    return { score: score, matchedHeading: matchedHeading };
  }

  /**
   * Executes a search over the index and renders results into the
   * floating results panel. Hides the panel when query is empty.
   */
  function _runSearch(query) {
    if (!searchResultsList)
      return;

    query = (query || '').trim();

    if (query.length < 2) {
      searchResults.classList.remove('visible');
      searchResultsList.innerHTML = '';
      return;
    }

    // Scope: current tab only, or all tabs when toggle is checked.
    var crossTab = searchToggle ? searchToggle.checked : false;
    var pool = crossTab
      ? searchIndex
      : searchIndex.filter(e => { return e.tabId === currentTabId; });

    var scored = [];
    for (var i = 0; i < pool.length; i++) {
      var res = _scoreEntry(pool[i], query);
      if (res.score > 0)
        scored.push({ entry: pool[i], score: res.score, matchedHeading: res.matchedHeading });
    }

    scored.sort((a, b) => { return b.score - a.score; });
    var top = scored.slice(0, 20);

    if (top.length === 0) {
      searchResultsList.innerHTML = '<div class="search-no-results">No results found</div>';
      searchResults.classList.add('visible');
      return;
    }

    searchResultsList.innerHTML = top.map(item => {
      var e = item.entry;
      var snippet = _getSnippet(e.content, query, 80);
      var headingHtml = item.matchedHeading
        ? '<div class="search-result-heading">' + _highlight(item.matchedHeading, query) + '</div>'
        : '';
      return '<div class="search-result" data-node-id="' + _escHtml(e.nodeId) + '">'
        + '<div class="search-result-title">'   + _highlight(e.title, query) + '</div>'
        + headingHtml
        + '<div class="search-result-preview">' + _highlight(snippet, query) + '</div>'
        + '</div>';
    }).join('');

    searchResults.classList.add('visible');
  }

  // -- Event handling -----------------------------------------------------

  // Sidebar-Clicks (Delegation)
  document.body.addEventListener('click', e => {
    var link = e.target.closest('.nav-row[data-node-id]');
    if (link && link.getAttribute('data-node-id')) {
      e.preventDefault();
      var nodeId = link.getAttribute('data-node-id');
      loadNode(nodeId, true);
    }
  });

  // Chevron-Clicks
  document.body.addEventListener('click', e => {
    var btn = e.target.closest('.nav-chevron-btn');
    if (btn && btn.dataset.toggleGroup) {
      e.preventDefault();
      toggleNavGroup(btn.dataset.toggleGroup);
      return;
    }

    var link = e.target.closest('.nav-row[data-node-id]');
    if (link && link.getAttribute('data-node-id')) {
      e.preventDefault();
      loadNode(link.getAttribute('data-node-id'), true);
    }
  });

  // Tab-Clicks
  var tabNav = document.getElementById('tabNav');
  if (tabNav) {
    tabNav.addEventListener('click', e => {
      var btn = e.target.closest('.tab-btn');
      if (btn && btn.dataset.tab) {
        switchTab(btn.dataset.tab);
      }
    });
  }

  var tabNavContainer = document.getElementById('tabNavContainer');
  if (tabNavContainer) {
    // Convert vertical scroll to horizontal scroll
    tabNavContainer.addEventListener('wheel', (e) => {
      if (e.deltaY === 0)
        return;
    
      e.preventDefault(); // prevent vertical scroll
      tabNavContainer.scrollBy({
        left: e.deltaY,
        behavior: 'smooth'
      });
    }, { passive: false });
  }

  window.addEventListener('hashchange', () => {
    var hash = window.location.hash.slice(1);
    if (hash && allNodes.some(n => { return n.id === hash; })) {
      loadNode(hash, false);
    } else if (firstNode) {
      loadNode(firstNode.id, true);
    }
  });

  // -- Search event handling ----------------------------------------------

  if (searchInput) {
    // Debounced input -> run search after 120 ms of silence.
    searchInput.addEventListener('input', () => {
      clearTimeout(searchDebounceTimer);
      var val = searchInput.value;
      searchDebounceTimer = setTimeout(() => {
        _runSearch(val);
      }, 120);
    });

    // Re-show results on focus if there is a pending query.
    searchInput.addEventListener('focus', () => {
      if (searchInput.value.trim().length >= 2 && searchResultsList)
        searchResults.classList.add('visible');
    });
  }

  // Result clicks: navigate to node and close panel.
  if (searchResultsList) {
    searchResultsList.addEventListener('click', e => {
      var item = e.target.closest('.search-result');
      if (!item)
        return;
      
      var nodeId = item.getAttribute('data-node-id');
      searchResults.classList.remove('visible');
      
      if (searchInput)
        searchInput.value = '';
      if (nodeId)
        loadNode(nodeId, true);
    });
  }

  // Close results when clicking anywhere outside the search widget.
  document.addEventListener('click', e => {
    if (!searchResultsList)
      return;
    var docSearch = document.getElementById('docSearch');
    if (docSearch && !docSearch.contains(e.target))
      searchResults.classList.remove('visible');
  });

  // -- Externe Navigation (postMessage) ------------------------------------
  var NAV_SOURCE = 'doc-nav';
  var navScrollPending = false;

  function getLocationPayload() {
    var scrollTop = dynamicContent.scrollTop;
    var scrollHeight = dynamicContent.scrollHeight;
    var clientHeight = dynamicContent.clientHeight;
    var maxScroll = scrollHeight - clientHeight;
    return {
      tabId: currentTabId,
      nodeId: currentNodeId,
      scrollTop: scrollTop,
      scrollHeight: scrollHeight,
      clientHeight: clientHeight,
      ratio: maxScroll > 0 ? scrollTop / maxScroll : 0
    };
  }

  function postLocation() {
    try {
      window.parent.postMessage({ source: NAV_SOURCE, type: 'location', payload: getLocationPayload() }, '*');
    } catch (e) {
    }
  }

  dynamicContent.addEventListener('scroll', function () {
    if (navScrollPending) 
      return;
    navScrollPending = true;
    requestAnimationFrame(function () {
      navScrollPending = false;
      postLocation();
    });
  }, { passive: true });

  function applyExternalScroll(scrollPosition) {
    if (scrollPosition == null) 
      return;
    var top;
    if (typeof scrollPosition === 'object' && scrollPosition.ratio != null) {
      top = scrollPosition.ratio * (dynamicContent.scrollHeight - dynamicContent.clientHeight);
    } else if (typeof scrollPosition === 'number') {
      top = scrollPosition;
    } else {
      return;
    }
    dynamicContent.scrollTop = top;
  }

  function handleExternalNavigate(msg) {
    var targetNodeId = msg.nodeId || currentNodeId;
    if (targetNodeId && targetNodeId !== currentNodeId) {
      loadNode(targetNodeId, true, function () {
        applyExternalScroll(msg.scrollPosition);
        postLocation();
      });
    } else {
      applyExternalScroll(msg.scrollPosition);
      postLocation();
    }
  }

  window.addEventListener('message', function (e) {
    var msg = e.data;
    if (!msg || msg.source !== NAV_SOURCE)
      return;
    if (msg.type === 'navigate') {
      handleExternalNavigate(msg);
    } else if (msg.type === 'location:get') {
      postLocation();
    }
  });

  // Direkter Zugriff, falls contentWindow verfügbar ist
  window.docNav = {
    navigate: function (opts) { handleExternalNavigate(opts || {}); },
    getLocation: getLocationPayload
  };

  // -- Initialization ---------------------------------------
  var savedTab = null;
  try { 
    savedTab = sessionStorage.getItem('_docActiveTab'); 
  } catch (e) {
  }
  var initialTab = (savedTab && allNodes.some(n => { 
      return n.tabId === savedTab; 
    })
  ) ? savedTab : (firstNode ? firstNode.tabId : null);
  
  var hashNodeId = window.location.hash.slice(1);
  var initialNodeId = null;
  if (hashNodeId && allNodes.some(n => { return n.id === hashNodeId; })) {
    initialNodeId = hashNodeId;
  } else if (firstNode) {
    initialNodeId = firstNode.id;
  }

  if (initialTab) {
    document.querySelectorAll('.sidebar-section').forEach(s => {
      s.classList.toggle('active', s.dataset.tab === initialTab);
    });
    document.querySelectorAll('.tab-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === initialTab);
    });
  }

  if (initialNodeId) {
    loadNode(initialNodeId, false, () => {
      postLocation();
      window.parent.postMessage({ source: NAV_SOURCE, type: 'ready' }, '*');
    });
  } else {
    postLocation();
    window.parent.postMessage({ source: NAV_SOURCE, type: 'ready' }, '*');
  }
})();</script>
  </body>
  </html>
