    <section id="node_w3f6j0p8u2lcy5mx9tbe" class="export-section">
    
    <div class="export-section__body"><h1>Types</h1>
<p>Every column has a type. It is deduced from the first row or set with <code>SetTypes()</code> (<code>OTNObject</code>) and <code>BeginObject()</code> (<code>OTNStreamWriter</code>).</p>
<h2>Type strings</h2>
<div class="table-wrapper"><table data-hover="row"><thead><tr><th width="170">Type string</th><th>C++ type</th><th>Note</th></tr></thead><tbody><tr><td><code>int</code></td><td><code>int</code></td><td></td></tr><tr><td><code>int64</code></td><td><code>int64_t</code></td><td><code>uint32_t</code> / <code>unsigned int</code> values are stored as <code>int64</code></td></tr><tr><td><code>uint64</code></td><td><code>uint64_t</code></td><td></td></tr><tr><td><code>float</code></td><td><code>float</code></td><td></td></tr><tr><td><code>double</code></td><td><code>double</code></td><td></td></tr><tr><td><code>bool</code></td><td><code>bool</code></td><td></td></tr><tr><td><code>String</code></td><td><code>std::string</code></td><td><code>const char*</code> and string literals are stored as <code>String</code></td></tr><tr><td><code>any</code></td><td>number, <code>std::string</code>, <code>bool</code>, custom type, <code>OTNObject</code></td><td>The type is not fixed, see below</td></tr><tr><td><code>Name</code></td><td>custom type or <code>OTNObject</code></td><td>Reference to the object <code>Name</code>, see <a class="doc-ref" href="#node_mu55p95xk2i6alcuiyw" data-ref-node="node_mu55p95xk2i6alcuiyw" title="Custom Types">Custom Types</a></td></tr><tr><td><code>T[]</code></td><td><code>std::vector&lt;T&gt;</code>, <code>std::array&lt;T, N&gt;</code></td><td>One <code>[]</code> per nesting level: <code>int[][]</code></td></tr></tbody></table></div>
<p><code>Name</code> is any other name, for example <code>&quot;Vector2&quot;</code> or <code>&quot;Vector2[]&quot;</code>. In the file it is written as <code>Ref&lt;Vector2&gt;</code>.</p>
<h2>Deduced types</h2>
<p>Without <code>SetTypes()</code> the type of every column is taken from the value in the first row:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">obj</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">SetNames</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">a"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">b"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">c"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">d"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">)</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">   </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">AddDataRow</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__number">1</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">text"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">vector</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">float</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&gt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__number">1.0f</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">},</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">Vector2</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">}</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// int, String, float[], Vector2</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p>An empty list has no element type. The writers then take the type from the next row with a non empty list. If the list is empty in all rows, set the type with <code>SetTypes()</code> (or <code>AddTypes()</code> in a custom type).</p>
<h2>Reading values</h2>
<p><code>GetValue&lt;T&gt;</code> and <code>TryGetValue&lt;T&gt;</code> only succeed if <code>T</code> is the stored type. <code>int</code> cannot be read as <code>int64_t</code> or <code>float</code>, <code>float</code> not as <code>double</code>.</p>
<p><code>uint32_t</code> and <code>unsigned int</code> are read back from the stored <code>int64</code> if the value fits.</p>
<h2>any</h2>
<p>An <code>any</code> column can hold numbers, strings, <code>bool</code>, custom types, <code>OTNObject</code>s and lists of these, also mixed:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">obj</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">SetNames</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">value"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">).</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">SetTypes</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">any"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">)</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">   </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">AddDataRow</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__number">3</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">)</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">   </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">AddDataRow</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__number">0.25</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">)</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">   </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">AddDataRow</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">string</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">text"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">))</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">   </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">AddDataRow</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">Vector2</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__number">1</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__number">2</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">}</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">)</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">   </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">AddDataRow</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">vector</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">Vector2</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&gt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__number">3</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__number">4</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">},</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__number">5</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__number">6</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">}</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">});</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p>Values are read with the type they should have:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">int</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">i</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">       </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">=</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">obj</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">GetValue</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">int</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&gt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__number">0</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">value"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__number">0</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">auto</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">pos</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">=</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">obj</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">TryGetValue</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">Vector2</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&gt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__number">3</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">value"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">auto</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">path</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">   </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">=</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">obj</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">.</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">TryGetValue</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">vector</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">Vector2</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&gt;&gt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__number">4</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__string">value"</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p>Custom types and <code>OTNObject</code>s are written as rows of their own object, the <code>any</code> value references them with <code>Name#index</code> (see <a class="doc-ref" href="#node_mu55p95x1mur4st1tuzfby" data-ref-node="node_mu55p95x1mur4st1tuzfby" title="File Format">File Format</a>). An <code>OTNObject</code> with several rows becomes a list of references and is read as <code>std::vector&lt;OTNObject&gt;</code>.</p>
<p>In the file a number has no type. When reading, it gets the smallest type that fits: <code>int</code>, then <code>int64_t</code>, then <code>uint64_t</code>, and <code>double</code> for numbers with a decimal point or exponent.</p>
<p>So that the type used for writing does not matter, numbers in <code>any</code> columns can be read as <strong>every number type</strong> if the value fits:</p>
<div class="table-wrapper"><table><thead><tr><th>Stored</th><th>Read as</th><th>Result</th></tr></thead><tbody><tr><td><code>3</code></td><td><code>int</code>, <code>int64_t</code>, <code>float</code>, <code>double</code>, …</td><td><code>3</code></td></tr><tr><td><code>0.1f</code></td><td><code>float</code></td><td><code>0.1f</code></td></tr><tr><td><code>3.5</code></td><td><code>int</code></td><td>fails, decimals would be lost</td></tr><tr><td><code>5000000000</code></td><td><code>int</code></td><td>fails, too large</td></tr><tr><td><code>-1</code></td><td><code>uint64_t</code></td><td>fails, negative</td></tr></tbody></table></div>
<p>Floating point numbers are written with the shortest text that is read back exactly (<code>0.8</code>, not <code>0.80000000000000004</code>), so a <code>float</code> or <code>double</code> is read back exactly with its own type.</p>
<h2>Names</h2>
<p>Object names, column names and custom type names may contain:</p>
<ul><li>letters <code>a-z</code>, <code>A-Z</code>, digits <code>0-9</code> and <code>_</code>,</li><li>UTF-8 characters (all bytes from <code>0x80</code>), for example <code>Größe</code>.</li></ul>
<p>A name must not be empty and must not start with a digit. Spaces and syntax characters (<code>@ : = , / { } [ ] &lt; &gt; ; &quot;</code>) are not allowed. An invalid name makes the object invalid.</p>
<h2>Text encoding</h2>
<p>Files are UTF-8. A UTF-8 byte order mark at the start of a file is skipped when reading, the writers never write one. UTF-16 and UTF-32 files are rejected with an error.</p>
<p><code>std::string</code> values are written byte by byte. The library does not check or convert their encoding, so they are read back exactly as they were written. <code>std::wstring</code>, <code>std::u16string</code> and similar types are not supported directly. Store them as UTF-8 <code>std::string</code> or with your own <code>ToOTNDataType</code> specialization.</p></div>
  </section>
  </div>
</template>
<template id="tmpl-node_a2e7u4c9h6mpw0sj3kfr">
  <div class="main" data-node-id="node_a2e7u4c9h6mpw0sj3kfr" data-tab-id="tab_mu55p95x1a6rhrm1czr561">
    <section id="node_a2e7u4c9h6mpw0sj3kfr" class="export-section">
    
    <div class="export-section__body"><h1>Architecture</h1>
<p>An overview of how the library is built. The following pages describe the parts in detail.</p>
<h2>Layers</h2>
<div class="code-block-wrapper"><pre><code> OTNWriter   OTNStreamWriter   OTNReader   OTNStreamReader     classes: flow, objects, references
      \            |               |            /
       \           |               |           /
        Detail::FileHeaderInfo / ObjectHeaderInfo / OTNRow       data passed between the layers
                    |                          |
          Detail::V1 write functions   Detail::V1 read functions   syntax: text &lt;-&gt; info structs
                                               |
                                       Tokenizer / CharSource      tokens from memory or file</code></pre><div class="code-language-tag code-language-tag--unrecognized">text</div></div>
<ul><li>The <strong>classes</strong> decide what is written or read and in which order. They resolve and create references and manage files.</li><li>The <strong>syntax layer</strong> is the only code that knows the file syntax, see <a class="doc-ref" href="#node_g8d1z5k3n7vxe2qb6ycu" data-ref-node="node_g8d1z5k3n7vxe2qb6ycu" title="Syntax Layer">Syntax Layer</a>.</li><li><strong>OTNObject</strong> and <strong>OTNValue</strong> are the data model that all classes share, see <a class="doc-ref" href="#node_mu55p95x60r14y7tsvw1" data-ref-node="node_mu55p95x60r14y7tsvw1" title="OTNObject">OTNObject</a> and <a class="doc-ref" href="#node_mu55p95x16kjtnh1dqih2o" data-ref-node="node_mu55p95x16kjtnh1dqih2o" title="Type System">Type System</a>.</li></ul>
<h2>Files</h2>
<div class="table-wrapper"><table><thead><tr><th>File</th><th>Content</th></tr></thead><tbody><tr><td><code>OTNFile/include/OTNFile/OTNFile.h</code></td><td>Public API, data model, templates (<code>OTNDataType</code>, <code>TryDeserializeValue</code>), info structs</td></tr><tr><td><code>OTNFile/src/OTNFile/OTNFile.cpp</code></td><td>Everything else</td></tr><tr><td><code>OTNFileTest/</code></td><td>Test program, the tests are in <code>include/Tests/*.h</code></td></tr></tbody></table></div>
<p><code>OTNFile.cpp</code> is split into regions:</p>
<div class="table-wrapper"><table><thead><tr><th>Region</th><th>Content</th></tr></thead><tbody><tr><td>(top)</td><td>Helpers: path validation, number parsing, type deduction</td></tr><tr><td><code>Syntax</code></td><td><code>DefTable</code>, <code>ParseTypeString</code>, <code>CharSource</code>, <code>Tokenizer</code>, <code>ReadVersion</code>, <code>Detail::V1</code>, <code>Current</code>, <code>GetReadSyntax</code></td></tr><tr><td><code>OTNObject</code></td><td><code>OTNObject</code> and <code>OTNObjectBuilder</code></td></tr><tr><td><code>OTNWriter</code></td><td>see <a class="doc-ref" href="#node_mu55p95x18c549nhu7cu9" data-ref-node="node_mu55p95x18c549nhu7cu9" title="Writer Internals">Writer Internals</a></td></tr><tr><td><code>OTNReader</code></td><td>see <a class="doc-ref" href="#node_mu55p95x1r773m4107y4xr" data-ref-node="node_mu55p95x1r773m4107y4xr" title="Reader Internals">Reader Internals</a></td></tr><tr><td><code>OTNStreamWriter</code></td><td>see <a class="doc-ref" href="#node_mu55p95x18c549nhu7cu9" data-ref-node="node_mu55p95x18c549nhu7cu9" title="Writer Internals">Writer Internals</a></td></tr><tr><td><code>OTNStreamReader</code></td><td>see <a class="doc-ref" href="#node_mu55p95x1r773m4107y4xr" data-ref-node="node_mu55p95x1r773m4107y4xr" title="Reader Internals">Reader Internals</a></td></tr></tbody></table></div>
<h2>Namespaces</h2>
<ul><li><code>OTN</code>: everything a user needs.</li><li><code>OTN::Syntax</code> and <code>OTN::Keyword</code>: the characters and keywords of the format.</li><li><code>OTN::Detail</code>: implementation details. Users should not need anything from it.</li></ul>
<h2>Building and testing</h2>
<p>The project uses premake (<code>premake5.lua</code>, <code>build.bat</code>). The test program <code>OTNFileTest</code> gets an output folder as argument, runs all tests and prints the number of passed and failed tests:</p>
<div class="code-block-wrapper"><pre><code>OTNFileTest &lt;output_directory&gt;</code></pre><div class="code-language-tag code-language-tag--unrecognized">text</div></div>
<p>The tests are header files per topic in <code>OTNFileTest/include/Tests/</code> (<code>TestObject.h</code>, <code>TestWriterReader.h</code>, <code>TestStream.h</code>, <code>TestBugfixes.h</code>). The files they write are put into the output folder.</p></div>
  </section>
  </div>
</template>
<template id="tmpl-node_mu55p95x16kjtnh1dqih2o">
  <div class="main" data-node-id="node_mu55p95x16kjtnh1dqih2o" data-tab-id="tab_mu55p95x1a6rhrm1czr561">
    <section id="node_mu55p95x16kjtnh1dqih2o" class="export-section">
    
    <div class="export-section__body"><h1>Type System</h1>
<p>How values and column types are represented in memory. The type strings used in the API are listed in <a class="doc-ref" href="#node_w3f6j0p8u2lcy5mx9tbe" data-ref-node="node_w3f6j0p8u2lcy5mx9tbe" title="Types">Types</a>.</p>
<h2>OTNBaseType</h2>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">enum class</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">OTNBaseType</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">UNKNOWN</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">=</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__number">0</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">INT</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">UINT64</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">INT64</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">FLOAT</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">DOUBLE</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">BOOL</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">STRING</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">OBJECT</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">     </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// nested OTNObject</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">OBJECT_REF</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// reference not resolved yet (name + row index)</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">LIST</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">       </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// list of values</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">ANY</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">         </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// only used as column type</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">}</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p><code>OBJECT_REF</code> values are created while reading. <code>OTNReader</code> replaces all of them by <code>OBJECT</code> values. <code>OTNStreamReader</code> does the same unless <code>SetResolveObjectRefs(false)</code> is set.</p>
<h2>OTNTypeDesc</h2>
<p>Describes the type of a column:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">struct</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">OTNTypeDesc</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">OTNBaseType</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">baseType</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">=</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">OTNBaseType</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">UNKNOWN</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">uint32_t</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">listDepth</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">=</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__number">0</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// 0 = T, 1 = T[], 2 = T[][]</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">string</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">refObjectName</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// object name if baseType == OBJECT</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">}</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<div class="table-wrapper"><table><thead><tr><th>Type string</th><th>baseType</th><th>listDepth</th><th>refObjectName</th></tr></thead><tbody><tr><td><code>int</code></td><td><code>INT</code></td><td>0</td><td></td></tr><tr><td><code>float[][]</code></td><td><code>FLOAT</code></td><td>2</td><td></td></tr><tr><td><code>Vector2</code></td><td><code>OBJECT</code></td><td>0</td><td><code>Vector2</code></td></tr><tr><td><code>Vector2[]</code></td><td><code>OBJECT</code></td><td>1</td><td><code>Vector2</code></td></tr></tbody></table></div>
<p><code>UNKNOWN</code> with <code>listDepth &gt; 0</code> is the deduced type of an empty list. Such a type cannot be written.</p>
<h2>OTNValue</h2>
<p>A value is a variant plus its type:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">using </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">OTNValueVariant</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword"> =</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">variant</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">int</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">int64_t</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">uint64_t</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">float</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">double</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">bool</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">string</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">Detail</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">OTNObjectPtr</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">  </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// std::shared_ptr&lt;OTNObject&gt;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">Detail</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">OTNArrayPtr</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">   </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// std::shared_ptr&lt;Detail::OTNArray&gt;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">Detail</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">OTNObjectRef</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">   </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// { std::string refObjectName; size_t index; }</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&gt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">&nbsp;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">struct</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">OTNValue</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">OTNValueVariant</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">value</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">OTNBaseType</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">type</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// set from the variant</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">}</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">&nbsp;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">using </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">OTNRow</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword"> =</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">vector</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">OTNValue</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&gt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p><code>Detail::OTNArray</code> holds a <code>std::vector&lt;OTNValue&gt;</code>. Nested lists are arrays in arrays.</p>
<h2>Public and internal types</h2>
<p>Everything a user needs is in the namespace <code>OTN</code>: the classes, <code>OTNValue</code>, <code>OTNValueVariant</code>, <code>OTNRow</code>, <code>OTNTypeDesc</code>, <code>OTNBaseType</code>, <code>OTNColumnDef</code> / <code>col()</code>, the constants (<code>VERSION</code>, <code>FILE_EXTENSION</code>, <code>TEMP_FILE_EXTENSION</code>) and <code>Syntax</code>.</p>
<p>Implementation details are in <code>OTN::Detail</code> and should not be used directly:</p>
<div class="table-wrapper"><table><thead><tr><th>In OTNFile.h</th><th>Purpose</th></tr></thead><tbody><tr><td><code>OTNArray</code>, <code>OTNObjectPtr</code>, <code>OTNArrayPtr</code>, <code>OTNObjectRef</code></td><td>Parts of <code>OTNValueVariant</code></td></tr><tr><td><code>OTNDataType&lt;T&gt;</code></td><td>Converts C++ values into <code>OTNValue</code>, see <a class="doc-ref" href="#node_mu55p95xcc3t1kyr59wt" data-ref-node="node_mu55p95xcc3t1kyr59wt" title="Type Conversion">Type Conversion</a></td></tr><tr><td><code>OTNTypeOf&lt;T&gt;</code>, <code>GetType</code>, <code>GetTypeFromVariant</code></td><td>Base type of a C++ type / variant</td></tr><tr><td><code>is_otn_base_type_v</code>, <code>is_otn_list_v</code>, <code>otn_is_std_vector</code>, <code>is_otn_number_v</code></td><td>Traits for <code>if constexpr</code> dispatch</td></tr><tr><td><code>OTNNumericCast</code>, <code>OTNConvertNumber</code></td><td>Range checked number conversion for <code>any</code> columns</td></tr><tr><td><code>FileHeaderInfo</code>, <code>ObjectHeaderInfo</code>, <code>DefTable</code>, <code>WriteOptions</code>, <code>FilePosition</code></td><td>Data exchanged with the syntax layer, see <a class="doc-ref" href="#node_g8d1z5k3n7vxe2qb6ycu" data-ref-node="node_g8d1z5k3n7vxe2qb6ycu" title="Syntax Layer">Syntax Layer</a></td></tr></tbody></table></div>
<p>The parser and the syntax functions are only declared in the header (<code>CharSource</code>, <code>Tokenizer</code>, <code>ReadSyntax</code>) and defined in <code>OTNFile.cpp</code>.</p></div>
  </section>
  </div>
</template>
<template id="tmpl-node_mu55p95xcc3t1kyr59wt">
  <div class="main" data-node-id="node_mu55p95xcc3t1kyr59wt" data-tab-id="tab_mu55p95x1a6rhrm1czr561">
    <section id="node_mu55p95xcc3t1kyr59wt" class="export-section">
    
    <div class="export-section__body"><h1>Type Conversion</h1>
<p>C++ values are converted into <code>OTNValue</code>s when they are added to a row, and back when they are read.</p>
<h2>C++ to OTNValue</h2>
<p><code>Detail::OTNDataType&lt;T&gt;</code> converts one value. It is used by <code>OTNObject::AddDataRow</code>, <code>OTNObjectBuilder::AddData</code> and <code>OTNStreamWriter::WriteRow</code>.</p>
<div class="code-block-wrapper"><pre><code>AddDataRow(1, Vector2{ 1, 2 })
    OTNDataType&lt;int&gt;(1)            -&gt; int
    OTNDataType&lt;Vector2&gt;(v)        -&gt; OTNObjectBuilder + ToOTNDataType&lt;Vector2&gt;
                                   -&gt; shared_ptr&lt;OTNObject&gt; (one row)</code></pre><div class="code-language-tag code-language-tag--unrecognized">text</div></div>
<div class="table-wrapper"><table><thead><tr><th>C++ type</th><th>Stored as</th></tr></thead><tbody><tr><td><code>int</code>, <code>int64_t</code>, <code>uint64_t</code>, <code>float</code>, <code>double</code>, <code>bool</code>, <code>std::string</code></td><td>The same type</td></tr><tr><td><code>const char*</code>, string literal</td><td><code>std::string</code></td></tr><tr><td><code>uint32_t</code>, <code>unsigned int</code></td><td><code>int64_t</code></td></tr><tr><td><code>std::vector&lt;T&gt;</code>, <code>std::array&lt;T, N&gt;</code></td><td><code>Detail::OTNArray</code>, every element converted with <code>OTNDataType</code></td></tr><tr><td><code>OTNObject</code></td><td>Copy in a <code>shared_ptr&lt;OTNObject&gt;</code></td></tr><tr><td>Any other <code>T</code></td><td><code>ToOTNDataType&lt;T&gt;</code> through an <code>OTNObjectBuilder</code>, see <a class="doc-ref" href="#node_mu55p95x1mr9l481ystmfe" data-ref-node="node_mu55p95x1mr9l481ystmfe" title="OTNObjectBuilder">OTNObjectBuilder</a></td></tr></tbody></table></div>
<p>Errors (for example an invalid custom type) set <code>m_valid = false</code> in the <code>OTNDataType</code>, the row is then rejected.</p>
<h2>OTNValue to C++</h2>
<p><code>OTNObject::TryDeserializeValueImpl&lt;T&gt;(value, allowNumericConversion)</code> converts back:</p>
<div class="table-wrapper"><table><thead><tr><th>Target <code>T</code></th><th>Conversion</th></tr></thead><tbody><tr><td>Base type</td><td><code>std::get_if&lt;T&gt;</code>. In <code>any</code> columns numbers are converted with <code>Detail::OTNConvertNumber&lt;T&gt;</code> (range checked).</td></tr><tr><td><code>uint32_t</code>, <code>unsigned int</code></td><td>From the stored <code>int64_t</code>, range checked</td></tr><tr><td><code>std::vector&lt;E&gt;</code></td><td>Every element of the <code>OTNArray</code> converted to <code>E</code></td></tr><tr><td><code>OTNObject</code></td><td>Copy of the referenced object</td></tr><tr><td>Custom type</td><td><code>OTNObjectBuilder</code> in load mode, the object must have exactly one row</td></tr></tbody></table></div>
<p><code>allowNumericConversion</code> is <code>true</code> only for <code>any</code> columns, so a <code>float</code> column cannot be read as <code>double</code> by mistake.</p>
<h2>Number conversion</h2>
<p><code>Detail::OTNNumericCast&lt;To&gt;(from)</code> returns <code>std::nullopt</code> if the value does not fit:</p>
<ul><li>integer to integer: outside the range of <code>To</code>,</li><li>floating point to integer: not finite, has decimals or outside the range,</li><li>to floating point: always possible (may round).</li></ul>
<h2>Lists of objects</h2>
<p>An <code>OTNObject</code> with several rows can only be read as <code>std::vector&lt;T&gt;</code>. In memory the value is a list with one <code>OTNObject</code> per row after reading, because the file stores a list of row indices (see <a class="doc-ref" href="#node_mu55p95xweb2mx16dzzse" data-ref-node="node_mu55p95xweb2mx16dzzse" title="Writing Data">Writing Data</a>).</p></div>
  </section>
  </div>
</template>
<template id="tmpl-node_mu55p95x60r14y7tsvw1">
  <div class="main" data-node-id="node_mu55p95x60r14y7tsvw1" data-tab-id="tab_mu55p95x1a6rhrm1czr561">
    <section id="node_mu55p95x60r14y7tsvw1" class="export-section">
    
    <div class="export-section__body"><h1>OTNObject Internals</h1>
<p><code>OTNObject</code> holds the columns and all rows of one object. Readers and writers only work with <code>OTNObject</code>s, so this is the central data structure.</p>
<h2>Members</h2>
<div class="table-wrapper"><table><thead><tr><th width="190">Member</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td><code>m_name</code></td><td><code>std::string</code></td><td>Object name</td></tr><tr><td><code>m_columnNames</code></td><td><code>vector&lt;string&gt;</code></td><td>One name per column</td></tr><tr><td><code>m_columnTypes</code></td><td><code>vector&lt;OTNTypeDesc&gt;</code></td><td>One type per column, empty until set or deduced</td></tr><tr><td><code>m_dataRows</code></td><td><code>vector&lt;OTNRow&gt;</code></td><td>All rows, a row is a <code>vector&lt;OTNValue&gt;</code></td></tr><tr><td><code>m_columnIndexCache</code></td><td><code>unique_ptr&lt;unordered_map&lt;string, size_t&gt;&gt;</code></td><td>Column name to index, created and filled on the first lookup</td></tr><tr><td><code>m_deducedColumnTypes</code></td><td><code>bool</code></td><td>Column types are known (set or deduced)</td></tr><tr><td><code>m_wasBuildFromT</code></td><td><code>bool</code></td><td>Created by <code>OTNObjectBuilder</code> from a custom type</td></tr><tr><td><code>m_valid</code>, <code>m_error</code></td><td><code>bool</code>, <code>string</code></td><td>Error state</td></tr></tbody></table></div>
<h2>Adding rows</h2>
<p><code>AddDataRow(args...)</code> converts every argument with <code>Detail::OTNDataType&lt;T&gt;</code> (see <a class="doc-ref" href="#node_mu55p95xcc3t1kyr59wt" data-ref-node="node_mu55p95xcc3t1kyr59wt" title="Type Conversion">Type Conversion</a>) into an <code>OTNValue</code>. If one value fails, the row is not added and the object becomes invalid.</p>
<p>After the first row, <code>DeduceTypesFromRow</code> sets the column types that were not given with <code>SetTypes()</code>. <code>SetTypes</code> parses the type strings with <code>Detail::ParseTypeString</code>, the same function the readers use, see <a class="doc-ref" href="#node_w3f6j0p8u2lcy5mx9tbe" data-ref-node="node_w3f6j0p8u2lcy5mx9tbe" title="Types">Types</a>.</p>
<h2>Checks</h2>
<p>Always active:</p>
<ul><li><code>IsNameValid</code>: object, column and type names. Uses <code>Detail::IsNameStartChar</code> / <code>IsNameChar</code>, the same functions as the <code>Tokenizer</code>, so every valid name can be read again.</li><li><code>ValidateNamesDistinct</code>: no column name is used twice.</li><li><code>SetNames</code> / <code>SetTypes</code> before the first row, one value per column in <code>AddDataRow</code>.</li></ul>
<p>Only with <code>OTN_DEBUG</code> (costs time for every row):</p>
<ul><li><code>ValidateRowTypes</code>: every row has the types of its columns.</li></ul>
<p><code>OTNObjectBuilder::ToOTNObject</code> calls <code>ValidateRowTypes(0)</code> always if the custom type set types with <code>AddTypes</code>.</p>
<h2>Column lookup</h2>
<p><code>GetColumnID(name)</code> searches the column names and stores the result in <code>m_columnIndexCache</code>. The cache is cleared by <code>SetNames</code> and by copying, because it belongs to one object. It is only created on the first lookup, so objects that are never searched by name (for example resolved references) need no allocation for it.</p>
<h2>Reading values</h2>
<p><code>GetValue&lt;T&gt;</code> and <code>TryGetValue&lt;T&gt;</code> call <code>TryDeserializeValueImpl&lt;T&gt;(value, allowNumericConversion)</code>. The second argument is <code>IsAnyColumn(column)</code>: only in <code>any</code> columns numbers are converted to other number types (<code>Detail::OTNConvertNumber</code>, range checked). In all other columns the stored type must be <code>T</code>.</p>
<p><code>GetValue&lt;T&gt;</code> without default throws <code>std::out_of_range</code> or <code>std::bad_cast</code>, the other variants return the default or <code>std::nullopt</code>.</p>
<h2>Objects as values</h2>
<p>A value of type <code>OBJECT</code> holds a <code>std::shared_ptr&lt;OTNObject&gt;</code>. <code>m_wasBuildFromT</code> decides how a writer references it:</p>
<ul><li>Built from a custom type: always one row, referenced by one index (<code>Ref&lt;X&gt;</code>).</li><li>Normal <code>OTNObject</code>: all its rows are referenced (<code>Ref&lt;X&gt;[]</code>).</li></ul></div>
  </section>
  </div>
</template>
<template id="tmpl-node_mu55p95x1mr9l481ystmfe">
  <div class="main" data-node-id="node_mu55p95x1mr9l481ystmfe" data-tab-id="tab_mu55p95x1a6rhrm1czr561">
    <section id="node_mu55p95x1mr9l481ystmfe" class="export-section">
    
    <div class="export-section__body"><h1>OTNObjectBuilder</h1>
<p><code>OTNObjectBuilder</code> lets the same <code>ToOTNDataType&lt;T&gt;</code> specialization save and load a custom type. The constructor decides the direction.</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">OTNObjectBuilder</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">builder</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">          </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// saving:  T -&gt; OTNObject</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">OTNObjectBuilder</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">builder</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">obj</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">};</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">   </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// loading: OTNObject -&gt; T</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p><code>IsBuildingOTNObject()</code> returns <code>true</code> when saving.</p>
<h2>Saving (T to OTNObject)</h2>
<p>Used by <code>Detail::OTNDataType&lt;T&gt;</code> for every value of a custom type:</p>
<ol><li>A builder is created and <code>ToOTNDataType&lt;T&gt;(builder, value)</code> is called.</li><li><code>SetObjectName</code> stores the object name, <code>AddNames</code> the column names (unique, checked with <code>OTN_DEBUG</code>), <code>AddTypes</code> the type strings in <code>m_dataTypes</code>.</li><li><code>AddData</code> converts every member with <code>Detail::OTNDataType</code> into an <code>OTNValue</code>. Custom members create their own builder (recursion).</li><li><code>std::move(builder).ToOTNObject()</code> creates an <code>OTNObject</code> with one row and <code>m_wasBuildFromT = true</code>. If types were given, <code>SetTypesFromBuilder</code> parses them (missing types and <code>&quot;-&quot;</code> stay <code>UNKNOWN</code> and are deduced by the writers) and <code>ValidateRowTypes(0)</code> checks the values against them.</li></ol>
<h2>Loading (OTNObject to T)</h2>
<p>Used by <code>OTNObject::TryDeserializeValue&lt;T&gt;</code> when <code>T</code> is a custom type:</p>
<ol><li>The constructor copies the only row of the object into <code>m_data</code> and stores in <code>m_anyColumns</code> which columns have the type <code>any</code>. An object with zero or more than one row is an error.</li><li><code>ToOTNDataType&lt;T&gt;(builder, result)</code> is called on a default constructed <code>T</code>.</li><li><code>SetObjectName</code> checks that the name matches the stored object.</li><li><code>AddNames</code> and <code>AddTypes</code> do nothing.</li><li>Every <code>AddData(member)</code> takes the value at <code>m_dataPos</code>, converts it into the member type and moves <code>m_dataPos</code> forward. In <code>any</code> columns numbers are converted to the member type (<code>allowNumericConversion</code>), like <code>GetValue</code> does.</li></ol>
<p>Because values are taken by position, the order of <code>AddData</code> calls must be the same for saving and loading.</p>
<h2>AddNameData</h2>
<p><code>AddNameData(name, value)</code> calls <code>AddNames</code> and <code>AddData</code> for one column. It checks that the number of names and values is still the same (<code>IsDataOutOfSync</code>), which finds missing names or values in a specialization.</p>
<p><code>AddNameTypeData(name, type, value)</code> does the same with a type. Columns added before without a type get an empty type (deduced), so <code>AddNameTypeData</code> can be mixed with <code>AddNames</code> / <code>AddData</code>.</p>
<h2>Errors</h2>
<p>All errors are collected in the builder (<code>IsValid</code>, <code>GetError</code>). When saving, they make the value and therefore the row invalid. When loading, <code>TryGetValue</code> returns <code>std::nullopt</code>.</p></div>
  </section>
  </div>
</template>
<template id="tmpl-node_g8d1z5k3n7vxe2qb6ycu">
  <div class="main" data-node-id="node_g8d1z5k3n7vxe2qb6ycu" data-tab-id="tab_mu55p95x1a6rhrm1czr561">
    <section id="node_g8d1z5k3n7vxe2qb6ycu" class="export-section">
    
    <div class="export-section__body"><h1>Syntax Layer</h1>
<p>All knowledge about the file syntax is in one place: the region <code>Syntax</code> at the top of <code>OTNFile.cpp</code>. The four reader and writer classes never write or parse text themselves, they only exchange info structs with the syntax functions. A new format version therefore only needs new syntax functions.</p>
<h2>Info structs</h2>
<p>Declared in <code>OTNFile.h</code> in <code>OTN::Detail</code>, because the classes store them as members:</p>
<div class="table-wrapper"><table><thead><tr><th>Struct</th><th>Content</th></tr></thead><tbody><tr><td><code>FileHeaderInfo</code></td><td>Version, <code>defType</code> and <code>defName</code> tables</td></tr><tr><td><code>ObjectHeaderInfo</code></td><td>Object name, row count, column names and column types</td></tr><tr><td><code>DefTable</code></td><td>Numbers to names and back (<code>@defType</code> / <code>@defName</code>), <code>GetEntries()</code> sorted by number</td></tr><tr><td><code>WriteOptions</code></td><td><code>compact</code>: no spaces, line breaks and indentation</td></tr><tr><td><code>FilePosition</code></td><td>Offset, line and column in the file</td></tr></tbody></table></div>
<p>Write functions <strong>take</strong> an info struct and append text to a <code>std::string</code>. Read functions <strong>return</strong> an info struct (<code>std::optional</code>, empty on error).</p>
<h2>Reading: CharSource and Tokenizer</h2>
<div class="table-wrapper"><table><thead><tr><th>Class</th><th>Task</th></tr></thead><tbody><tr><td><code>CharSource</code></td><td>Characters from memory (<code>OpenMemory</code>) or from a file in 64 KB blocks, the last 4 used blocks are kept (<code>OpenFile</code>). <code>Available</code> / <code>Current</code> / <code>Skip</code> give direct access to the loaded chars. Can jump to a <code>FilePosition</code> (<code>Seek</code>).</td></tr><tr><td><code>Tokenizer</code></td><td>Creates tokens on demand from a <code>CharSource</code>: <code>Next</code>, <code>Peek</code>, <code>NextIf</code>, <code>Expect</code>. <code>Tell</code> / <code>Seek</code> save and restore the position. The text of a token is a <code>string_view</code> into the loaded chars, it is only copied for strings with escape sequences and tokens over a block border.</td></tr></tbody></table></div>
<p>All readers use the same tokenizer. <code>OTNReader</code> reads from memory, <code>OTNStreamReader</code> from the file. Errors contain the line and column of the token.</p>
<p><code>ReadVersion</code> first calls <code>SkipByteOrderMark</code>: a UTF-8 BOM is skipped (not counted as column), a file starting with <code>FF</code>, <code>FE</code> or <code>00</code> is rejected as UTF-16 / UTF-32.</p>
<p>An <code>IDENTIFIER</code> starts with a letter, <code>_</code> or a byte from <code>0x80</code> and continues with these and digits (<code>IsNameStartChar</code> / <code>IsNameChar</code>). <code>OTNObject::IsNameValid</code> uses the same functions, so the writers can only produce names the tokenizer can read.</p>
<p>Token types: <code>KEYWORD_PREFIX</code> (<code>@</code>), <code>IDENTIFIER</code>, <code>NUMBER</code>, <code>STRING</code>, <code>MINUS</code>, <code>COLON</code>, <code>EQUALS</code>, <code>COMMA</code>, <code>SLASH</code>, <code>SEMICOLON</code>, <code>BLOCK_BEGIN</code> / <code>BLOCK_END</code>, <code>LIST_BEGIN</code> / <code>LIST_END</code>, <code>REF_BEGIN</code> / <code>REF_END</code>, <code>REF_INDEX</code> (<code>#</code>, since version 2), <code>END_OF_FILE</code>.</p>
<h2>Versions</h2>
<p>Every format version has its own namespace with read and write functions. A newer version is defined after the older one and reuses everything that did not change:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">namespace</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">Detail</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// independent of the version</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">optional</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">uint8_t</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&gt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">ReadVersion</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">Tokenizer</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&amp;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">tok</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">&nbsp;</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">namespace</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">V1</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">        </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// read</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">        </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__namespace">std</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">::</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">optional</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&lt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">FileHeaderInfo</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&gt;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">   </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__function">ReadFileHeader</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">(</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">Tokenizer</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&amp;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">,</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">uint8_t</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">version</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">);</span>

<ul><li><strong>Writing</strong> always uses <code>Current</code>. A <code>static_assert</code> checks that <code>Current</code> matches <code>OTN::VERSION</code>.</li><li><strong>Reading</strong> first calls <code>ReadVersion</code>, then <code>GetReadSyntax(version)</code> returns the table of function pointers (<code>ReadSyntax</code>) for that version. Old files can therefore still be read after the format changed.</li></ul>
<h2>How V2 reuses V1</h2>
<p>Reading a value goes through <code>V1::ReadValue</code> → <code>V1::ReadList</code> → <code>ReadAnyValue</code>. Only the reading of <code>any</code> values changed in V2, so the value functions of V1 take a <code>V1::ValueContext</code>:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">struct</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">ValueContext</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">const</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">FileHeaderInfo</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__operator">&amp;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">file</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">  </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// for @defType ids</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">ReadAnyFunc</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">readAny</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">         </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__comment">// V1::ReadAnyValue or V2::ReadAnyValue</span>
<span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">}</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span></span></pre><div class="code-language-tag code-language-tag--recognized">cpp</div></div>
<p><code>V1::ReadRow</code> passes <code>V1::ReadAnyValue</code>, <code>V2::ReadRow</code> passes <code>V2::ReadAnyValue</code>. Everything else (lists, primitives, <code>Ref</code> columns) is the same code.</p>
<p><code>V2::ReadAnyValue</code> handles <code>Name#index</code> and <code>id#index</code> and passes all other values to <code>V1::ReadAnyValue</code>. <code>V2::ReadFileHeader</code> calls <code>V1::ReadFileHeaderImpl</code> with <code>allowObjectTypes = true</code>, so <code>@defType</code> can contain object names.</p>
<p>When writing, <code>V2::WriteValue</code> writes <code>OBJECT_REF</code> values (<code>Name#index</code>, the name replaced by its <code>@defType</code> id if there is one) and passes all other values to <code>V1::WriteValue</code>. The writers create <code>OBJECT_REF</code> values only for objects in <code>any</code> columns, in <code>Ref</code> columns they stay plain row indices.</p>
<p><code>V1::WriteColumnType</code> writes the <code>@defType</code> id of an object name if the table contains it. In version 1 files the table never contains object names, so V1 output does not change.</p>
<h2>Adding a version</h2>
<ol><li>Add <code>namespace V3</code> <strong>after</strong> <code>V2</code>. Functions that did not change are reused (<code>using V2::WriteObjectHeader;</code> or by calling them).</li><li>If a function deep in a call chain changes, pass it in like <code>ValueContext::readAny</code> instead of copying the whole chain.</li><li>Create <code>V3::READ_SYNTAX</code> with the new functions where something changed and the old ones otherwise.</li><li>Add <code>case 3</code> to <code>GetReadSyntax</code>.</li><li>Set <code>OTN::VERSION = 3</code> and <code>namespace Current = V3</code>, and update the <code>static_assert</code>.</li><li>If V3 needs new information, add fields to the info structs. Older versions leave them at their default.</li></ol>
<p>The classes do not have to be changed as long as the info structs contain everything they need.</p>
<h2>File grammar of V2</h2>
<div class="code-block-wrapper"><pre><code>file        = &quot;@version&quot; &quot;:&quot; NUMBER &quot;;&quot; header* &quot;@object&quot; &quot;:&quot; &quot;{&quot; object* &quot;}&quot; &quot;;&quot; EOF
header      = (&quot;@defType&quot; | &quot;@defName&quot;) &quot;:&quot; definition (&quot;,&quot; definition)* &quot;;&quot;
definition  = IDENTIFIER &quot;=&quot; NUMBER
object      = IDENTIFIER &quot;[&quot; NUMBER &quot;]&quot; &quot;{&quot; (column (&quot;,&quot; column)*)? &quot;}&quot; &quot;;&quot; row*
column      = type &quot;/&quot; name
type        = (IDENTIFIER | &quot;Ref&quot; &quot;&lt;&quot; IDENTIFIER &quot;&gt;&quot; | NUMBER) (&quot;[&quot; &quot;]&quot;)*
name        = IDENTIFIER | NUMBER
row         = value (&quot;,&quot; value)* &quot;;&quot;
value       = NUMBER | &quot;-&quot; NUMBER | STRING | &quot;true&quot; | &quot;false&quot; | reference | list
reference   = (IDENTIFIER | NUMBER) &quot;#&quot; NUMBER          (only in &#39;any&#39; columns)
list        = &quot;[&quot; (value (&quot;,&quot; value)*)? &quot;]&quot;</code></pre><div class="code-language-tag code-language-tag--unrecognized">text</div></div>
<p>The number of rows is given in the object header. A <code>NUMBER</code> as type or name is looked up in the <code>@defType</code> / <code>@defName</code> table. In <code>Ref&lt;Name&gt;</code> columns a value is only the row index (<code>NUMBER</code>).</p>
<p>Version 1 is the same without <code>reference</code>, and <code>@defType</code> may only contain the base types.</p></div>
  </section>

<template id="tmpl-node_mu55p95x18c549nhu7cu9">
  <div class="main" data-node-id="node_mu55p95x18c549nhu7cu9" data-tab-id="tab_mu55p95x1a6rhrm1czr561">
    <section id="node_mu55p95x18c549nhu7cu9" class="export-section">
    
    <div class="export-section__body"><h1>Writer Internals</h1>
<p>Both writers turn <code>OTNObject</code>s into rows with row indices instead of nested objects and pass them to the syntax functions of <code>Detail::Current</code> (see <a class="doc-ref" href="#node_g8d1z5k3n7vxe2qb6ycu" data-ref-node="node_g8d1z5k3n7vxe2qb6ycu" title="Syntax Layer">Syntax Layer</a>).</p>
<h2>OTNWriter</h2>
<p><code>Save()</code> / <code>SaveToString()</code> run three steps.</p>
<p><strong>1. CreateWriteData</strong></p>
<p>Every appended object is converted into a <code>SerializedObject</code> (column names, column types, rows). <code>AddObject</code> goes through all values:</p>
<ul><li>An <code>OBJECT</code> value is added to the <code>SerializedObject</code> of its name (recursively) and replaced by the row index it got. A normal <code>OTNObject</code> gives one index per row, so the column becomes a list (<code>Ref&lt;X&gt;[]</code>).</li><li>Lists are converted element by element.</li><li>With <code>UseDeduplicateRows</code>, <code>AddOrGetRow</code> looks up a hash of the row first. An identical row returns its existing index.</li></ul>
<p>Objects with the same name end up in the same <code>SerializedObject</code>. Afterwards <code>CountObjectType</code> counts how often every name is written:</p>
<ul><li>base types (<code>typeUsage</code>): columns with this type,</li><li>object names: <code>Ref&lt;X&gt;</code> columns (<code>objectColumnUsage</code>) and references <code>X#index</code> in <code>any</code> columns (<code>objectRefUsage</code>),</li><li>column names (<code>CreateDefName</code>): columns with this name.</li></ul>
<p><code>ChooseDefinitions</code> then decides which names get a number. All lengths are measured with the syntax functions (<code>Current::WriteObjectHeader</code>, <code>WriteRow</code>, <code>WriteFileHeader</code>), so the writer knows no syntax itself:</p>
<ol><li><code>DefSaving</code> writes one column / one reference with and without the number. The difference times the number of uses is the saving.</li><li>Candidates are sorted by saving, so the names that save the most get the smallest (shortest) numbers.</li><li>A name is added if its saving is more than the length of its entry in the table (<code>name = id, </code>).</li><li>At the end the table as a whole must also pay for the directive (<code>@defType: ;</code>), otherwise it is removed.</li></ol>
<p>So <code>UseDefType</code> / <code>UseDefName</code> never make a file longer.</p>
<p><strong>2. WriteHeader</strong></p>
<p><code>Current::WriteFileHeader</code> writes <code>@version</code> and the <code>@defType</code> / <code>@defName</code> tables.</p>
<p><strong>3. WriteBody</strong></p>
<p><code>WriteObjectBlockBegin</code>, then for every <code>SerializedObject</code> <code>WriteObjectHeader</code> and one <code>WriteRow</code> per row, then <code>WriteObjectBlockEnd</code>.</p>
<p>The text is collected in <code>WriterData::buffer</code>. <code>FlushBuffer</code> writes it to the file whenever it is larger than 64 KB, so memory use does not grow with the file size. <code>SaveToString</code> returns the buffer instead.</p>
<h2>OTNStreamWriter</h2>
<p>The stream writer does not know the final row counts while writing, and rows of different objects arrive mixed (a <code>WriteRow</code> with a <code>Vector2</code> value creates a <code>Vector2</code> row in between). The file needs every object as one block with its row count. Therefore:</p>
<p><strong>Temporary file</strong></p>
<p><code>Open()</code> creates <code>&lt;name&gt;.otn.tmp</code>. Every row is appended to it immediately. For every object the writer keeps an <code>ObjectBlock</code> in memory:</p>
<div class="code-block-wrapper"><pre class="syntax-definition-highlight"><span id="syntax-chunk-0"><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">struct</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__type">RowRange</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other">    </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">{</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">uint64_t</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">offset</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__keyword">uint64_t</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__identifier">length</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__other"> </span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">}</span><span class="token-type_CppLang_highlightStyle_CppLang_Dark__punctuation">;</span>
